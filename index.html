<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOID RUNNER</title>
<!-- Added to the home screen, the game is a standalone web app. That is not
     just cosmetic: WebKit exempts home-screen web apps from its 7-day wipe of
     script-writable storage, so an installed game keeps the player's name and
     recovery code instead of forgetting them after a week away. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05040c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Void Runner">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;height:100dvh;background:#05040c;overflow:hidden;overscroll-behavior:none;
  font-family:"Courier New",ui-monospace,monospace;color:#8fc9ff;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#nameIn{position:fixed;display:none;z-index:5;background:transparent;border:0;outline:0;
  color:transparent;caret-color:transparent;font-size:16px;padding:0;margin:0;
  -webkit-tap-highlight-color:transparent}
/* visibility:hidden until the first frame has been drawn - frame() turns it
   on. An element with no width or height attributes is 300x150 by default,
   and the browser lays that out and paints it the moment it parses this tag,
   which is BEFORE it has parsed the game below and run fit(). So a landscape
   block with this glow round it appeared in the middle of the screen for a
   moment on a cold load. Hidden, that moment is just the page background.
   visibility rather than display: a hidden element still has a box, so fit()
   can still measure, which display:none would have broken. */
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#05040c;
  box-shadow:0 0 40px rgba(50,120,255,.18);touch-action:none;display:block;
  visibility:hidden}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <!-- The name field is a real input so phones raise their own keyboard, but
       it is invisible: the canvas draws the text in the game's own font so the
       card still looks hand-pixelled. -->
  <input id="nameIn" type="text" maxlength="14" autocomplete="off"
         autocapitalize="characters" autocorrect="off" spellcheck="false">
  
</div>

'use strict';

/* ================= setup ================= */
var W=256;
/* The canvas follows the device's own aspect ratio, so a phone fills its
   screen instead of sitting in a letterboxed block. Clamped to the band the
   layout is designed for: 1.50x width (tablets, desktop windows) through
   2.20x (tall 20:9 phones). */
/* The canvas is shaped to the space it will actually be shown in, not to the
   raw viewport. Shaping it to the viewport and then fitting it into a smaller
   box left slack on one axis, which is where the black bars down the sides
   came from: the badge strip ate the height, so the scale dropped, and the
   width no longer reached the edges. Taking the strip off BEFORE choosing the
   shape means the fit is tight on both axes. */
function freeBox(){
  var vw=(window.visualViewport&&window.visualViewport.width)||window.innerWidth||360;
  var vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight||680;
  return {w:Math.max(80,vw),h:Math.max(80,vh-badgeInset())};
}
function pickH(){
  var b=freeBox(),a=b.h/b.w;
  if(!(a>0.2&&a<8))a=1.90;
  return Math.round(W*Math.max(1.50,Math.min(2.20,a))/2)*2;
}
var H=pickH();
/* Balance was tuned on a 352-tall field. A taller field means a longer
   descent, so every vertical speed scales with it and the time you get to
   react is identical on every device. */
var REF_H=352, VS=H/REF_H;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var nameIn=document.getElementById('nameIn');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;ctx.textBaseline='top';

/* Fill the viewport. Integer scales keep pixels perfectly square, so snap to
   one when it costs almost nothing - otherwise take the fractional scale and
   the screen real estate. The old code floored unconditionally, which turned
   a 1.47x phone fit into 1x and left the game tiny. */
/* The host's own badge sits fixed in the bottom-right corner and swallows
   touches there, which is exactly where a thumb steers the ship. Keep the
   canvas clear of it rather than hiding it: the strip below the canvas is
   where the badge lives. */
function badgeInset(){
  /* fit() runs at startup, so this must never throw */
  var h='';
  try{h=(window.location&&window.location.hostname)||'';}catch(e){}
  return (h.indexOf('netlify')>=0)?58:0;
}
/* The last viewport height measured with no keyboard over it. */
var lastFreeH=0;
function fit(){
  var vw=(window.visualViewport&&window.visualViewport.width)||window.innerWidth;
  var vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  /* An on-screen keyboard shrinks visualViewport, and refitting to what is
     left shrank the whole game to a postage stamp: you could still type, but
     RECOVER and CANCEL were then far too small to hit. While a field is open
     the canvas keeps the size it had before the keyboard appeared, and the
     keyboard simply covers the bottom of it. */
  var typing=(askName===true&&promptMode!=='show');
  if(typing){ if(lastFreeH)vh=Math.max(vh,lastFreeH); }
  else lastFreeH=vh;
  var inset=badgeInset();
  /* no slack margin: the shape already matches this box, so any margin here
     is a black bar the player can see */
  var avW=Math.max(80,vw),avH=Math.max(80,vh-inset);
  var s=Math.min(avW/W,avH/H);
  var si=Math.floor(s);
  if(si>=1&&si/s>=0.97)s=si;                 /* crisp only when it is nearly free */
  cv.style.width=Math.round(W*s)+'px';
  cv.style.height=Math.round(H*s)+'px';
  /* the canvas centres inside #wrap, so padding there lifts it clear of the
     strip; body padding would do nothing, #wrap is position:fixed */
  var wrap=document.getElementById('wrap');
  if(wrap)wrap.style.paddingBottom=inset+'px';
  placeNameInput();
}

window.addEventListener('orientationchange',function(){setTimeout(fit,120);});

function mk(rows,over){
  var h=rows.length,w=rows[0].length;
  var c=document.createElement('canvas');c.width=w;c.height=h;
  var x=c.getContext('2d');
  for(var y=0;y<h;y++)for(var i=0;i<w;i++){
    var ch0=rows[y].charAt(i),col=(over&&over[ch0])||PAL[ch0];
    if(col){x.fillStyle=col;x.fillRect(i,y,1,1);}
  }
  return c;
}

  var c=document.createElement('canvas');c.width=src.width;c.height=src.height;

  return c;
}

];
var ROT=10;
/* Meteors are out of the game for now. The subsystem below is left intact
   but never fed: no plan, no spawns, no setting. Flipping this to true is all
   it takes to bring them back, so nothing had to be torn out of collision,
   drawing or the spawn-fairness guard. The sprite build is skipped too - it
   was 240 rasterisations at boot for sprites nothing would draw. */
var METEORS_ON=false;
for(var ri=0;METEORS_ON&&ri<ROCKS.length;ri++){
  ROCKS[ri].shapes=[];
  ROCKS[ri].lit=[];
  for(var si=0;si<3;si++){
    var base=rockSprite(ROCKS[ri].r,si*1.37+ri*0.61);

/* ================= player / weapon ================= */
/* A shot does 10, and every health value below is ten times its shot count -
   so a 110 brute is eleven shots, same as it was when health WAS the shot
   count. Starting a run on 1 damage made the numbers legible but it also made
   every damage number on screen read "1", and reaching 100,000 from 10 is a
   better arc than reaching it from 1.
   Nothing about the balance moved in that change: health went up by exactly
   the ten that damage did, so the shot counts and the time to kill are
   identical either way.
   Two scales hang off this and they are NOT the same number. HEALTH-like
   values (alien hp, absorb pools, rock hp, debris damage) are in health.
   DAMAGE-like values (a carapace's flat reduction, the floor below) are
   measured against a single shot and scale with DMG. Mixing them up quietly
   breaks the carapace. */
var DMG=10,FIRE_RATE=10,BULLET_SPD=Math.round(270*VS);
/* The least a shot can ever do: a tenth of one. Derived from DMG rather than
   written as a literal, because as a literal it was a tenth of a shot at
   DMG 10 and a WHOLE shot at DMG 1 - which floored flat reduction and the
   ARMOURED affix into doing nothing at all. */
var DMG_MIN=DMG*0.1;
/* Three hearts is the whole hull, start and ceiling both. A boss can mend you
   back to three but never past it, so the hull is a thing you protect rather
   than a bar you grow. */
var SHIP_SPD=360,SHIP_Y=H-Math.round(52*VS),START_LIVES=3,MAX_LIVES=3,INVULN=2.0;
/* ===== hull =====
   Hearts are four segments each, and the hull is counted in segments, so the
   roster's weight range finally shows up in what a touch costs you: a mite
   clipping your wing and a colossus flattening you used to be identical.
   Three hearts is twelve segments; the cap is five hearts, twenty. */
var SEG=4,START_HP=START_LIVES*SEG,MAX_HP=MAX_LIVES*SEG;
var HULL_DMG={mite:1,scout:2,phantom:2,drone:3,splitter:3,diver:3,knitter:3,
              brute:4,bulwark:4,carapace:4,colossus:6};
/* One instance this big buys the full setback: the formation shoved back and a
   long look at an empty screen. Four mites still cost four segments between
   them and buy nothing, because the rule is per touch, not cumulative. */
var SETBACK_AT=4;
/* Contact is gated on invT, so without a mercy window on small hits you would
   take one touch PER FRAME - sixty segments a second, dead in a fifth of a
   second against a crowd of mites. Chip damage gets a brief window and
   nothing else: no push-back, no respawn, so it can never be used as a way
   out of a bad screen the way a real death can. */
var CHIP_INVULN=0.6;
function hullDmg(t){
  if(!t)return SEG;
  var d=HULL_DMG[t.key];
  return (d===undefined)?SEG:d;        /* anything unlisted costs a whole heart */
}
function hearts(){return Math.ceil(hp/SEG);}
/* A card screen can land with a rock already on top of you, and the time
   spent reading three cards is time you could not spend dodging. Half a
   second back on the other side is enough to move out of the way and not
   enough to walk through anything. */
var LVL_INVULN=0.5;
/* A card screen opens on top of wherever the player's thumb already is. The
   ship sits at y472 and the third card's band is y447-499, so the hand that
   was dragging to dodge is ALREADY inside a card: the next touch - the natural
   one, right where the thumb is - picked that card instantly, and with two or
   three levels banked each re-touch took the next one. The cards were never
   read, let alone chosen. So a new card screen ignores input for a moment. */
var LVL_LOCK=0.28,lvlLock=0;
/* The cards used to appear fully formed in one frame. They now rise and
   fade in over exactly the lock window, so the screen comes to rest at the
   same moment it starts accepting taps. */
var LU_ANIM=LVL_LOCK,luAnim=LU_ANIM,luT=0;
/* The spawn fairness guard keeps the OLD 240 budget on purpose: the faster keys
   are a pure buff, not an excuse to spawn tighter patterns. */
var LINE_Y=SHIP_Y+SHIP_H/2;   /* the line every meteor must cross */
/* Run-scoped roguelite multipliers. SHIP_SPD above stays the BASE speed and is
   what the fairness guard reasons about, so move-speed upgrades buy real slack
   instead of licensing the spawner to place tighter gaps. */
var upFire=1,upDmg=1,upLuck=0,upCrit=0,upCritD=1.1,upXp=1,shield=false;
var dmgNumbers=true,autoLevel=false,mouseSteer=true;
try{var _dn=localStorage.getItem('vr_dmgnum');if(_dn!==null)dmgNumbers=(_dn==='1');}catch(e){}
try{var _ms=localStorage.getItem('vr_msteer');if(_ms!==null)mouseSteer=(_ms==='1');}catch(e){}
/* A real mouse, not a finger. Only such a machine is offered the steering
   switch, because on a phone the row would be a setting for hardware that is
   not there. */
function hasMouse(){
  try{return !!(window.matchMedia&&window.matchMedia('(pointer: fine)').matches);}
  catch(e){return false;}
}
try{var _al=localStorage.getItem('vr_auto');if(_al!==null)autoLevel=(_al==='1');}catch(e){}
function fireGap(){return 1/(FIRE_RATE*upFire);}
function bulletDmg(){return DMG*upDmg;}
function pct(m){return Math.round((m-1)*100);}

/* ================= waves ================= */
var VERSION='V2.68';
var MAXWAVE=100;
/* Difficulty is carried by HP, speed, concurrency and spawn rate rather than
   by ever-longer waves, so a late wave is savage but still finishes. */
/* The 1-100 dials live here, in one place. The insanity formulas anchor on
   their own wave-100 values, and those used to be written out again as
   literals - so retuning the early curve silently moved the handover out of
   step with it. Both read these now.
   The shape changed: volume used to stop growing at wave 20 (36 enemies, 9 on
   screen) and the gap actually LOOSENED from wave 35 on, because its floor
   rose with the roster tier. So from wave 20 to 100 the only thing escalating
   was WHAT arrived, not how much, and a good build outran that by wave 50.
   Volume now keeps climbing the whole way and the gap only ever tightens.
   Waves 1-20 are left where they were - that part was never the problem.
   The caps used to bite long before the gate: volume stopped at wave 73, the
   gap at 50, concurrency at 55. So waves 55-100 escalated only in health and
   speed, and by 100 a built ship one-taps most of what arrives - measured at
   5.7x more damage than the wave asks for. The formulas themselves kept
   climbing the whole way; it was only the caps clipping them. Relaxed, they
   give wave 100 about 33 arrivals a second against 5.9, which is roughly the
   5.7x that was going spare.
   Every cap still binds at wave 50 or later, so nothing at or below that
   moves - the early game is a separate problem and is not touched here. */
function baseTotal(w){return Math.min(260,Math.round(5+(w-1)*1.45));}
function baseConc(w){return Math.min(40,2+Math.floor((w-1)/3));}
function baseGap(w){return Math.max(0.030,1.60*Math.pow(0.955,w-1));}
/* Health COMPOUNDS, at one rate, for every wave in the game. One line, no
   knee, no second rule at the gate: INS_HP is this same number, so wave 101
   is 4% up on wave 100 exactly as wave 7 is 4% up on wave 6, and the curve
   past the gate is the identical curve continued.
   It compounds because the PLAYER compounds and health did not. DAMAGE and
   CRIT DAMAGE are both multiplier ladders with crit chance filling in
   behind them, so damage per bullet MULTIPLIES about 5% a wave: measured on
   a median run it goes from 62 to 774 between waves 50 and 90, a 12.5x
   climb, while health added its way from 3.45x to 5.45x, a 1.6x one. A sum
   cannot chase a product, and the gap was the whole bug - by wave 90 the
   toughest thing on screen died to 0.7 of one bullet, under a single frame,
   so a colossus and a scout were the same object and the roster the back
   half exists to show off was being deleted on contact.
   An earlier pass fixed that with a knee: linear to wave 50, compounding
   after. It measured fine and it was wrong. A knee is a boundary the player
   cannot see, so the game changes character at a wave with nothing on it -
   and the curve either side of it was two rules to keep in step. This is
   one rule, and the only boundary left is wave 100, which the player can
   see and which is about affixes and spawn rate rather than health.
   4% is chosen against what it costs the EARLY game, not the late one. It
   tracks the old linear curve to within 10% out to about wave 21 - under it
   for the first thirteen waves, over it after - so waves 1-20, the part
   that was never the problem, are where they were. From there compounding
   has had time to bite: wave 50 carries 6.8x rather than 3.45x, wave 100
   48.6x rather than 5.95x, and the toughest alien holds three to six frames
   through the back half instead of collapsing to half of one.
   Raising it is tempting and the cost lands in the wrong place: 4.36%
   reaches the same wave-100 figure the knee did, but it makes wave 40 79%
   tankier rather than 56%, and waves 20-40 are where runs actually end. */
function baseHp(w){return Math.pow(HP_GROW,w-1);}
function baseSpd(w){return Math.min(2.6,1+(w-1)*0.030);}
function waveDef(w){
  var boss=(w+1)%10===0,wave=w+1;
  var ind=insDepth(wave);
  var total=baseTotal(wave);
  /* Past the gate the wave keeps growing. The base 36 is dealt from the roster
     as always; everything above that is swarm, added after the deal. */
  var swarm=(ind>0)?Math.max(0,Math.min(INS_TOTAL_MAX,
      Math.round(baseTotal(MAXWAVE)+ind*INS_TOTAL_PER))-total):0;
  if(boss){total=Math.max(4,Math.round(total*0.45));  /* the boss is the wave */
           swarm=Math.round(swarm*0.45);}
  /* The mix is dealt from whatever the roster has unlocked by this wave,
     weighted so the newest arrivals dominate and the old guard thins out
     without ever disappearing. Difficulty comes from WHAT is on screen
     rather than simply more of it. */
  var ws=(wave>MAXWAVE?insWeights(wave):rosterWeights(wave)),tot=0,i,mix={};
  for(i=0;i<ws.length;i++)tot+=ws[i].w;
  var left=total,acc=0;
  for(i=0;i<ws.length;i++){
    acc+=ws[i].w;
    /* largest-remainder down the list, so the counts always sum to total */
    var upto=Math.round(total*acc/tot),n=Math.max(0,upto-(total-left));
    if(i===ws.length-1)n=left;
    n=Math.min(n,left);mix[ws[i].k]=n;left-=n;
  }
  /* waves 1-10 must never be empty of the only two kinds they have */
  if(!boss&&(mix.scout||0)+(mix.drone||0)===0&&total>0){mix.scout=1;}
  /* The swarm on top, spread evenly over the uncapped kinds so it can actually
     reach the screen. Dealing it through the roster weights instead would send
     most of it to heavies, which are capped at six on screen between them and
     would just back the spawner up. */
  if(swarm>0){
    var sk=INS_SWARM,si;
    for(si=0;si<swarm;si++){
      var k=sk[si%sk.length];
      mix[k]=(mix[k]||0)+1;
    }
    total+=swarm;
  }
  /* Insanity takes over the dials past wave 100. Each one is anchored to its
     own wave-100 value computed from the formulas below, so retuning the
     1-100 curve carries straight through to the handover. */
  if(ind>0){
    var hp100=baseHp(MAXWAVE),gap100=baseGap(MAXWAVE),
        conc100=baseConc(MAXWAVE),spd100=baseSpd(MAXWAVE);
    return {mix:mix,boss:boss,total:total,ins:ind,
      aff:insAffixCount(wave),affp:insAffixPower(wave),
      conc:Math.min(INS_CONC_MAX,conc100+Math.floor(ind/INS_CONC_EVERY))+(boss?2:0),
      gap:Math.max(INS_GAPMIN,gap100*Math.pow(INS_GAP,ind)),
      hp:hp100*Math.pow(INS_HP,ind),
      spd:Math.min(INS_SPD_MAX,spd100*Math.pow(INS_SPD,ind))};
  }
  return {mix:mix,boss:boss,total:total,ins:0,aff:0,affp:1,
    conc:baseConc(wave)+(boss?2:0),
    gap:baseGap(wave),
    /* The roster now carries the escalation - wave 60 is fought against
       things wave 10 never saw - so the blanket health multiplier no longer
       has to do that job on its own. At 0.12 the new heavies compounded with
       it and nothing past wave 25 was survivable. */
    hp:baseHp(wave),
    spd:baseSpd(wave)};
}
function meteorPlan(w){
  if(!METEORS_ON)return null;
  if(w<1)return null;
  /* Fixed for the whole run: the rocks are a constant background hazard, and
     the escalation is carried by the aliens instead. */
  return {gap:3.0,max:3,spd:1.0};
}

/* ================= levelling ================= */
/* Luck alone decides the odds - see rarityWeights - so there are no weights
   here to state. The tiers carry a name and a colour and nothing else; a w
   field would sit here looking authoritative while doing nothing, which is
   exactly what the old one did. */
var RARITY=[{k:'COMMON',col:'#9aa7b5'},
            {k:'RARE',col:'#4fa3ff'},
            {k:'ULTRA RARE',col:'#c86bff'},
            {k:'INSANITY',col:'#ffb03a'}];
var CARDS=3;
var UPGRADES=[
  {id:'fire',  name:'FIRE RATE', kind:'mult',vals:[5,9,15,25], w:10},
  {id:'dmg',   name:'DAMAGE',    kind:'mult',vals:[6,11,18,30],w:10},
  /* Luck compounds: more luck deals rarer cards, and a rarer luck card is
     worth more, so the card's own value and where a run ends up are not the
     same size of change. At [3,6,10,16] a wave-100 run sat around 160% luck,
     only just into the band where rares lead, which left most of the curve
     unseen. [4,7,12,19] put it near 240%; these land it near 420%, measured
     with the rare head start in place. Even steps of 5 on purpose. */
  {id:'luck',  name:'LUCK',      kind:'add', vals:[5,10,15,25], w:8},
  {id:'crit',  name:'CRIT CHANCE',kind:'add',vals:[3,5,9,15],  w:8},
  {id:'critd', name:'CRIT DAMAGE',kind:'mult',vals:[10,18,28,45],w:8},
  {id:'xp',    name:'XP GAIN',    kind:'mult',vals:[10,20,32,50],w:9},
  /* off:true is dealt to nobody. The shield MECHANIC is untouched - it still
     absorbs a whole touch, still clears the room, grantUpgrade still knows how
     to grant it - so putting the card back is a matter of dropping this flag.
     Hearts are not on the table either; a boss is the only way to get one. */
  {id:'shield',name:'SHIELD',    kind:'once',fixed:1,w:6,off:true}
];
function upById(id){
  for(var i=0;i<UPGRADES.length;i++)if(UPGRADES[i].id===id)return UPGRADES[i];
  return null;
}
/* Kept for when the shield card comes back; nothing reads it while the card
   is flagged off. */
var P_SHIELD=0.25;
/* The odds of each rarity being offered, as a table of anchor points with a
   smooth curve drawn through them.
   It used to be a formula - a window sliding along the rarity ladder, with a
   starting mix blended in underneath and a floor under the spread. Three
   mechanisms stitched together, and every seam showed: the first four luck
   cards once did literally nothing (0% and 20% luck dealt identical odds),
   and where the floor let go the odds suddenly moved three times faster.
   Each fix was a patch on the last patch.
   The table has no seams because there is nothing to stitch. Every row is a
   mix someone chose, the curve joins them, and tuning is moving a number
   rather than reasoning about spreads and warps. Rows must each sum to 100
   and must not let any tier fall as luck rises; luckCheck below enforces
   both, and the tests read this table rather than restating it. */
var LUCK_FULL=1000;
/* luck%, then the mix at that luck: common / rare / ultra / insanity */
var LUCK_AT =[0,  50, 100, 150, 200, 250, 400, 600, 800,  1000];
var LUCK_MIX=[[95,  4,  0.9, 0.1],
              [60, 33,  6,   1  ],
              [38, 48, 12,   2  ],
              [28, 52, 17,   3  ],
              [21, 53, 21,   5  ],
              [16, 51, 26,   7  ],
              [ 8, 38, 40,  14  ],
              [ 3, 18, 49,  30  ],
              [0.5, 5, 40,  54.5],
              [ 0,  0,  0, 100  ]];
/* Fritsch-Carlson monotone cubic. Monotone is the whole point: an ordinary
   spline overshoots between anchors, and an overshoot here means a tier's
   odds DIPPING as luck rises - the one thing a luck curve must never do, and
   exactly the bug that was reported from play. */
function luckAt(col,x){
  var n=LUCK_AT.length,k=0;
  if(x<=LUCK_AT[0])return LUCK_MIX[0][col];
  if(x>=LUCK_AT[n-1])return LUCK_MIX[n-1][col];
  while(x>LUCK_AT[k+1])k++;
  var h=LUCK_AT[k+1]-LUCK_AT[k];
  var y0=LUCK_MIX[k][col],y1=LUCK_MIX[k+1][col],d=(y1-y0)/h;
  var dl=k>0?(y0-LUCK_MIX[k-1][col])/(LUCK_AT[k]-LUCK_AT[k-1]):d;
  var dr=k<n-2?(LUCK_MIX[k+2][col]-y1)/(LUCK_AT[k+2]-LUCK_AT[k+1]):d;
  var m0=(dl*d<=0)?0:2*dl*d/(dl+d);
  var m1=(d*dr<=0)?0:2*d*dr/(d+dr);
  var t=(x-LUCK_AT[k])/h,t2=t*t,t3=t2*t;
  return y0*(2*t3-3*t2+1)+h*m0*(t3-2*t2+t)+y1*(-2*t3+3*t2)+h*m1*(t3-t2);
}
function rarityWeights(){
  var n=RARITY.length,L=Math.max(0,Math.min(LUCK_FULL,upLuck)),w=[],i,t=0,v;
  if(L>=LUCK_FULL){for(i=0;i<n;i++)w.push(0);w[n-1]=1;return w;}
  for(i=0;i<n;i++){v=luckAt(i,L);if(!(v>0))v=0;w.push(v);t+=v;}
  if(!(t>0)){for(i=0;i<n;i++)w[i]=0;w[0]=1;return w;}   /* never deal nothing */
  for(i=0;i<n;i++)w[i]/=t;
  return w;
}
function rollRarity(){
  var w=rarityWeights(),tot=w[0]+w[1]+w[2]+w[3],r=Math.random()*tot,acc=0;
  for(var i=0;i<4;i++){acc+=w[i];if(r<acc)return i;}
  return 0;
}
/* A level used to cost 60+40(L-1) - linear, forever. Your XP multiplier also
   grows roughly linearly with how many levels you have had, so income over
   cost was a CONSTANT: you kept levelling at the same rate however deep you
   got, and deep in a run that rate is hundreds of levels a wave. Every one is
   another card, and some of those cards are more XP. The curve never caught up
   with the loop feeding it, which is how runs reached x550 XP and 7000% luck.
   So it stays exactly linear for the first fifteen levels - the stretch a new
   player spends the whole early game in, and which was never the problem - and
   compounds past that. At level 20 it is 6% dearer than before, at 30 about
   17%, and from there the gap widens enough to hold the loop in check. */
var XP_KNEE=15,XP_RAMP=0.35;
function xpForLevel(L){
  var n=L-1;
  return Math.round(60+40*n*Math.pow(Math.max(1,n/XP_KNEE),XP_RAMP));
}

/* ================= audio ================= */
var AC=null;
/* master / music / bullets, each with its own switch and level */
var onMaster=true,onMusic=true,onShot=true;
var sndMaster=1.0,sndMusic=1.0,sndShot=1.0;
try{var _sv=JSON.parse(localStorage.getItem('vr_snd')||'null');
  if(_sv){onMaster=!!_sv.a;onMusic=!!_sv.b;onShot=!!_sv.c;
    sndMaster=+_sv.d;sndMusic=+_sv.e;sndShot=+_sv.f;}}catch(e){}
function saveSnd(){try{localStorage.setItem('vr_snd',JSON.stringify(
  {a:onMaster,b:onMusic,c:onShot,d:sndMaster,e:sndMusic,f:sndShot}));}catch(e){}}
function vmul(){return onMaster?sndMaster:0;}
function musVol(){return vmul()*(onMusic?sndMusic:0);}
function shotVol(){return vmul()*(onShot?sndShot:0);}
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function beep(f,dur,vol,type,slide,ch){
  var lv=vol*vmul()*(ch===undefined?1:ch);
  if(lv<=0.0002)return;
  var a=ac();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,a.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),a.currentTime+dur);
  g.gain.setValueAtTime(lv,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);
}
/* The card screen has no sound of its own. It had a sustained chord, which
   went the way of the arpeggio before it: the game's own music keeps playing
   through a level-up now, and that is all it needs. */
/* white noise pushed through a sweeping filter - this is what gives the
   explosions body instead of the thin beeps they were before */
function burstNoise(dur,vol,f0,f1,q,type){
  if(vol*vmul()<=0.0002)return;var a=ac();if(!a)return;
  var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.8);
  var src=a.createBufferSource();src.buffer=b;
  var flt=a.createBiquadFilter();flt.type=type||'lowpass';
  flt.frequency.setValueAtTime(f0,a.currentTime);
  flt.frequency.exponentialRampToValueAtTime(Math.max(60,f1),a.currentTime+dur);
  if(q)flt.Q.value=q;
  var g=a.createGain();g.gain.value=vol*vmul();
  src.connect(flt);flt.connect(g);g.connect(a.destination);src.start();
}
function noise(dur,vol){
  if(vol*vmul()<=0.0002)return;var a=ac();if(!a)return;
  var n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();
  s.buffer=buf;g.gain.value=vol*vmul();s.connect(g);g.connect(a.destination);s.start();
}
/* Past about thirty shots a second the individual cracks stop resolving and
   smear into a buzz - the envelopes overlap faster than they decay. So the
   SOUND is capped there while the fire rate keeps climbing: it builds up to
   thirty a second and then holds, which is as dense as it can read anyway. */
/* 32 rather than 30: the gate is checked once a frame, so at 60fps a limit
   of exactly 30 also clips a gun firing AT 30 a second. A hair above lets
   thirty through cleanly and still holds the ceiling at thirty. */

/* ================= music: 4-bar chiptune loop, square lead + bass + noise kit
   scheduled ahead of the audio clock so it stays in time regardless of fps ==== */
var A2=110,F2=87.31,G2=98,E2=82.41;
var LEAD=[
 220,261.63,329.63,440,   329.63,261.63,220,164.81,
 220,261.63,329.63,440,   493.88,440,329.63,261.63,
 174.61,220,261.63,349.23,261.63,220,174.61,130.81,
 196,246.94,293.66,392,   293.66,246.94,196,146.83];
var BASS=[
 A2,0,A2,0,A2,0,A2,A2, A2,0,A2,0,A2,A2,A2,0,
 F2,0,F2,0,F2,0,F2,F2, G2,0,G2,0,G2,G2,E2,0];
var MUS={playing:false,step:0,nextT:0,timer:null,bpm:104,stage:0},musicGain=null;
function mgain(){
  var a=ac();if(!a)return null;
  if(!musicGain){musicGain=a.createGain();musicGain.gain.value=0.5*musVol();musicGain.connect(a.destination);}
  return musicGain;
}
function mtone(f,at,dur,vol,type,dest){
  if(!f)return;var a=ac();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,at);
  g.gain.setValueAtTime(0.0001,at);
  g.gain.linearRampToValueAtTime(vol,at+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g);g.connect(dest);o.start(at);o.stop(at+dur+0.02);
}
function mkick(at,dest){
  var a=ac();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.setValueAtTime(140,at);
  o.frequency.exponentialRampToValueAtTime(45,at+0.11);
  g.gain.setValueAtTime(0.16,at);g.gain.exponentialRampToValueAtTime(0.0001,at+0.13);
  o.connect(g);g.connect(dest);o.start(at);o.stop(at+0.15);
}
function mhat(at,dest,loud){
  var a=ac();if(!a)return;
  var n=Math.floor(a.sampleRate*0.03),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var src=a.createBufferSource(),g=a.createGain();
  src.buffer=b;g.gain.value=(loud?0.05:0.022)*musVol()*2;
  src.connect(g);g.connect(dest);src.start(at);
}
function syncVol(){if(musicGain)musicGain.gain.value=0.5*musVol();}
function msnare(at,dest){
  var a=ac();if(!a)return;
  var n=Math.floor(a.sampleRate*0.13),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  var src=a.createBufferSource();src.buffer=b;
  var f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1900;f.Q.value=0.8;
  var g=a.createGain();g.gain.value=0.085;
  src.connect(f);f.connect(g);g.connect(dest);src.start(at);
}
function mstab(at,dest,root,beat){
  if(!root)return;
  mtone(root*2,at,beat*1.6,0.022,'square',dest);
  mtone(root*3,at,beat*1.6,0.015,'square',dest);
}
/* The track is built in layers that switch on as the waves climb: it opens
   with a half-time bass and a sparse kick, then gains hats, the lead line,
   an octave double, a backbeat and finally chord stabs. */
function musStage(w){
  if(w<2)return 0;
  if(w<6)return 1;
  if(w<12)return 2;
  if(w<22)return 3;
  if(w<40)return 4;
  return 5;
}
function musicTick(){
  var a=ac(),g=mgain();
  if(!a||!g||!MUS.playing)return;
  var beat=60/MUS.bpm/2,S=MUS.stage;
  while(MUS.nextT<a.currentTime+0.14){
    var st=MUS.step%32,at=MUS.nextT,bn=BASS[st];

    if(S===0&&st%2===1)bn=0;                       /* half-time bass when calm */
    mtone(bn,at,beat*0.85,0.075,'square',g);

    if(S>=2)mtone(LEAD[st],at,beat*0.78,0.034,'square',g);
    if(S>=4&&LEAD[st])mtone(LEAD[st]*2,at,beat*0.45,0.015,'square',g);
    if(S>=3&&!bn&&BASS[(st+31)%32])
      mtone(BASS[(st+31)%32]*2,at,beat*0.40,0.030,'square',g);   /* bass fill */

    if(S===0){if(st%8===0)mkick(at,g);}
    else if(st%4===0)mkick(at,g);
    if(S>=4&&st%8===6)mkick(at,g);

    if(S>=1&&st%2===1)mhat(at,g,st%8===5);
    if(S>=5&&st%2===0)mhat(at,g,false);

    if(S>=4&&st%8===4)msnare(at,g);
    if(S>=5&&st%16===0)mstab(at,g,BASS[st],beat);

    MUS.nextT+=beat;MUS.step++;
  }
}
MUS.start=function(){
  var a=ac();if(!a)return;mgain();
  MUS.playing=true;MUS.step=0;MUS.nextT=a.currentTime+0.06;
  if(!MUS.timer)MUS.timer=setInterval(musicTick,25);
  musicTick();
};
MUS.stop=function(){
  MUS.playing=false;
  if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null;}
};
