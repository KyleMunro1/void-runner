<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOID RUNNER</title>
<!-- Added to the home screen, the game is a standalone web app. That is not
     just cosmetic: WebKit exempts home-screen web apps from its 7-day wipe of
     script-writable storage, so an installed game keeps the player's name and
     recovery code instead of forgetting them after a week away. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05040c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Void Runner">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;height:100dvh;background:#05040c;overflow:hidden;overscroll-behavior:none;
  font-family:"Courier New",ui-monospace,monospace;color:#8fc9ff;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#nameIn{position:fixed;display:none;z-index:5;background:transparent;border:0;outline:0;
  color:transparent;caret-color:transparent;font-size:16px;padding:0;margin:0;
  -webkit-tap-highlight-color:transparent}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#05040c;
  box-shadow:0 0 40px rgba(50,120,255,.18);touch-action:none;display:block}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <!-- The name field is a real input so phones raise their own keyboard, but
       it is invisible: the canvas draws the text in the game's own font so the
       card still looks hand-pixelled. -->
  <input id="nameIn" type="text" maxlength="14" autocomplete="off"
         autocapitalize="characters" autocorrect="off" spellcheck="false">
  
</div>

'use strict';

/* ================= setup ================= */
var W=256;
/* The canvas follows the device's own aspect ratio, so a phone fills its
   screen instead of sitting in a letterboxed block. Clamped to the band the
   layout is designed for: 1.50x width (tablets, desktop windows) through
   2.20x (tall 20:9 phones). */
function pickH(){
  var vw=(window.visualViewport&&window.visualViewport.width)||window.innerWidth||360;
  var vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight||680;
  var a=vh/vw;
  if(!(a>0.2&&a<8))a=1.90;
  return Math.round(W*Math.max(1.50,Math.min(2.20,a))/2)*2;
}
var H=pickH();
/* Balance was tuned on a 352-tall field. A taller field means a longer
   descent, so every vertical speed scales with it and the time you get to
   react is identical on every device. */
var REF_H=352, VS=H/REF_H;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var nameIn=document.getElementById('nameIn');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;ctx.textBaseline='top';

/* Fill the viewport. Integer scales keep pixels perfectly square, so snap to
   one when it costs almost nothing - otherwise take the fractional scale and
   the screen real estate. The old code floored unconditionally, which turned
   a 1.47x phone fit into 1x and left the game tiny. */
/* The host's own badge sits fixed in the bottom-right corner and swallows
   touches there, which is exactly where a thumb steers the ship. Keep the
   canvas clear of it rather than hiding it: the strip below the canvas is
   where the badge lives. */
function badgeInset(){
  /* fit() runs at startup, so this must never throw */
  var h='';
  try{h=(window.location&&window.location.hostname)||'';}catch(e){}
  return (h.indexOf('netlify')>=0)?58:0;
}
/* The last viewport height measured with no keyboard over it. */
var lastFreeH=0;
function fit(){
  var vw=(window.visualViewport&&window.visualViewport.width)||window.innerWidth;
  var vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  /* An on-screen keyboard shrinks visualViewport, and refitting to what is
     left shrank the whole game to a postage stamp: you could still type, but
     RECOVER and CANCEL were then far too small to hit. While a field is open
     the canvas keeps the size it had before the keyboard appeared, and the
     keyboard simply covers the bottom of it. */
  var typing=(askName===true&&promptMode!=='show');
  if(typing){ if(lastFreeH)vh=Math.max(vh,lastFreeH); }
  else lastFreeH=vh;
  var inset=badgeInset();
  var avW=Math.max(80,vw-8),avH=Math.max(80,vh-inset-8);
  var s=Math.min(avW/W,avH/H);
  var si=Math.floor(s);
  if(si>=1&&si/s>=0.97)s=si;                 /* crisp only when it is nearly free */
  cv.style.width=Math.round(W*s)+'px';
  cv.style.height=Math.round(H*s)+'px';
  /* the canvas centres inside #wrap, so padding there lifts it clear of the
     strip; body padding would do nothing, #wrap is position:fixed */
  var wrap=document.getElementById('wrap');
  if(wrap)wrap.style.paddingBottom=inset+'px';
  placeNameInput();
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',function(){setTimeout(fit,120);});
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
fit();

function mk(rows,over){
  var h=rows.length,w=rows[0].length;
  var c=document.createElement('canvas');c.width=w;c.height=h;
  var x=c.getContext('2d');
  for(var y=0;y<h;y++)for(var i=0;i<w;i++){
    var ch0=rows[y].charAt(i),col=(over&&over[ch0])||PAL[ch0];
    if(col){x.fillStyle=col;x.fillRect(i,y,1,1);}
  }
  return c;
}
function whiten(src){
  var c=document.createElement('canvas');c.width=src.width;c.height=src.height;

  x.globalCompositeOperation='source-atop';x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);
  return c;
}

/* Damage eats the rock away from every side at once rather than drawing

   opens and widens as the rock weakens, so it corrodes no matter where you
   happen to be shooting from. */
function makeBites(r,n){
  var out=[];
  for(var i=0;i<n;i++){
    out.push({a:(i/n)*Math.PI*2+Math.random()*0.7,
              d:r*(0.72+Math.random()*0.26),
              s:r*(0.19+Math.random()*0.19),

              pa:Math.random()*Math.PI*2});

}

  {rim:'#5a5145',hi:'#efe4cc',mid:'#bdae95',lo:'#857a68',cd:'#6e6454',cl:'#a2967f'}, /* small */
  {rim:'#4a4238',hi:'#d8cdb8',mid:'#a2957f',lo:'#6f6456',cd:'#5e5447',cl:'#8a7f6d'}  /* large */

function rockSprite(r,seed){
  var P=ROCKPAL[r<=6?0:1];
  var d=r*2+1,c=document.createElement('canvas');c.width=d;c.height=d;
  var x=c.getContext('2d');
  var a1=seed*1.73,a2=seed*3.11,a3=seed*5.37;
  function rad(th){
    return r*(0.82+0.10*Math.sin(th*2+a1)+0.06*Math.sin(th*3+a2)+0.045*Math.sin(th*5+a3));
  }
  var craters=[],nc=r>10?3:(r>6?2:1);
  for(var i=0;i<nc;i++){
    var ca=seed*2.31+i*2.07,cd=r*(0.30+0.16*i);
    craters.push({x:Math.cos(ca)*cd,y:Math.sin(ca)*cd,r:r*(0.15+0.09*((i+seed)%1.0))});
  }
  for(var py=0;py<d;py++)for(var px=0;px<d;px++){
    var dx=px-r,dy=py-r,dist=Math.sqrt(dx*dx+dy*dy);
    var R=rad(Math.atan2(dy,dx));
    if(dist>R)continue;
    var col;
    if(dist>R-1.15){col=P.rim;}
    else{
      var li=(-dx-dy)/(r*1.55);
      col=li>0.30?P.hi:(li>-0.10?P.mid:P.lo);

    for(var ci=0;ci<craters.length;ci++){
      var cr=craters[ci],ex=dx-cr.x,ey=dy-cr.y;

/* Difficulty is carried by HP, speed, concurrency and spawn rate rather than
   by ever-longer waves, so a late wave is savage but still finishes. */
function waveDef(w){
  var boss=(w+1)%10===0,wave=w+1;
  var total=Math.min(36,Math.round(5+w*1.6));
  if(boss)total=Math.max(4,Math.round(total*0.45));   /* the boss is the wave */
  /* The mix is dealt from whatever the roster has unlocked by this wave,
     weighted so the newest arrivals dominate and the old guard thins out
     without ever disappearing. Difficulty comes from WHAT is on screen
     rather than simply more of it. */
  var ws=rosterWeights(wave),tot=0,i,mix={};
  for(i=0;i<ws.length;i++)tot+=ws[i].w;
  var left=total,acc=0;
  for(i=0;i<ws.length;i++){
    acc+=ws[i].w;
    /* largest-remainder down the list, so the counts always sum to total */
    var upto=Math.round(total*acc/tot),n=Math.max(0,upto-(total-left));
    if(i===ws.length-1)n=left;
    n=Math.min(n,left);mix[ws[i].k]=n;left-=n;
  }
  /* waves 1-10 must never be empty of the only two kinds they have */
  if(!boss&&(mix.scout||0)+(mix.drone||0)===0&&total>0){mix.scout=1;}
  return {mix:mix,boss:boss,total:total,
    conc:Math.min(9,2+Math.floor(w/2.0))+(boss?2:0),
    /* Late enemies are individually far tougher, so the same 0.26s burst
       that worked against scouts buries you against a roster of heavies.
       The floor eases out as the roster grows: the wave still holds just as
       many, they simply do not all arrive at once. */
    gap:Math.max(0.26+0.020*tierOf(w+1),1.60*Math.pow(0.945,w)),
    /* The roster now carries the escalation - wave 60 is fought against
       things wave 10 never saw - so the blanket health multiplier no longer
       has to do that job on its own. At 0.12 the new heavies compounded with
       it and nothing past wave 25 was survivable. */
    hp:1+w*0.07,
    spd:Math.min(2.6,1+w*0.030)};
}

   so the only thing left growing was a linear nudge to the upper tiers and
   INSANITY crawled from 3.7% at 100% luck to 6.6% at 1000%.

  if(q)flt.Q.value=q;

/* ================= music: 4-bar chiptune loop, square lead + bass + noise kit
   scheduled ahead of the audio clock so it stays in time regardless of fps ==== */
var A2=110,F2=87.31,G2=98,E2=82.41;
var LEAD=[
 220,261.63,329.63,440,   329.63,261.63,220,164.81,
 220,261.63,329.63,440,   493.88,440,329.63,261.63,
 174.61,220,261.63,349.23,261.63,220,174.61,130.81,
 196,246.94,293.66,392,   293.66,246.94,196,146.83];
var BASS=[
 A2,0,A2,0,A2,0,A2,A2, A2,0,A2,0,A2,A2,A2,0,
 F2,0,F2,0,F2,0,F2,F2, G2,0,G2,0,G2,G2,E2,0];
var MUS={playing:false,step:0,nextT:0,timer:null,bpm:104,stage:0},musicGain=null;
function mgain(){
  var a=ac();if(!a)return null;
  if(!musicGain){musicGain=a.createGain();musicGain.gain.value=0.5*musVol();musicGain.connect(a.destination);}
  return musicGain;
}
function mtone(f,at,dur,vol,type,dest){
  if(!f)return;var a=ac();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,at);
  g.gain.setValueAtTime(0.0001,at);
  g.gain.linearRampToValueAtTime(vol,at+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g);g.connect(dest);o.start(at);o.stop(at+dur+0.02);
}
function mkick(at,dest){
  var a=ac();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.setValueAtTime(140,at);
  o.frequency.exponentialRampToValueAtTime(45,at+0.11);
  g.gain.setValueAtTime(0.16,at);g.gain.exponentialRampToValueAtTime(0.0001,at+0.13);
  o.connect(g);g.connect(dest);o.start(at);o.stop(at+0.15);
}
function mhat(at,dest,loud){
  var a=ac();if(!a)return;
  var n=Math.floor(a.sampleRate*0.03),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var src=a.createBufferSource(),g=a.createGain();
  src.buffer=b;g.gain.value=(loud?0.05:0.022)*musVol()*2;
  src.connect(g);g.connect(dest);src.start(at);
}
function syncVol(){if(musicGain)musicGain.gain.value=0.5*musVol();}
function msnare(at,dest){
  var a=ac();if(!a)return;
  var n=Math.floor(a.sampleRate*0.13),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  var src=a.createBufferSource();src.buffer=b;
  var f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1900;f.Q.value=0.8;
  var g=a.createGain();g.gain.value=0.085;
  src.connect(f);f.connect(g);g.connect(dest);src.start(at);
}
function mstab(at,dest,root,beat){
  if(!root)return;
  mtone(root*2,at,beat*1.6,0.022,'square',dest);
  mtone(root*3,at,beat*1.6,0.015,'square',dest);
}
/* The track is built in layers that switch on as the waves climb: it opens
   with a half-time bass and a sparse kick, then gains hats, the lead line,
   an octave double, a backbeat and finally chord stabs. */
function musStage(w){
  if(w<2)return 0;
  if(w<6)return 1;
  if(w<12)return 2;
  if(w<22)return 3;
  if(w<40)return 4;
  return 5;
}
function musicTick(){
  var a=ac(),g=mgain();
  if(!a||!g||!MUS.playing)return;
  var beat=60/MUS.bpm/2,S=MUS.stage;
  while(MUS.nextT<a.currentTime+0.14){
    var st=MUS.step%32,at=MUS.nextT,bn=BASS[st];

    if(S===0&&st%2===1)bn=0;                       /* half-time bass when calm */
    mtone(bn,at,beat*0.85,0.075,'square',g);

    if(S>=2)mtone(LEAD[st],at,beat*0.78,0.034,'square',g);
    if(S>=4&&LEAD[st])mtone(LEAD[st]*2,at,beat*0.45,0.015,'square',g);
    if(S>=3&&!bn&&BASS[(st+31)%32])
      mtone(BASS[(st+31)%32]*2,at,beat*0.40,0.030,'square',g);   /* bass fill */

    if(S===0){if(st%8===0)mkick(at,g);}
    else if(st%4===0)mkick(at,g);
    if(S>=4&&st%8===6)mkick(at,g);

    if(S>=1&&st%2===1)mhat(at,g,st%8===5);
    if(S>=5&&st%2===0)mhat(at,g,false);

    if(S>=4&&st%8===4)msnare(at,g);
    if(S>=5&&st%16===0)mstab(at,g,BASS[st],beat);

    MUS.nextT+=beat;MUS.step++;
  }
}
MUS.start=function(){
  var a=ac();if(!a)return;mgain();
  MUS.playing=true;MUS.step=0;MUS.nextT=a.currentTime+0.06;
  if(!MUS.timer)MUS.timer=setInterval(musicTick,25);
  musicTick();
};
MUS.stop=function(){
  MUS.playing=false;
  if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null;}
};

  list=list.concat(shuffle(stats)).slice(0,CARDS);

    if(u.id==='fire')upFire+=v;else if(u.id==='dmg')upDmg+=v;
    else if(u.id==='xp')upXp+=v;else upCritD+=v;}
  else if(u.kind==='add'){if(u.id==='luck')upLuck+=u.vals[r];else upCrit+=u.vals[r];}

  var tied=[],br=-1,bp=-1,i,c,r,pct;
  for(i=0;i<choices.length;i++){
    c=choices[i];r=c.r;
    pct=(c.u.kind==='once')?0:c.u.vals[c.r];
    if(r>br||(r===br&&pct>bp)){br=r;bp=pct;tied=[i];}
    else if(r===br&&pct===bp)tied.push(i);

   wave-arrival bonus life is suppressed, so you always land on exactly

  for(i=1;i<n;i++){
    ids=['fire','dmg','luck','crit','xp'];
    if(upCrit>0)ids.push('critd');          /* crit damage is dead weight with no crit */
    u=upById(ids[Math.floor(Math.random()*ids.length)]);
    grantUpgrade(u,rollRarity());

  }
  xp=0;xpNeed=xpForLevel(level);pendLv=0;choices=null;
  startWave(n-1);

  testRun=true;startedAt=n;  /* reset() cleared it, set it back */

function buildQueue(w){

  for(i=q.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=q[i];q[i]=q[j];q[j]=t;}
  /* never open a wave with one of the heavy, capped kinds */
  if(q.length&&TYPES[q[0]]&&TYPES[q[0]].maxOn!==undefined){

function threatList(){
  var out=[],i;
  for(i=0;i<aliens.length;i++){
    var a=aliens[i];
    var t0=gameT+(SHIP_Y-(a.y+a.t.h))/a.spd,t1=gameT+((SHIP_Y+SHIP_H)-a.y)/a.spd;
    if(t1<gameT)continue;
    out.push({x:a.x,hw:a.t.w/2,t0:Math.max(gameT,t0),t1:t1});
  }
  for(i=0;i<rocks.length;i++){
    var r=rocks[i];if(r.vy<=0)continue;
    var e0=gameT+((SHIP_Y-r.r)-r.y)/r.vy,e1=gameT+((SHIP_Y+SHIP_H+r.r)-r.y)/r.vy;
    if(e1<gameT)continue;
    var mid=(Math.max(gameT,e0)+e1)/2;
    out.push({x:r.x+r.vx*(mid-gameT),hw:r.r+(r.sweep||0),t0:Math.max(gameT,e0),t1:e1});
  }
  return out;
}
/* Can one ship be clear of both A and B? Overlapping in time needs a gap on
   screen; separated in time needs the ship to physically cover the distance. */
function dodgeable(A,B){
  if(!(A.t1<B.t0||B.t1<A.t0)){
    var spans=[[A.x-A.hw-PAD,A.x+A.hw+PAD],[B.x-B.hw-PAD,B.x+B.hw+PAD]];
    spans.sort(function(p,q){return p[0]-q[0];});
    var cursor=PAD;
    for(var i=0;i<spans.length;i++){
      if(spans[i][0]-cursor>5)return true;
      cursor=Math.max(cursor,spans[i][1]);
    }
    return (W-PAD)-cursor>5;
  }
  var dt=(A.t1<B.t0)?(B.t0-A.t1):(A.t0-B.t1);
  var need=Math.abs(A.x-B.x)-(A.hw+B.hw+2*PAD);
  return need<=0||need<=GUARD_SPD*dt*0.9;
}
/* Is there a safe slot the ship can actually REACH in time, from where it
   is standing right now? This is what makes every spawn survivable. */
function reachableGap(cand,list){
  var blocked=[[cand.x-cand.hw-PAD,cand.x+cand.hw+PAD]],i;
  for(i=0;i<list.length;i++){
    var o=list[i];
    if(o.t1<cand.t0||cand.t1<o.t0)continue;
    blocked.push([o.x-o.hw-PAD,o.x+o.hw+PAD]);
  }
  blocked.sort(function(p,q){return p[0]-q[0];});
  var free=[],cur=PAD;
  for(i=0;i<blocked.length;i++){
    if(blocked[i][0]-cur>6)free.push([cur,blocked[i][0]]);
    cur=Math.max(cur,blocked[i][1]);
  }
  if((W-PAD)-cur>6)free.push([cur,W-PAD]);
  if(!free.length)return false;
  var budget=GUARD_SPD*0.85*Math.max(0,cand.t0-gameT);
  for(i=0;i<free.length;i++){
    var near=Math.max(free[i][0],Math.min(ship.x,free[i][1]));
    if(Math.abs(near-ship.x)<=budget)return true;
  }
  return false;
}
function clearOfAll(cand,list){
  for(var i=0;i<list.length;i++)if(!dodgeable(cand,list[i]))return false;
  return true;
}

/* Brutes are slow, tanky and wide, and two of them entering side by side at
   the same height is a wall: there is no gap to shoot through and not enough
   time to clear either one. So no two brutes ever share a vertical slice of
   the screen. A new brute starts high enough that its lowest pixel clears the
   top of the highest brute already falling, and since every brute in a wave
   falls at the same speed, that stagger holds the whole way down.
   Scouts and drones are unaffected - they die fast enough to shoot through. */
var BRUTE_VGAP=2;
/* Brutes move at half the speed of a scout, so they LINGER: a wave that is
   a third brutes puts far more than a third of them on screen at any moment,
   and they pile up into a wall. This caps how many may be in front of you at
   once, and lets that grow across the run the way the rest of the difficulty
   does. When the cap is reached the queue simply serves something else first,
   so the wave keeps flowing and the brutes arrive spread out instead of
   together. */
function maxOnScreen(t){
  if(!t||t.maxOn===undefined)return 1e9;
  return Math.min(t.maxOn,1+Math.floor(wi/7));
}
/* Each heavy kind had its own limit, but nothing stopped four carapaces,
   four phantoms and two colossi sharing a screen. This is the ceiling on all
   of them together, so the light fast ones always have room to appear and a
   late wave is still a mix rather than a slab. */
function maxHeavies(){return Math.min(6,2+Math.floor(wi/14));}
function heavyCount(){
  var n=0,i;
  for(i=0;i<aliens.length;i++)if(spacedKind(aliens[i].t))n++;
  return n;
}
function countOf(t){
  var n=0,i;
  for(i=0;i<aliens.length;i++)if(aliens[i].t===t)n++;
  return n;
}
/* Staggering at spawn is not enough on its own. Being clipped by an alien
   shoves the whole formation back and clamps every one of them to the spawn
   line, which collapsed a staggered pair onto exactly the same y; a wave
   change can also leave a faster brute closing on a slower one. So the rule
   is enforced every frame. The lowest brute holds its place and the ones
   above are nudged UP, never down, so this can only ever delay a brute,
   never bring it down on the player sooner. */
/* Applied to every heavy kind, each against its OWN sort: brutes avoid
   brutes, colossi avoid colossi. The small fast ones are left to crowd. */
function spacedKind(t){return t&&t.maxOn!==undefined;}
function enforceBruteSpacing(){
  var i,j,g,list=[];
  for(i=0;i<aliens.length;i++)if(spacedKind(aliens[i].t)&&list.indexOf(aliens[i].t)<0)
    list.push(aliens[i].t);
  for(j=0;j<list.length;j++){
    var b=[];
    for(i=0;i<aliens.length;i++)if(aliens[i].t===list[j])b.push(aliens[i]);
    if(b.length<2)continue;
    b.sort(function(p,q){return q.y-p.y;});      /* lowest first */
    for(i=1;i<b.length;i++){
      var limit=b[i-1].y-b[i].t.h-BRUTE_VGAP;
      if(b[i].y>limit)b[i].y=limit;
    }
  }
}
function bruteSpawnY(t,sy0){
  var top=sy0,i;
  for(i=0;i<aliens.length;i++){
    if(aliens[i].t!==t)continue;
    var above=aliens[i].y-t.h-BRUTE_VGAP;    /* bottom of the new one clears it */
    if(above<top)top=above;
  }
  return top;
}
function spawnAlien(force){
  if(!queue.length)return true;
  /* Normally the front of the queue, but a brute waits its turn when there
     are already as many on screen as this wave allows. */
  var qi=0,head=TYPES[queue[0]],heavies=heavyCount(),hcap=maxHeavies();
  function blocked(ct){
    if(!ct)return false;
    if(countOf(ct)>=maxOnScreen(ct))return true;
    return spacedKind(ct)&&heavies>=hcap;
  }
  if(!force&&blocked(head)){
    var alt=-1,q;
    for(q=1;q<queue.length;q++)if(!blocked(TYPES[queue[q]])){alt=q;break;}
    if(alt<0)return false;            /* everything left is at its cap: wait */
    qi=alt;
  }
  var t=(queue[qi]==='boss')?bossFor(wi):TYPES[queue[qi]],i,spd=t.spd*curw.spd,sy0=-t.h-2;
  if(spacedKind(t))sy0=bruteSpawnY(t,sy0);
  /* a diver ends up far faster than it starts, so the fairness guard has to
     reason about the speed it will actually arrive at, not its opening crawl */
  var guardSpd=t.accel?spd*t.accel:spd;
  var order=[];for(i=0;i<LANES;i++)order.push(i);
  for(i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tm=order[i];order[i]=order[j];order[j]=tm;}
  var threats=threatList(),lane=-1;
  for(i=0;i<order.length;i++){
    var lx=laneX(order[i]),clash=false;
    for(var a=0;a<aliens.length;a++)
      if(aliens[a].y<104&&Math.abs(aliens[a].x-lx)<46){clash=true;break;}
    if(clash)continue;
    var cand={x:lx,hw:t.w/2,
      t0:gameT+(SHIP_Y-(sy0+t.h))/guardSpd,t1:gameT+((SHIP_Y+SHIP_H)-sy0)/spd};
    if(clearOfAll(cand,threats)&&reachableGap(cand,threats)){lane=order[i];break;}
  }
  /* Nowhere fair to put it: hold the alien back rather than wall the player in.
     The wave still finishes, it just breathes. */
  if(lane<0){
    if(!force)return false;
    var far=-1;
    for(i=0;i<LANES;i++){
      var lx2=laneX(i),mind=1e9;
      for(var a2=0;a2<aliens.length;a2++)mind=Math.min(mind,Math.abs(aliens[a2].x-lx2));
      /* weight in distance from the ship too, so a forced spawn never lands
         on top of where the player is standing */
      var sc=Math.min(mind,120)+Math.min(Math.abs(ship.x-lx2),120)*0.8;
      if(sc>far){far=sc;lane=i;}
    }
  }
  queue.splice(qi,1);
  var x=laneX(lane)+Math.round((Math.random()*2-1)*5),half=t.w/2;
  x=Math.max(half+2,Math.min(W-half-2,x));
  var hp=t.hp*curw.hp;
  aliens.push({t:t,x:x,y:sy0,hp:hp,max:hp,fl:0,spd:spd,base:spd,
    sh:t.shield?t.shield*curw.hp:0,shmax:t.shield?t.shield*curw.hp:0,
    quiet:0,ph:0,solid:true,
    bites:makeAlienBites(t,5+Math.floor(t.w/8))});
  return true;
}

/* Meteors: free angle, but the path is BUILT from a crossing point on the
   ship's line, so every rock is guaranteed to threaten the player.
   A reachability test rejects any rock the ship could not physically dodge
   given the rocks already inbound. */
function spawnMeteor(){
  for(var attempt=0;attempt<14;attempt++){
    var roll=Math.random()*ROCK_TOTAL,def=ROCKS[0],acc=0,i;
    for(i=0;i<ROCKS.length;i++){acc+=ROCKS[i].weight;if(roll<=acc){def=ROCKS[i];break;}}
    var r=def.r;
    var cx=r+6+Math.random()*(W-2*(r+6));        /* where it crosses the ship line */
    var sx=-40+Math.random()*(W+80);             /* entry point, may be off-screen */
    var sy=-r-8;
    var dx=cx-sx,dy=LINE_Y-sy,len=Math.sqrt(dx*dx+dy*dy);
    var spd=def.spd*(0.9+Math.random()*0.25)*(mplan?mplan.spd:1);
    var vx=dx/len*spd,vy=dy/len*spd;
    if(vy<18)continue;                            /* never near-horizontal */
    var cross=gameT+(LINE_Y-sy)/vy;               /* when it reaches the line */

    var e0=gameT+((SHIP_Y-r)-sy)/vy,e1=gameT+((SHIP_Y+SHIP_H+r)-sy)/vy;
    var mid=(e0+e1)/2,sweep=Math.abs(vx)*(e1-e0)/2;
    var cand={x:sx+vx*(mid-gameT),hw:r+sweep,t0:e0,t1:e1};
    var tl=threatList();
    if(!clearOfAll(cand,tl)||!reachableGap(cand,tl))continue;  /* would pinch the player */

    var shi=Math.floor(Math.random()*def.shapes.length);
    var rhp=def.hp*(1+wi*0.015);
    rocks.push({r:r,x:sx,y:sy,vx:vx,vy:vy,cx:cx,cross:cross,sweep:sweep,
      hp:rhp,max:rhp,xp:def.xp,blast:def.blast,fl:0,bites:makeBites(r,6+Math.floor(r/2)),
      frames:def.shapes[shi],lit:def.lit[shi],
      fi:Math.random()*ROT,fs:def.spin*ROT*(Math.random()<0.5?-1:1),passed:false});
    return;
  }
}

/* ================= damage numbers ================= */
var dnums=[];
/* How much room a label would have at this spot: the distance to the nearest
   sprite edge on the same row, negative if it would land on one. */
function clearanceAt(px,half,cy){
  var lo=px-half,hi=px+half,worst=1e9,i,a,r;
  for(i=0;i<aliens.length;i++){
    a=aliens[i];
    if(cy+FH<a.y||cy>a.y+a.t.h)continue;
    var al=a.x-a.t.w/2,ah=a.x+a.t.w/2;
    worst=Math.min(worst,(hi<=al)?al-hi:((lo>=ah)?lo-ah:-1));
  }
  for(i=0;i<rocks.length;i++){
    r=rocks[i];
    if(cy+FH<r.y-r.r||cy>r.y+r.r)continue;
    var rl=r.x-r.r,rh=r.x+r.r;
    worst=Math.min(worst,(hi<=rl)?rl-hi:((lo>=rh)?lo-rh:-1));
  }
  return worst===1e9?999:worst;
}
/* The number goes BESIDE whatever was hit, clear of its sprite, rather than on
   top of it where the artwork swallows it. halfW is the target's half width;
   the number is pushed just past that edge, on the side with more room, and is
   nudged vertically if it would land on one that is already there. */
function addDmgNum(cx,cy,v,crit,halfW){
  if(!dmgNumbers)return;
  if(dnums.length>44)dnums.shift();
  var val=Math.max(1,Math.round(v));
  var label=''+val+(crit?'!':'');
  var half=txtW(label)/2;
  var off=(halfW||0)+5+half;
  /* Walk outwards on both sides, and if the row is packed, step above it.
     The first spot clear of EVERY sprite wins, so a number never lands in a
     neighbour either; the roomier side is tried first. */
  var toCentre=(cx>W/2)?-1:1;
  var x=null,y=cy-3,bx=null,bs=-1e9,ci,ri,px,py,sc;
  var rowY=[cy-3,cy-14,cy-24];
  for(ri=0;ri<rowY.length&&x===null;ri++){
    for(ci=0;ci<6;ci++){
      px=cx+(off+(ci>>1)*16)*((ci%2===0)?toCentre:-toCentre);
      py=rowY[ri];
      if(px-half<2||px+half>W-2)continue;
      sc=clearanceAt(px,half,py);
      if(sc>bs){bs=sc;bx=px;y=py;}
      if(sc>=1){x=px;y=py;break;}
    }
  }
  if(x===null){
    /* Row packed solid: the margins are nearly always empty, so take the
       clearer edge rather than dropping the number inside a sprite. */
    var le=2+half,re=W-2-half,ly=rowY[0];
    var lc=clearanceAt(le,half,ly),rc=clearanceAt(re,half,ly);
    if(Math.max(lc,rc)>=1){x=(lc>=rc)?le:re;y=ly;}
    else {x=(bx===null)?cx:bx;if(y===null)y=cy-3;}
  }
  if(x-half<2)x=2+half;
  if(x+half>W-2)x=W-2-half;
  var i,tries=0;
  while(tries<4){                           /* keep stacked hits legible */
    var clash=false;
    for(i=dnums.length-1;i>=0&&i>=dnums.length-6;i--)
      if(Math.abs(dnums[i].x-x)<half+10&&Math.abs(dnums[i].y-y)<8){clash=true;break;}
    if(!clash)break;
    y-=9;tries++;
  }
  var L=crit?0.80:0.55;
  dnums.push({x:x,y:y,v:val,crit:crit,life:L,max:L,vy:-26-Math.random()*12});
}
function drawDmgNums(){
  for(var i=0;i<dnums.length;i++){
    var d=dnums[i];
    ctx.globalAlpha=Math.max(0,Math.min(1,d.life/d.max));
    txt(d.crit?(d.v+'!'):(''+d.v),d.x,d.y,d.crit?'#ffd34d':'#e8f2ff',true);
  }
  ctx.globalAlpha=1;
}


/* ---- debris blast ----
   A shattered rock throws shrapnel: every alien whose body comes within a
   scout's width of the rock's edge takes one instant hit. One hit each, no
   ticks, and it does not set off other rocks or touch the player. */
function rockBlast(rk){
  var reach=rk.r+TYPES.scout.w;
  var dv=(rk.blast||20)*upDmg;
  shocks.push({x:rk.x,y:rk.y,r0:rk.r,max:reach,life:0.30,dur:0.30});
  sfx.blast(rk.r);
  shake=Math.max(shake,rk.r>=9?3:2);
  burst(rk.x,rk.y,8+rk.r,'#ffd9a0',2.0);
  for(var i=aliens.length-1;i>=0;i--){
    var a=aliens[i],ax=a.x,ay=a.y+a.t.h/2;
    var dx=Math.abs(ax-rk.x)-a.t.w/2;if(dx<0)dx=0;
    var dy=Math.abs(ay-rk.y)-a.t.h/2;if(dy<0)dy=0;
    if(dx*dx+dy*dy>reach*reach)continue;
    a.hp-=dv;a.fl=0.10;
    addDmgNum(a.x,ay,dv,false,a.t.w/2);
    burst(ax,ay,5,'#ffb86b',1.3);
    if(a.hp<=0)killAlien(a,i);
  }
}


/* the blast edge, as a one-pixel expanding ring */
function drawShocks(){
  for(var i=0;i<shocks.length;i++){
    var s=shocks[i],k=1-s.life/s.dur;
    var rad=s.r0+(s.max-s.r0)*(1-Math.pow(1-k,2));
    ctx.globalAlpha=Math.max(0,1-k)*0.85;
    ctx.fillStyle=k<0.40?'#fff3cf':(k<0.72?'#ffb86b':'#c8662a');
    var n=Math.max(10,Math.round(rad*2.4));
    for(var j=0;j<n;j++){
      var an=j/n*Math.PI*2;
      ctx.fillRect(Math.round(s.x+Math.cos(an)*rad),Math.round(s.y+Math.sin(an)*rad),1,1);
    }
  }
  ctx.globalAlpha=1;
}

/* ================= particles ================= */
function burst(x,y,n,col,pow){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,s=(0.3+Math.random())*pow;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.3+Math.random()*0.45,max:0.75,c:col});
  }
}

/* ================= players and the leaderboard ================= */
/* A player is a random id kept in this browser, not an account: no sign-in,
   no password, nothing to lose. The name and hull ride along with each score
   so the board can show both. */
/* The player id IS the recovery code, so it has to be readable off a screen
   and typed back in without a squint: no 0/O, no 1/l/i, no u. 30 characters,
   12 long, which is 5.3e17 combinations - nobody is guessing their way onto
   somebody else's row. Anyone holding the code can post as that player, so it
   is a 'keep it to yourself' code, not a password. */
var CODE_ALPHA='23456789abcdefghjkmnpqrstvwxyz';
var CODE_LEN=12;
function newCode(){
  var out='',i,n;
  for(i=0;i<CODE_LEN;i++){
    n=Math.floor(Math.random()*CODE_ALPHA.length);
    if(n>=CODE_ALPHA.length)n=CODE_ALPHA.length-1;
    out+=CODE_ALPHA.charAt(n);
  }
  return out;
}
/* Forgiving about how it comes back in: any case, with or without the dashes
   and spaces the card shows it in. */
function cleanCode(v){
  return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,32);
}
function codeOk(v){return /^[a-z0-9]{6,32}$/.test(v);}
/* Shown in groups of four. Reading twelve unbroken characters off a phone and
   typing them into another one is how people drop a character. */
function codeFmt(v){
  var c=String(v||'').toUpperCase(),out='',i;
  for(i=0;i<c.length;i++){if(i&&i%4===0)out+='-';out+=c.charAt(i);}
  return out;
}

var playerId='',playerName='',askName=false,nameEdit=false,nameDraft='',nameCaret=0;
/* 'name' asks who you are, 'code' takes a code off another device, 'show'
   just displays yours. All three share the one card and the one input. */
var promptMode='name',codeMsg='',codeBusy=false;
try{playerId=localStorage.getItem('vr_pid')||'';}catch(e){}
/* An id already in storage is kept exactly as it is, whatever format it is in:
   regenerating one would strand that player's row on the board forever. */
if(!codeOk(playerId)){
  playerId=newCode();
  try{localStorage.setItem('vr_pid',playerId);}catch(e){}
}
try{playerName=localStorage.getItem('vr_name')||'';}catch(e){}

/* No underscore: the pixel font has no glyph for it, so a name using one
   drew as a blank gap on the board. The server stays permissive for older
   clients; this just stops anyone picking an unrenderable name. */
function cleanName(v){
  return String(v||'').toUpperCase().replace(/[^A-Z0-9 .-]/g,'').trim().slice(0,14);
}
/* Taking on an id from another device. The code is accepted even when the
   board has no row for it yet - a player may be recovering before they ever
   finished a run - but the name and hull are pulled back when it does. */
function adoptShip(k){
  for(var i=0;i<SHIP_THEMES.length;i++)
    if(SHIP_THEMES[i].k===k){
      /* setShipTheme, not a bare assignment: it rebuilds the sprite too.
         Assigning the index alone left the ship still painted its old colour
         until the page was reloaded. */
      setShipTheme(i);return true;}
  return false;
}
function applyCode(code){
  playerId=code;
  try{localStorage.setItem('vr_pid',code);}catch(e){}
}
function recoverFound(rows,code){
  for(var i=0;i<rows.length;i++)if(rows[i].id===code){
    if(rows[i].name){playerName=rows[i].name;
      try{localStorage.setItem('vr_name',playerName);}catch(e){}}
    adoptShip(rows[i].ship);
    return rows[i];
  }
  return null;
}
function lbRecover(code){
  applyCode(code);
  if(!canFetch()){codeBusy=false;codeMsg='SAVED - NO CONNECTION TO CHECK';return;}
  codeBusy=true;codeMsg='CHECKING...';
  var done=false,t=null;
  function finish(d){
    if(done)return;
    done=true;codeBusy=false;
    if(t!==null&&typeof clearTimeout==='function')clearTimeout(t);
    if(d&&d.ok&&d.rows){
      LB.rows=d.rows;LB.mode='live';
      var row=recoverFound(d.rows,code);
      if(row){codeMsg='WELCOME BACK '+row.name;askName=false;
        if(nameIn){nameIn.blur();nameIn.style.display='none';}}
      else codeMsg='NO RUNNER WITH THAT CODE YET';
    } else codeMsg='COULD NOT REACH THE BOARD';
  }
  try{
    if(typeof setTimeout==='function')t=setTimeout(function(){finish(null);},8000);
    fetch('/api/scores?v='+BOARD_ERA,{method:'GET'})
      .then(function(r){return r.json();})
      .then(finish)
      .catch(function(){finish(null);});
  }catch(e){finish(null);}
}
/* The board's era, deliberately NOT the version string. Cosmetic releases
   and bug fixes keep their scores; a release that changes what the game asks
   of a player starts a fresh table, and the old one stays readable beside it.
   Era 1 is everything up to V1.73 - three enemy kinds and the old curve.
   Era 2 begins at V1.74, where a new alien unlocks after every boss. */
var BOARD_ERA='2', PREV_ERA='1';
function majorVer(){return LB.era||BOARD_ERA;}
function eraName(e){return e===BOARD_ERA?'CURRENT':'PREPATCH';}
/* Your own run belongs to the current era, so it is only ever merged into
   that board - never onto the prepatch one, which is now frozen history. */
function viewingCurrent(){return (LB.era||BOARD_ERA)===BOARD_ERA;}

/* rows: [{id,name,wave,score,ship}]. mode: 'live' once the server answers,
   'local' when it cannot be reached, which is every artifact view since those
   pages are not allowed to call out. */
var LB={rows:[],mode:'local',busy:false,err:'',scroll:0,era:'2'};

function lbBest(){
  try{return JSON.parse(localStorage.getItem('vr_best')||'null');}catch(e){return null;}
}
/* The hull is stored WITH the run that earned it. Reading the current colour
   instead meant repainting your ship silently recoloured a record set in a
   different one. */
function lbLocalRows(){
  var b=lbBest();
  if(!b)return [];
  return [{id:playerId,name:playerName||'YOU',wave:b.wave,score:b.score,
           ship:b.ship||SHIP_THEMES[shipTheme].k}];
}
function lbRememberLocal(wave,score){
  var cur=lbBest();
  if(!cur||wave>cur.wave||(wave===cur.wave&&score>cur.score)){
    cur={wave:wave,score:score,ship:SHIP_THEMES[shipTheme].k};
    try{localStorage.setItem('vr_best',JSON.stringify(cur));}catch(e){}
  }
  return cur;
}
/* The run just finished on this device, held until the board reports it back
   by itself. The write lands before the key listing catches up, so the POST's
   own echo of the board - and a GET a second behind it - can both come back
   without the row that was just written. That is what left the board empty
   after a run until something happened to reload it. */
var myRow=null;
function lbMergeMine(rows){
  if(!myRow||!rows||!viewingCurrent())return rows;
  var i,at=-1;
  for(i=0;i<rows.length;i++)if(rows[i].id===playerId){at=i;break;}
  if(at<0)rows.push(myRow);
  else if(myRow.wave>rows[at].wave||
         (myRow.wave===rows[at].wave&&myRow.score>rows[at].score))rows[at]=myRow;
  rows.sort(function(a,b){return (b.wave-a.wave)||(b.score-a.score)||((a.at||0)-(b.at||0));});
  return rows;
}
function lbApply(data){
  if(data&&data.ok&&data.rows){
    LB.rows=lbMergeMine(data.rows);LB.mode='live';LB.err='';return true;
  }
  return false;
}
/* Ask again a few times after a submit, so the board converges on its own
   instead of waiting for the player to go and poke it. */
/* Other people's runs land on the board while you are sitting looking at it.
   Without this the board only reloaded when you navigated to it, so a friend
   finishing a run went unseen until the app was closed and reopened. */
var LB_POLL=20,lbPoll=LB_POLL;
function lbTick(dt){
  if(state===MENU||state===BOARD){
    lbPoll-=dt;
    if(lbPoll<=0){lbPoll=LB_POLL;lbLoad();}
  } else lbPoll=LB_POLL;
}
function lbRefreshSoon(){
  if(typeof setTimeout!=='function')return;
  var tries=[1500,4000,9000],i;
  for(i=0;i<tries.length;i++)setTimeout(lbLoad,tries[i]);
}
function lbFallback(){
  if(LB.mode!=='live'){LB.rows=viewingCurrent()?lbLocalRows():[];LB.mode='local';}
}
/* The board is a nice-to-have: nothing in here may ever stop the game
   starting, so every call is guarded and failure just means a local board. */
function canFetch(){return typeof fetch==='function';}
function lbLoad(era){
  if(era&&era!==LB.era){LB.era=era;LB.rows=[];LB.mode='local';LB.scroll=0;LB.busy=false;}
  if(LB.busy)return;
  /* No optimistic local row up front. It was drawn from the CURRENT hull and
     name, so the board flashed your run in the wrong colour for a moment and
     then corrected itself the instant the server answered. LOADING, then the
     truth. The local row is still the fallback when the fetch fails. */
  if(!canFetch()){lbFallback();return;}
  LB.busy=true;
  var done=false,t=null,want=LB.era;      /* the tab this reply belongs to */
  function finish(d){
    if(done)return;
    done=true;
    if(t!==null&&typeof clearTimeout==='function')clearTimeout(t);
    /* Tab changed while this was in flight: a newer request owns the board,
       so drop this reply rather than painting one era's rows under another. */
    if(want!==LB.era)return;
    LB.busy=false;
    if(!d||!lbApply(d))lbFallback();
  }
  try{
    if(typeof setTimeout==='function')t=setTimeout(function(){finish(null);},8000);
    fetch('/api/scores?v='+majorVer(),{method:'GET'})
      .then(function(r){return r.json();})
      .then(finish)
      .catch(function(){finish(null);});
  }catch(e){finish(null);}
}
/* Test runs from the wave picker never post: they start pre-levelled, so they
   are not comparable with a run played from wave 1. */
function lbSubmit(wave,score){
  lbRememberLocal(wave,score);
  if(testRun||!canFetch())return;
  /* Show it straight away, but show the BEST run this device knows about,
     not necessarily the one just finished: a worse run must not repaint the
     record that is still standing. */
  var b=lbBest()||{wave:wave,score:score,ship:SHIP_THEMES[shipTheme].k};
  myRow={id:playerId,name:playerName||'ANON',wave:b.wave,score:b.score,
         ship:b.ship||SHIP_THEMES[shipTheme].k,at:Date.now()};
  LB.rows=lbMergeMine(LB.rows?LB.rows.slice():[]);
  lbRefreshSoon();
  try{
    fetch('/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:playerId,name:playerName||'ANON',wave:wave,score:score,
                           ship:SHIP_THEMES[shipTheme].k,v:BOARD_ERA})})
      .then(function(r){return r.json();})
      .then(function(d){if(!lbApply(d))lbFallback();})
      .catch(function(){lbFallback();});
  }catch(e){lbFallback();}
}
function lbRank(){
  for(var i=0;i<LB.rows.length;i++)if(LB.rows[i].id===playerId)return i+1;
  return 0;
}
function shipColour(k){
  for(var i=0;i<SHIP_THEMES.length;i++)if(SHIP_THEMES[i].k===k)return SHIP_THEMES[i].B;
  return '#2b7fe0';
}
function shipTheme4(k){
  for(var i=0;i<SHIP_THEMES.length;i++)if(SHIP_THEMES[i].k===k)return SHIP_THEMES[i];
  return SHIP_THEMES[1];
}
/* The player's own ship, one canvas pixel per sprite pixel, painted in their
   hull colours. A coloured dot said which colour they picked; this says which
   ship they flew. 15x15, which drops into a 20px board row. */
var SHIPMARK_W=15;
function drawShipMark(x,y,k){
  var th=shipTheme4(k),r,c,ch,col;
  for(r=0;r<SHIP.length;r++)for(c=0;c<SHIP[r].length;c++){
    ch=SHIP[r].charAt(c);
    if(ch==='.')continue;
    col=(ch==='A')?th.A:(ch==='B')?th.B:(ch==='C')?th.C:PAL[ch];
    if(!col)continue;
    ctx.fillStyle=col;ctx.fillRect(x+c,y+r,1,1);
  }
}

/* ================= main menu ================= */
/* The top block is a fixed stack measured from the top of the canvas; the
   buttons then centre themselves in whatever room is left above the footer,
   so a tall phone spreads out instead of leaving a gap at the bottom. */
/* Everything on the menu hangs off this margin rather than sitting at a fixed
   y, so a tall phone gives the title room to breathe instead of pinning it to
   the top edge, and a short canvas still fits. */
function menuTop(){return Math.round(H*0.045);}
/* The strapline belongs with the board, not with the title, so it hangs well
   below the name and the whole group travels together. */
function menuSubY(){return menuTop()+21+Math.round(H*0.040);}
var LB_ROWS=5,LB_RH=20;
function lbTop(){return menuSubY()+48;}
function menuStackEnd(){var p=lbPanel();return p.y+p.h+14;}
function lbPanel(){return {x:12,y:lbTop()-10,w:W-24,h:LB_ROWS*LB_RH+14};}
var C_GOLD='#ffd34d';
function lbRowRect(i){return {x:16,y:lbTop()+i*LB_RH,w:W-32,h:LB_RH};}

/* the name card, drawn over the menu */
/* The code modes carry a line under the field - a status message, or the
   'do not share it' warning - so the card grows to make room for it rather
   than letting that line land on top of the buttons. */
function cardTall(){return promptMode==='code'||promptMode==='show';}
/* Typing raises a keyboard over roughly the bottom half of the phone, so the
   card and its buttons move up out of the way. Nothing is typed on the
   read-only code card, so that one stays where a modal normally sits. */
function cardTop(){return Math.round(H*(promptMode==='show'?0.30:0.15));}
function nameCard(){return {x:20,y:cardTop(),w:W-40,h:cardTall()?122:104};}
function nameFieldRect(){var c=nameCard();return {x:c.x+14,y:c.y+34,w:c.w-28,h:22};}
function nameBtnTop(){var c=nameCard();return c.y+(cardTall()?86:68);}
/* Dismiss sits on the left, confirm on the right. */
function nameLaterRect(){var c=nameCard();
  return {x:c.x+14,y:nameBtnTop(),w:Math.round((c.w-38)/2),h:24};}
function nameOkRect(){var c=nameCard(),l=nameLaterRect();
  /* Showing your own code needs one button, not a choice, so it spans. */
  if(promptMode==='show')return {x:c.x+14,y:nameBtnTop(),w:c.w-28,h:24};
  return {x:l.x+l.w+10,y:l.y,w:c.w-28-l.w-10,h:24};}

/* one row of the board, shared by the menu and the full screen */
/* rank | ship | name | WAVE n | SCORE n.  The two labels are measured and
   right-packed first, and the name takes whatever is left, so a long name is
   clipped instead of running under the numbers. */
function drawLbRow(r,row,rank,me){
  if(me){ctx.fillStyle='rgba(143,233,255,0.10)';ctx.fillRect(r.x,r.y,r.w,r.h);}
  var cy=r.y+Math.round((r.h-FH)/2);
  txt(rank,r.x+3,cy,rank<=3?'#ffd34d':'#5f6a7a');
  drawShipMark(r.x+22,r.y+Math.round((r.h-SHIP.length)/2),row.ship);

  var sTxt='SCORE '+row.score, wTxt='WAVE '+row.wave;
  var sX=r.x+r.w-6-txtW(sTxt);
  var wX=sX-10-txtW(wTxt);
  txt(wTxt,wX,cy,'#ffe066');
  txt(sTxt,sX,cy,'#7fb4e8');

  var nX=r.x+22+SHIPMARK_W+5;
  var room=wX-6-nX;
  var max=Math.max(1,Math.floor((room+1)/FADV));
  txt(String(row.name||'ANON').slice(0,max),nX,cy,me?'#ffffff':'#9fd8ff');
}
function drawBoardBlock(){
  var p=lbPanel();panel(p,C_GOLD);
  txtBig('LEADERBOARD',W/2,lbTop()-30,C_GOLD,2);
  if(!LB.rows.length){
    txt(LB.busy?'LOADING':'NO RUNS YET',W/2,p.y+Math.round(p.h/2)-10,'#3f6490',true);
    txt(LB.busy?'':'BE THE FIRST',W/2,p.y+Math.round(p.h/2)+2,'#2e3f58',true);
  }else{
    for(var i=0;i<Math.min(LB_ROWS,LB.rows.length);i++)
      drawLbRow(lbRowRect(i),LB.rows[i],i+1,LB.rows[i].id===playerId);
  }
  var rk=lbRank(),hint;
  if(LB.mode!=='live')hint='LOCAL ONLY - BOARD IS OFFLINE HERE';
  else if(rk>LB_ROWS)hint='YOU ARE #'+rk+'  -  TAP FOR THE FULL BOARD';
  else hint='TAP FOR THE FULL BOARD';
  txt(hint,W/2,p.y+p.h+5,'#2e3f58',true);
}
var MENU_ITEMS=[['NEW RUN','#4fc01f'],['DEMO MODE','#4fa3ff'],['SETTINGS','#c86bff']];
function menuRect(i){
  var h=34,gap=11,n=MENU_ITEMS.length,tot=n*h+(n-1)*gap;
  var lo=menuStackEnd()+8,hi=H-46;   /* leaves the footer clear */
  var top=(hi-lo>tot)?lo+Math.round((hi-lo-tot)/2):lo;
  return {x:30,y:top+i*(h+gap),w:W-60,h:h};
}
function menuGapTop(){return menuStackEnd()+8;}
function toMenu(){
  state=MENU;setPage=0;pickBuf='';running=false;confirmAct='';MUS.stop();
  lbLoad(BOARD_ERA);                /* the menu is always the live board */
  aliens=[];bullets=[];rocks=[];parts=[];shocks=[];dnums=[];
  bannerT=0;alarmT=0;shake=0;
}
function menuPick(i){
  sfx.pick();
  if(i===0){testRun=false;reset();}
  else if(i===1){state=PICK;pickBuf='';}
  else{state=SETTINGS;setPage=0;setBack=MENU;}
}

/* The field is invisible and sits exactly over the drawn one, so the phone
   raises its own keyboard while the canvas does all the drawing. */
function placeNameInput(){
  if(!nameIn||!askName)return;
  var r=cv.getBoundingClientRect(),sc=r.width/W,f=nameFieldRect();
  nameIn.style.left=(r.left+f.x*sc)+'px';
  nameIn.style.top=(r.top+f.y*sc)+'px';
  nameIn.style.width=(f.w*sc)+'px';
  nameIn.style.height=(f.h*sc)+'px';
}
if(nameIn){
  nameIn.addEventListener('input',function(){
    if(promptMode==='code'){
      /* Keep the dashes the player can see in the field, store the raw code. */
      nameDraft=cleanCode(nameIn.value);
      var pretty=codeFmt(nameDraft);
      if(nameIn.value!==pretty)nameIn.value=pretty;
      if(codeMsg&&!codeBusy)codeMsg='';
      return;
    }
    nameDraft=cleanName(nameIn.value);
    if(nameIn.value!==nameDraft)nameIn.value=nameDraft;
  });
  nameIn.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();if(promptReady())closeNamePrompt(true);}
    else if(e.key==='Escape'){e.preventDefault();closeNamePrompt(false);}
  });
}

/* ================= confirm ================= */
/* Leaving or restarting mid-run throws the run away, so it asks first. The
   confirm button is labelled with the action rather than a bare "continue",
   which reads just as much like "carry on playing". */
var confirmAct='';
function askConfirm(what){confirmAct=what;}
function confirmCard(){return {x:22,y:Math.round(H*0.34),w:W-44,h:92};}
function confirmYes(){var c=confirmCard();
  return {x:c.x+12,y:c.y+c.h-34,w:Math.round((c.w-34)/2),h:24};}
function confirmNo(){var c=confirmCard(),y=confirmYes();
  return {x:y.x+y.w+10,y:y.y,w:c.w-24-y.w-10,h:24};}
function drawConfirm(){
  ctx.fillStyle='rgba(3,5,12,0.84)';ctx.fillRect(0,0,W,H);
  var c=confirmCard();panel(c,'#e03b3b');
  txt(confirmAct==='menu'?'LEAVE THIS RUN':'RESTART THIS RUN',W/2,c.y+12,'#ff9a9a',true);
  txt('WAVE '+(wi+1)+'   SCORE '+score,W/2,c.y+26,'#ffe066',true);
  txt('THIS RUN WILL BE LOST',W/2,c.y+40,'#5f6a7a',true);
  var y=confirmYes(),n=confirmNo();
  panel(y,'#e03b3b');
  txt(confirmAct==='menu'?'MAIN MENU':'RESTART',y.x+Math.round(y.w/2),y.y+Math.round((y.h-FH)/2),'#ff9a9a',true);
  panel(n,'#4fc01f');
  txt('CANCEL',n.x+Math.round(n.w/2),n.y+Math.round((n.h-FH)/2),'#b9ffa8',true);
}
function doConfirm(){
  var a=confirmAct;confirmAct='';
  if(a==='menu')toMenu();
  else if(a==='restart')reset();
}

/* ================= name card ================= */
/* Is what is typed good enough for the CONTINUE button to light up? */
function promptReady(){
  if(promptMode==='code')return codeOk(cleanCode(nameDraft));
  return cleanName(nameDraft).length>0;
}
function promptTitle(){
  if(promptMode==='code')return 'ENTER A RECOVERY CODE';
  if(promptMode==='show')return 'YOUR RECOVERY CODE';
  return nameEdit?'CHANGE YOUR NAME':'WHO ARE YOU';
}
function promptSub(){
  if(promptMode==='code')return 'TAKES BACK YOUR RUNS AND NAME';
  if(promptMode==='show')return 'KEEP THIS - IT IS HOW YOU GET BACK IN';
  return 'YOUR NAME ON THE LEADERBOARD';
}
function drawNameCard(){
  ctx.fillStyle='rgba(3,5,12,0.82)';ctx.fillRect(0,0,W,H);
  var c=nameCard();panel(c,promptMode==='show'?'#ffd34d':'#4fa3ff');
  txt(promptTitle(),W/2,c.y+10,promptMode==='show'?'#ffd34d':'#8fe9ff',true);
  txt(promptSub(),W/2,c.y+22,'#3f6490',true);
  var f=nameFieldRect(),ty=f.y+Math.round((f.h-FH)/2);

  if(promptMode==='show'){
    /* Nothing to type: the code is just read off the card. */
    ctx.fillStyle='#070b16';ctx.fillRect(f.x,f.y,f.w,f.h);
    ctx.fillStyle='#5e4a0b';
    ctx.fillRect(f.x,f.y,f.w,1);ctx.fillRect(f.x,f.y+f.h-1,f.w,1);
    ctx.fillRect(f.x,f.y,1,f.h);ctx.fillRect(f.x+f.w-1,f.y,1,f.h);
    txt(codeFmt(playerId),W/2,ty,'#ffe066',true);
    txt('DO NOT SHARE IT',W/2,f.y+f.h+6,'#3f6490',true);
    var done=nameOkRect();
    panel(done,'#4fc01f');
    txt('DONE',done.x+Math.round(done.w/2),
        done.y+Math.round((done.h-FH)/2),'#b9ffa8',true);
    return;
  }

  ctx.fillStyle='#070b16';ctx.fillRect(f.x,f.y,f.w,f.h);
  ctx.fillStyle='#24405f';
  ctx.fillRect(f.x,f.y,f.w,1);ctx.fillRect(f.x,f.y+f.h-1,f.w,1);
  ctx.fillRect(f.x,f.y,1,f.h);ctx.fillRect(f.x+f.w-1,f.y,1,f.h);
  var shown=(promptMode==='code')?codeFmt(cleanCode(nameDraft)):nameDraft;
  if(shown)txt(shown,f.x+7,ty,'#ffffff');
  else txt(promptMode==='code'?'TAP TO TYPE THE CODE':'TAP TO TYPE',f.x+7,ty,'#2e3f58');
  if(Math.floor(gameT*2)%2===0){                     /* caret */
    ctx.fillStyle='#8fe9ff';
    ctx.fillRect(f.x+7+txtW(shown)+(shown?1:0),ty-1,1,FH+2);
  }
  if(promptMode==='code'&&codeMsg)
    txt(codeMsg,W/2,f.y+f.h+6,codeBusy?'#3f6490':'#ffe066',true);
  var ok=nameOkRect(),later=nameLaterRect(),can=promptReady();
  panel(later,'#3f6490');
  txt((promptMode==='code'||nameEdit)?'CANCEL':'LATER',later.x+Math.round(later.w/2),
      later.y+Math.round((later.h-FH)/2),'#9fd8ff',true);
  panel(ok,can?'#4fc01f':'#2b3340');
  txt(promptMode==='code'?'RECOVER':'CONTINUE',ok.x+Math.round(ok.w/2),
      ok.y+Math.round((ok.h-FH)/2),can?'#b9ffa8':'#4a5260',true);
}
function openNamePrompt(edit){
  promptMode='name';codeMsg='';codeBusy=false;
  askName=true;nameEdit=!!edit;nameDraft=playerName||'';
  if(nameIn){nameIn.value=nameDraft;nameIn.setAttribute('maxlength','14');
    placeNameInput();nameIn.style.display='block';
    try{nameIn.focus({preventScroll:true});}catch(e){try{nameIn.focus();}catch(e2){}}}
}
function openCodePrompt(){
  promptMode='code';codeMsg='';codeBusy=false;
  askName=true;nameEdit=true;nameDraft='';
  /* 32 raw characters plus the dashes the field shows them in. */
  if(nameIn){nameIn.value='';nameIn.setAttribute('maxlength','40');
    placeNameInput();nameIn.style.display='block';
    try{nameIn.focus({preventScroll:true});}catch(e){try{nameIn.focus();}catch(e2){}}}
}
function openCodeShow(){
  promptMode='show';codeMsg='';codeBusy=false;
  askName=true;nameEdit=true;nameDraft='';
  if(nameIn){nameIn.blur();nameIn.style.display='none';}
}
function closeNamePrompt(save){
  if(save&&promptMode==='code'){
    /* Stays open: the answer comes back from the board a moment later and is
       drawn on this card, so closing here would hide it. */
    var c=cleanCode(nameDraft);
    if(codeOk(c))lbRecover(c);
    return;
  }
  if(save&&promptMode==='name'){
    var n=cleanName(nameDraft);
    if(n){playerName=n;try{localStorage.setItem('vr_name',n);}catch(e){}}
  }
  askName=false;promptMode='name';codeMsg='';codeBusy=false;
  if(nameIn){nameIn.blur();nameIn.style.display='none';
    nameIn.setAttribute('maxlength','14');}
  fit();                       /* keyboard gone: measure the real viewport again */
}

/* ================= full leaderboard ================= */
/* Two tabs across the top of the full board: the live table, and the frozen
   one from before the roster patch. */
var BOARD_TABS=[['CURRENT','2'],['PREPATCH','1']];
function boardTabRect(i){
  var gap=8,w=Math.round((W-32-gap)/2);
  return {x:16+i*(w+gap),y:40,w:w,h:18};
}
function boardRowRect(i){return {x:16,y:92+i*LB_RH-LB.scroll,w:W-32,h:LB_RH};}
/* BACK and REFRESH share the footer row the back button used to have. */
function boardBackRect(){var r=backRect();return {x:r.x,y:r.y,w:Math.round((r.w-10)/2),h:r.h};}
function boardRefreshRect(){
  var r=backRect(),b=boardBackRect();
  return {x:b.x+b.w+10,y:r.y,w:r.w-b.w-10,h:r.h};
}
function boardMaxScroll(){
  var visible=H-92-56;
  return Math.max(0,LB.rows.length*LB_RH-visible);
}
function drawBoard(){
  txtBig('LEADERBOARD',W/2,18,'#ffe066',2);
  var ti,tr,on;
  for(ti=0;ti<BOARD_TABS.length;ti++){
    tr=boardTabRect(ti);on=(LB.era===BOARD_TABS[ti][1]);
    panel(tr,on?C_GOLD:'#2b3340',on?'#1a1608':'#0a0f1c');
    txt(BOARD_TABS[ti][0],tr.x+Math.round(tr.w/2),tr.y+Math.round((tr.h-FH)/2),
        on?C_GOLD:'#5f6a7a',true);
  }
  txt(LB.mode==='live'
        ? (viewingCurrent()?(LB.rows.length+' RUNNERS')
                           :(LB.rows.length+' RUNNERS  -  BEFORE THE ROSTER PATCH'))
        :'OFFLINE  -  THIS DEVICE ONLY',W/2,64,'#3f6490',true);
  var top=86,bot=H-56;
  ctx.save();ctx.beginPath();ctx.rect(0,top,W,bot-top);ctx.clip();
  if(!LB.rows.length){
    txt(LB.busy?'LOADING':(viewingCurrent()?'NO RUNS YET':'NOTHING HERE'),
        W/2,top+30,'#3f6490',true);
  }else{
    for(var i=0;i<LB.rows.length;i++){
      var r=boardRowRect(i);
      if(r.y+r.h<top||r.y>bot)continue;
      drawLbRow(r,LB.rows[i],i+1,LB.rows[i].id===playerId);
    }
  }
  ctx.restore();
  if(boardMaxScroll()>0){                            /* scroll position */
    var tr=Math.round((bot-top)*(LB.scroll/(boardMaxScroll()+(bot-top))));
    var th=Math.max(12,Math.round((bot-top)*((bot-top)/(LB.rows.length*LB_RH))));

/* ================= wave picker ================= */
/* 10x10 of every wave in the run, so any wave is one tap away. Boss waves
   (every tenth) are picked out in gold. */
var PICK_CW=22,PICK_CH=18,PICK_GAP=2;
function pickGridX(){return Math.round((W-(10*PICK_CW+9*PICK_GAP))/2);}
function pickGridY(){
  var gh=10*PICK_CH+9*PICK_GAP;
  return Math.max(70,Math.round((H-40-gh)/2)+10);
}
function pickRect(n){                        /* n is 1..100 */
  var k=n-1,col=k%10,row=(k/10)|0;
  return {x:pickGridX()+col*(PICK_CW+PICK_GAP),y:pickGridY()+row*(PICK_CH+PICK_GAP),
          w:PICK_CW,h:PICK_CH};
}
function pickAt(mx,my){
  for(var n=1;n<=MAXWAVE;n++)if(inRect(pickRect(n),mx,my))return n;
  return 0;
}
function drawPick(){

    ctx.fillRect(r.x,r.y,1,r.h);ctx.fillRect(r.x+r.w-1,r.y,1,r.h);
    txt(n,r.x+Math.round(r.w/2),r.y+Math.round((r.h-FH)/2),boss?'#ffd34d':'#9fd8ff',true);
  }

  var br=backRect();panel(br,'#3f6490');

/* Coming back to a backgrounded tab or a reopened home-screen app: catch up
   at once rather than waiting out the poll. */
try{

    document.addEventListener('visibilitychange',function(){
      if(!document.hidden&&(state===MENU||state===BOARD)){lbPoll=LB_POLL;lbLoad();}
    });
}catch(e){}
window.addEventListener('keydown',function(e){
  /* A and D steer the ship, so the game used to swallow them before the name
     field ever saw them: typing an A did nothing. While the field is up the
     game takes no keys at all. */
  if(askName&&promptMode==='show'){
    var sk=e.key.toLowerCase();
    if(sk==='escape'||sk==='enter'||sk===' '){e.preventDefault();closeNamePrompt(false);}
    return;
  }
  if(askName||(nameIn&&e.target===nameIn))return;
  var k=e.key.toLowerCase();
  if(['arrowleft','arrowright','a','d',' '].indexOf(k)>=0)e.preventDefault();
  keys[k]=true;
  if(k==='m'){onMaster=!onMaster;syncVol();saveSnd();}
  if(state===SETTINGS&&confirmAct){
    if(k==='escape'||k==='n')confirmAct='';
    else if(k==='enter'||k==='y')doConfirm();
    return;
  }
  if(state===SETTINGS){
    if(k==='p'||k==='escape'){if(setPage)setPage=0;else closeSettings();return;}
    if(k>='1'&&k<='9'){
      var n=+k-1;
      if(setPage===1){if(n<SHIP_THEMES.length){setShipTheme(n);sfx.pick();setPage=0;}}
      else if(setPage===2){if(n<CHAN.length)chanToggleHit(n);}
      else if(setPage===4){if(n<pfRows().length)pfActivate(n);}
      else if(setPage===3){if(n<gpRows().length)gpActivate(n);}
      else if(n<pageRows().length)activateRow(n);
    }
    return;
  }
  if(state===MENU&&askName)return;                /* the field owns the keys */
  if(state===MENU){
    if(k>='1'&&k<='3'){ac();menuPick(+k-1);return;}
    if(k==='l'){ac();sfx.pick();LB.scroll=0;state=BOARD;lbLoad();return;}
    if(k===' '||k==='enter'){ac();menuPick(0);return;}
    return;
  }
  if(state===BOARD){
    if(k==='r'){if(!LB.busy){sfx.pick();lbPoll=LB_POLL;lbLoad();}return;}
    if(k==='1'||k==='2'){var tg=(k==='1')?BOARD_ERA:PREV_ERA;
      if(LB.era!==tg){sfx.pick();lbPoll=LB_POLL;lbLoad(tg);}return;}
    if(k==='escape'||k==='p'||k===' '||k==='enter'){toMenu();return;}
    if(k==='arrowdown')LB.scroll=Math.min(boardMaxScroll(),LB.scroll+LB_RH);
    if(k==='arrowup')LB.scroll=Math.max(0,LB.scroll-LB_RH);
    return;
  }
  if(state===PICK){
    if(k==='escape'||k==='p'){toMenu();return;}
    if(k>='0'&&k<='9'){if(pickBuf.length<3)pickBuf+=k;return;}
    if(k==='backspace'){pickBuf=pickBuf.slice(0,-1);return;}
    if(k==='enter'||k===' '){
      var want=parseInt(pickBuf,10);
      if(want>=1&&want<=MAXWAVE){ac();sfx.pick();jumpToWave(want);}
      pickBuf='';
    }
    return;
  }
  if((k==='p'||k==='escape')&&state===PLAY){openSettings();return;}
  if(state===LEVELUP&&k>='1'&&k<='9'&&+k<=UPGRADES.length){applyChoice(+k-1);return;}
  if((k===' '||k==='enter')&&(state===OVER||state===WIN)){ac();toMenu();}
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
function pxFromEvent(e){
  var r=cv.getBoundingClientRect();
  var cx=(e.touches&&e.touches[0])?e.touches[0].clientX:e.clientX;
  return (cx-r.left)/r.width*W;
}
function pyFromEvent(e){
  var r=cv.getBoundingClientRect();
  var cy=(e.touches&&e.touches[0])?e.touches[0].clientY:e.clientY;
  return (cy-r.top)/r.height*H;
}
function cardCount(){return choices?choices.length:CARDS;}
/* heading+rule, stat grid, CHOOSE A CARD, the cards - evenly spaced under
   the HUD. One stack so the screen and the card hit-boxes cannot disagree. */
var LU_HEAD_H=20, CARD_H=52, CARD_GAP=13;
function luStack(){
  var n=cardCount(),tot=n*CARD_H+(n-1)*CARD_GAP;
  return evenStack(HUD_H,H,[LU_HEAD_H,STATGRID_H,FH,tot]);
}
function cardRect(i){
  var top=luStack().ys[3];
  return {x:16,y:top+i*(CARD_H+CARD_GAP),w:224,h:CARD_H};
}
/* one line per card saying exactly what the pick does */
function cardDetail(c){
  var u=c.u,v=u.vals?u.vals[c.r]:0;
  if(u.id==='fire')return (FIRE_RATE*upFire).toFixed(1)+' \u2192 '+(FIRE_RATE*(upFire+v/100)).toFixed(1)+'  SHOTS/SEC';
  if(u.id==='dmg') return upDmg.toFixed(2)+'x \u2192 '+(upDmg+v/100).toFixed(2)+'x  DAMAGE';
  if(u.id==='luck')return upLuck+'% \u2192 '+(upLuck+v)+'%  LUCK';
  if(u.id==='crit')return upCrit+'% \u2192 '+(upCrit+v)+'%  CRIT';
  if(u.id==='critd')return upCritD.toFixed(2)+'x \u2192 '+(upCritD+v/100).toFixed(2)+'x  CRIT DMG';
  if(u.id==='xp')   return upXp.toFixed(2)+'x \u2192 '+(upXp+v/100).toFixed(2)+'x  XP GAIN';
  if(u.id==='shield')return 'ABSORBS ONE HIT';
  return '+1 HEART   (MAX '+MAX_LIVES+')';
}
function inRect(r,x,y){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
function down(e){
  e.preventDefault();ac();
  var mx=pxFromEvent(e),my=pyFromEvent(e),i;
  /* The card is drawn on top of everything, so it must be TESTED against the
     tap before everything, whatever screen is underneath. Sitting lower down
     this function, it never saw a tap while the settings page was open: the
     settings branch claimed it first and fired whichever Profile row happened
     to be behind the button, so DONE opened the code prompt and CANCEL would
     not cancel. */
  if(askName){
    if(promptMode==='show'){
      /* One button: read it and dismiss. */
      if(inRect(nameOkRect(),mx,my)){sfx.pick();closeNamePrompt(false);}
      return;
    }
    if(inRect(nameFieldRect(),mx,my)){
      if(nameIn){placeNameInput();try{nameIn.focus();}catch(e){}}
      return;
    }
    if(inRect(nameOkRect(),mx,my)){
      if(promptReady()){sfx.pick();closeNamePrompt(true);}
      return;
    }
    if(inRect(nameLaterRect(),mx,my)){sfx.pick();closeNamePrompt(false);return;}
    return;
  }
  if(state===SETTINGS&&confirmAct){
    if(inRect(confirmYes(),mx,my)){sfx.pick();doConfirm();return;}
    if(inRect(confirmNo(),mx,my)){sfx.pick();confirmAct='';return;}
    return;
  }
  if(state===SETTINGS){
    if(inRect(GEAR,mx,my)){dragChan=-1;if(setPage)setPage=0;else closeSettings();return;}
    if(setPage===1){
      for(i=0;i<SHIP_THEMES.length;i++)
        if(inRect(swatchRect(i),mx,my)){setShipTheme(i);sfx.pick();setPage=0;return;}
      if(inRect(backRect(),mx,my))setPage=0;
      return;
    }
    if(setPage===4){
      for(i=0;i<pfRows().length;i++)
        if(inRect(pfRect(i),mx,my)){pfActivate(i);return;}
      if(inRect(backRect(),mx,my))setPage=0;
      return;
    }
    if(setPage===3){
      for(i=0;i<gpRows().length;i++)
        if(inRect(gpRect(i),mx,my)){gpActivate(i);return;}
      if(inRect(backRect(),mx,my))setPage=0;
      return;
    }
    if(setPage===2){
      for(i=0;i<CHAN.length;i++){
        if(inRect(chanToggle(i),mx,my)){chanToggleHit(i);return;}
        if(inRect(chanGrab(i),mx,my)){dragChan=i;chanSet(i,mx);return;}
      }
      if(inRect(backRect(),mx,my))setPage=0;
      return;
    }
    var rw=pageRows();
    for(i=0;i<rw.length;i++)if(inRect(pageRect(i),mx,my)){activateRow(i);return;}
    return;
  }
  if(state===LEVELUP){
    for(i=0;i<choices.length;i++){var rc=cardRect(i);if(my>=rc.y&&my<=rc.y+rc.h){applyChoice(i);return;}}
    return;
  }
  if(state===MENU){
    if(inRect(lbPanel(),mx,my)){sfx.pick();LB.scroll=0;state=BOARD;lbLoad();return;}
    for(i=0;i<MENU_ITEMS.length;i++)
      if(inRect(menuRect(i),mx,my)){menuPick(i);return;}
    return;
  }
  if(state===BOARD){
    for(i=0;i<BOARD_TABS.length;i++)
      if(inRect(boardTabRect(i),mx,my)){
        if(LB.era!==BOARD_TABS[i][1]){sfx.pick();lbPoll=LB_POLL;lbLoad(BOARD_TABS[i][1]);}
        return;
      }
    if(inRect(boardRefreshRect(),mx,my)){
      if(!LB.busy){sfx.pick();lbPoll=LB_POLL;lbLoad();}
      return;
    }
    if(inRect(boardBackRect(),mx,my)){sfx.pick();toMenu();return;}  /* resets the era */
    dragBoard=true;dragY=my;dragFrom=LB.scroll;
    return;
  }
  if(state===PICK){
    if(inRect(backRect(),mx,my)){toMenu();return;}
    var wsel=pickAt(mx,my);
    if(wsel){sfx.pick();jumpToWave(wsel);}
    return;
  }
  if(state===PLAY&&inRect(GEAR,mx,my)){openSettings();return;}
  if(state===OVER||state===WIN){toMenu();return;}
  if(state!==PLAY)return;
  ptr.active=true;ptr.x=mx;
}
function move(e){
  if(dragBoard){
    e.preventDefault();
    LB.scroll=Math.max(0,Math.min(boardMaxScroll(),dragFrom+(dragY-pyFromEvent(e))));
    return;
  }
  if(state===SETTINGS){
    if(dragChan>=0){e.preventDefault();chanSet(dragChan,pxFromEvent(e));}
    return;
  }
  if(ptr.active){e.preventDefault();ptr.x=pxFromEvent(e);}
}
function up(){ptr.active=false;dragChan=-1;dragBoard=false;}
cv.addEventListener('mousedown',down);
/* Tracked on the WINDOW, not the canvas. Listening on the canvas meant the
   moment the cursor slid off the playfield the ship stopped following it and
   stuck where it was - easy to do on a desktop, where the canvas is a narrow
   strip in the middle of a wide page. The ship is clamped to the playfield
   anyway, so an off-canvas cursor simply pins it to that edge and it picks
   the drag straight back up on the way in. */

/* ================= update ================= */
function killAlien(a,i){
  reward(a.t.xp);kills++;
  var cy=a.y+a.t.h/2;
  /* killing a splitter does not clear the space, it fills it */
  if(a.t.splits){
    var mt=TYPES.mite,n,sx,mhp=mt.hp*curw.hp;
    for(n=0;n<a.t.splits;n++){
      sx=a.x+(n===0?-a.t.w*0.28:a.t.w*0.28);
      sx=Math.max(mt.w/2+2,Math.min(W-mt.w/2-2,sx));
      aliens.push({t:mt,x:sx,y:a.y+Math.round(a.t.h/2-mt.h/2),hp:mhp,max:mhp,
        fl:0,spd:mt.spd*curw.spd,base:mt.spd*curw.spd,sh:0,shmax:0,
        quiet:0,ph:0,solid:true,bites:makeAlienBites(mt,5)});
    }
    burst(a.x,cy,14,a.t.col,1.5);
  }
  if(a.t.boss){burst(a.x,cy,40,a.t.col,2.2);burst(a.x,cy,20,'#ffffff',1.5);
    sfx.killBoss();shake=Math.max(shake,6);bossBounty();}
  else if(a.t.w>=34){burst(a.x,cy,24,a.t.col,1.8);sfx.killBrute();shake=Math.max(shake,3);}
  else if(a.t.w>=24){burst(a.x,cy,15,a.t.col,1.3);sfx.killDrone();}
  else{burst(a.x,cy,10,a.t.col,1.3);sfx.killScout();}
  aliens.splice(i,1);
}
/* Beating a boss patches you up: short of a full three hearts and you are put
   back to three, already at three or more and you gain one, never past the cap.
   This replaces the old bonus for merely arriving at a boss wave. */
function bossBounty(){
  var was=lives;
  lives=(lives<START_LIVES)?START_LIVES:Math.min(MAX_LIVES,lives+1);
  if(lives>was){
    banner=(was<START_LIVES)?'LIVES RESTORED':'+1 LIFE';
    bannerT=1.9;sfx.lifeGain();
    for(var i=0;i<14;i++)burst(ship.x+(Math.random()*40-20),SHIP_Y,2,'#ff4d6d',1.3);
  }
}
/* Where to put the ship back: the x with the most room from whatever is still
   on screen, weighting things nearest the ship's row most heavily. */
function safestX(){
  var bestX=W/2,bestScore=-1,i;
  for(var cx=HITW+2;cx<=W-HITW-2;cx+=4){
    var worst=1e9;
    for(i=0;i<aliens.length;i++){
      var a=aliens[i];
      worst=Math.min(worst,Math.abs(a.x-cx)-a.t.w/2+Math.max(0,SHIP_Y-(a.y+a.t.h))*0.30);
    }
    for(i=0;i<rocks.length;i++){
      var r=rocks[i];
      worst=Math.min(worst,Math.abs(r.x-cx)-r.r+Math.max(0,SHIP_Y-r.y)*0.30);
    }
    if(worst>bestScore){bestScore=worst;bestX=cx;}
  }
  return bestX;
}
/* The boss cannot be traded for a life: ramming it used to clear it off the
   field and hand you the next wave. Contact or a breakthrough ends the run. */
/* EVERY way a run can end funnels through here. It used to be that only the
   boss paths posted to the board, so an ordinary death - running out of lives
   - recorded nothing at all. One funnel means that can't drift apart again. */
function endRun(reason){
  overReason=reason||'RUN OVER';
  if(!testRun&&score>best)best=score;
  state=OVER;running=false;MUS.stop();
  lbSubmit(wi+1,score);
}
function runOver(reason,explode){
  if(explode){
    burst(ship.x,SHIP_Y+SHIP_H/2,40,'#8fe9ff',2.4);
    burst(ship.x,SHIP_Y+SHIP_H/2,20,'#ff8a2b',1.8);
  }
  sfx.lifeLost();shake=8;lives=0;bullets.length=0;
  endRun(reason);
}
/* Letting something through is now a failure, not just lost points: three
   leaks ends the run exactly like three collisions would. */
function leakHit(){
  leaked++;lives--;
  sfx.leak();shake=5;alarmT=0.6;
  if(lives<=0)runOver('TOO MANY GOT PAST YOU',false);
}
/* Getting clipped by an alien used to leave you buried in the rest of them.
   The whole formation is shoved back so the lowest one sits on the midline. */
function pushAliensBack(){
  var mid=H*0.5,low=-1e9,i;
  for(i=0;i<aliens.length;i++)low=Math.max(low,aliens[i].y+aliens[i].t.h);
  var delta=low-mid;
  if(delta<=0)return;
  for(i=0;i<aliens.length;i++){
    aliens[i].y-=delta;
    var topY=-aliens[i].t.h-2;
    if(aliens[i].y<topY)aliens[i].y=topY;
  }
  /* The clamp above collapses any brute stagger onto one line. Rebuild it. */
  enforceBruteSpacing();
  for(i=0;i<10;i++)burst(ship.x+(Math.random()*120-60),H*0.55,2,'#8fe9ff',1.4);
}
function takeHit(cause,alienHit){
  if(alienHit)pushAliensBack();
  if(shield){
    shield=false;
    burst(ship.x,SHIP_Y+SHIP_H/2,26,'#8fe9ff',1.9);
    sfx.shieldBreak();shake=4;invT=Math.max(invT,1.2);
    return;
  }
  playerDies(cause);
}
function playerDies(cause){
  burst(ship.x,SHIP_Y+SHIP_H/2,36,'#8fe9ff',2.2);
  burst(ship.x,SHIP_Y+SHIP_H/2,18,'#ff8a2b',1.5);
  sfx.lifeLost();shake=7;lives--;
  bullets.length=0;                 /* the field itself stays exactly as it was */
  if(lives<=0){endRun(cause);}
  else{respawnT=1.1;invT=INVULN+1.1;ptr.active=false;   /* stay where you fell */
       spawnT=Math.max(spawnT,1.4);mT=Math.max(mT,2.0);}
}
function update(dt){
  for(var s=0;s<stars.length;s++){
    stars[s].y+=stars[s].s*dt;
    if(stars[s].y>H){stars[s].y=-1;stars[s].x=Math.random()*W;}
  }
  if(shake>0)shake=Math.max(0,shake-dt*14);
  if(alarmT>0)alarmT=Math.max(0,alarmT-dt);
  if(lvlFlash>0)lvlFlash=Math.max(0,lvlFlash-dt);
  lbTick(dt);
  /* The clock behind every animation. It used to stop dead outside PLAY, which
     froze the rainbow on the level-up screen and left the text caret stuck
     mid-blink on the name and code cards. Every gameplay use of it is a
     relative measure - gameT plus a travel time, compared against gameT in the
     same breath - so a clock that keeps running while paused changes nothing
     about spawning or fairness. */
  gameT+=dt;
  if(state!==PLAY)return;
  /* Just died: hold everything in place for a beat, play out the explosion,
     then hand the ship back into the same situation it was lost in. */
  if(respawnT>0){
    respawnT-=dt;
    for(var rp=parts.length-1;rp>=0;rp--){
      var rq=parts[rp];
      rq.x+=rq.vx*60*dt;rq.y+=rq.vy*60*dt;rq.vy+=28*dt;
      rq.life-=dt;if(rq.life<=0)parts.splice(rp,1);
    }
    return;
  }
  if(bannerT>0)bannerT-=dt;
  if(invT>0)invT-=dt;
  if(lvlInvT>0)lvlInvT=Math.max(0,lvlInvT-dt);

  /* ---- ship ---- */
  var shipPrevX=ship.x;
  var dir=0;
  if(keys['arrowleft']||keys['a'])dir-=1;
  if(keys['arrowright']||keys['d'])dir+=1;
  var half=SHIP_W/2;
  /* Touch is absolute: the ship sits under the finger, no lag, no top speed.
     Keys move at a fixed clip; the guard still budgets the slower 240. */
  if(dir!==0){ship.x+=dir*SHIP_SPD*dt;ptr.active=false;}
  else if(ptr.active){ship.x=ptr.x;}
  ship.x=Math.max(half+1,Math.min(W-half-1,ship.x));
  /* the hull occupies everything it passed through this frame, so a touch
     flick across the screen collects whatever was in the way */
  var sweepLo=Math.min(shipPrevX,ship.x),sweepHi=Math.max(shipPrevX,ship.x);

  /* ---- auto gun ---- */
  if(respawnT<=0){
    fireT-=dt;
    while(fireT<=0){bullets.push({x:Math.round(ship.x),y:SHIP_Y-4});shots++;fireT+=fireGap();sfx.shoot();}
  }else fireT=0;

  /* ---- bullets: aliens take damage, rocks eat the shot ---- */
  for(var b=bullets.length-1;b>=0;b--){
    var bu=bullets[b];bu.y-=BULLET_SPD*dt;
    if(bu.y<-6){bullets.splice(b,1);continue;}
    var gone=false;
    for(var i=0;i<aliens.length;i++){
      var a=aliens[i],aw=a.t.w/2;
      /* symmetric about the centre, to match where it is drawn */
      if(a.solid&&bu.x+1>=a.x-aw&&bu.x-1<=a.x+aw&&bu.y<=a.y+a.t.h&&bu.y+5>=a.y){
        var cr=upCrit>0&&Math.random()*100<upCrit;
        var dv=bulletDmg()*(cr?upCritD:1);
        /* a carapace shrugs a flat amount off every hit, so a wall of tiny
           fast shots barely scratches it and a heavy shot still tells */
        if(a.t.dr)dv=Math.max(1,dv-a.t.dr);
        a.quiet=0;
        if(a.sh>0){                       /* the shield eats it first */
          var into=Math.min(a.sh,dv);a.sh-=into;dv-=into;
          burst(bu.x,bu.y,3,'#19d0c8',1.1);
        }
        if(dv>0)a.hp-=dv;
        a.fl=0.07;hits++;burst(bu.x,bu.y,cr?4:2,cr?'#ffd34d':'#ffe066',cr?1.2:0.9);
        addDmgNum(a.x,bu.y,dv>0?dv:into,cr,a.t.w/2);
        bullets.splice(b,1);gone=true;
        if(a.hp<=0)killAlien(a,i);else sfx.hit();
        break;
      }
    }
    if(gone)continue;
    for(var m=0;m<rocks.length;m++){
      var rk=rocks[m],ex=bu.x-rk.x,ey=bu.y-rk.y;
      if(ex*ex+ey*ey<(rk.r+2)*(rk.r+2)){
        var f0=1-rk.hp/rk.max;
        var rcr=upCrit>0&&Math.random()*100<upCrit;
        var rdv=bulletDmg()*(rcr?upCritD:1);
        rk.hp-=rdv;rk.fl=0.06;hits++;addDmgNum(rk.x,bu.y,rdv,rcr,rk.r);
        burst(bu.x,bu.y,3,'#d8cdb8',1.0);
        var f1=1-rk.hp/rk.max;
        if(Math.floor(f1*6)>Math.floor(f0*6))         /* a piece breaks off */
          burst(rk.x+(Math.random()*2-1)*rk.r,rk.y+(Math.random()*2-1)*rk.r,4,'#a2957f',1.2);
        bullets.splice(b,1);
        if(rk.hp<=0){
          reward(rk.xp);broken++;
          burst(rk.x,rk.y,10+rk.r*2,'#efe4cc',1.5);
          burst(rk.x,rk.y,6+rk.r,'#a2957f',1.1);
          if(rk.r>=9){sfx.big();shake=Math.max(shake,2);}else sfx.pop();
          rockBlast(rk);
          rocks.splice(m,1);
        }else sfx.clang();
        break;
      }
    }
  }

  /* ---- aliens: fixed x, pure y travel ---- */
  enforceBruteSpacing();
  for(var j=aliens.length-1;j>=0;j--){
    var al=aliens[j];
    /* a diver starts slow and comes down like a thrown knife */
    if(al.t.accel&&al.spd<al.base*al.t.accel)
      al.spd=Math.min(al.base*al.t.accel,al.spd+al.base*al.t.accel*0.42*dt);
    /* a knitter stitches itself back together if you look away */
    if(al.t.regen){
      al.quiet+=dt;
      if(al.quiet>1.2&&al.hp<al.max)al.hp=Math.min(al.max,al.hp+al.max*al.t.regen*dt);
    }
    /* a phantom fades out and bullets pass straight through */
    if(al.t.phase){
      al.ph+=dt;
      var on=al.t.phase[0],off=al.t.phase[1];
      if(al.solid&&al.ph>=on){al.solid=false;al.ph=0;}
      else if(!al.solid&&al.ph>=off){al.solid=true;al.ph=0;}
    }
    al.y+=al.spd*dt;
    if(al.fl>0)al.fl-=dt;
    if(al.y>H+4){
      if(al.t.boss){runOver(al.t.nm.replace('THE ','')+' BROKE THROUGH',false);return;}
      aliens.splice(j,1);leakHit();
      if(state!==PLAY)return;
      continue;
    }
    if(respawnT<=0&&invT<=0){
      var ax=al.t.w/2-2,px=HITW;
      if(al.y+al.t.h-1>SHIP_Y+2&&al.y<SHIP_Y+SHIP_H-1&&
         al.x+ax>sweepLo-px&&al.x-ax<sweepHi+px){
        if(al.t.boss){runOver(al.t.dth,true);return;}
        burst(al.x,al.y+al.t.h/2,12,al.t.col,1.3);
        aliens.splice(j,1);takeHit(al.t.dth,true);return;
      }
    }
  }

  /* ---- meteors: free vector, indestructible ---- */
  for(var q=rocks.length-1;q>=0;q--){
    var ro=rocks[q];
    ro.x+=ro.vx*dt;ro.y+=ro.vy*dt;ro.fi+=ro.fs*dt;if(ro.fl>0)ro.fl-=dt;
    if(!ro.passed&&ro.y-ro.r>SHIP_Y+SHIP_H){ro.passed=true;dodged++;}
    if(ro.y-ro.r>H+6||ro.x<-ro.r-90||ro.x>W+ro.r+90){rocks.splice(q,1);continue;}
    if(respawnT<=0&&invT<=0){
      var bx0=sweepLo-HITW,bx1=sweepHi+HITW,by0=SHIP_Y+5,by1=SHIP_Y+SHIP_H-2;
      var nx=Math.max(bx0,Math.min(ro.x,bx1)),ny=Math.max(by0,Math.min(ro.y,by1));
      var ddx=ro.x-nx,ddy=ro.y-ny,rr=ro.r*0.82;
      if(ddx*ddx+ddy*ddy<rr*rr){
        burst(ro.x,ro.y,16,'#a89c8b',1.6);
        rocks.splice(q,1);takeHit('A METEOR TOOK YOU OUT');return;
      }
    }
  }

  for(var dn=dnums.length-1;dn>=0;dn--){
    var dd=dnums[dn];dd.y+=dd.vy*dt;dd.vy*=0.92;
    dd.life-=dt;if(dd.life<=0)dnums.splice(dn,1);
  }
  /* ---- particles ---- */
  for(var p=parts.length-1;p>=0;p--){
    var pt=parts[p];
    pt.x+=pt.vx*60*dt;pt.y+=pt.vy*60*dt;pt.vy+=28*dt;
    pt.life-=dt;if(pt.life<=0)parts.splice(p,1);
  }
  for(var sk=shocks.length-1;sk>=0;sk--){
    shocks[sk].life-=dt;if(shocks[sk].life<=0)shocks.splice(sk,1);
  }

  /* ---- wave flow ---- */
  spawnT-=dt;
  if(queue.length&&aliens.length<conc&&spawnT<=0){
    if(spawnAlien(false)){spawnT=gap*(0.8+Math.random()*0.45);blockT=0;}
    else{spawnT=0.25;blockT+=0.25;
      if(blockT>6){spawnAlien(true);blockT=0;spawnT=gap;}}
  }
  if(mplan&&respawnT<=0){
    mT-=dt;
    if(mT<=0&&rocks.length<mplan.max){spawnMeteor();mT=mplan.gap*(0.75+Math.random()*0.55);}
    else if(mT<=0)mT=0.5;
  }
  if(pendLv>0&&state===PLAY){openLevelUp();return;}
  if(running&&!queue.length&&!aliens.length&&respawnT<=0){
    if(wi+1<MAXWAVE){reward(25*(wi+1));startWave(wi+1);}
    else{if(!testRun&&score>best)best=score;MUS.stop();sfx.win();state=WIN;running=false;
      lbSubmit(MAXWAVE,score);}
  }
}
