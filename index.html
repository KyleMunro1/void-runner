       waves, same cards, same everything - with the bot at the controls.
       jumpToWave sets testRun, which is what keeps it off the leaderboard:
       the board is for people. */
    sfx.pick();closeSettings();
    pickBot=true;pickBuf='';state=PICK;
  }
  else if(lab==='HOW TO PLAY'){sfx.pick();infoBack=SETTINGS;state=INFO;}
}
/* Dispatched on the row's label, not its position. The list differs between
   the menu and a paused run and has been reordered more than once; an
   index-based switch silently fires the wrong row every time that happens. */
function activateRow(i){
  var rows=pageRows();
  if(i<0||i>=rows.length)return;
  var label=rows[i][0];
  sfx.pick();
  if(label==='PROFILE')setPage=4;
  else if(label==='SOUND')setPage=2;
  else if(label==='GAMEPLAY')setPage=3;
  else if(label==='MAIN MENU')askConfirm('menu');
  else if(label==='RESTART RUN')askConfirm('restart');
  else closeSettings();                       /* BACK and RESUME */
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
/* The one place the pool is decided. It used to be written out twice - here
   and in simCard, which plays the economy forward for a demo jump - and when
   CRIT DAMAGE stopped being held back only one copy was changed, so a
   fast-forwarded build was dealt from five cards while a real one was dealt
   from six. Seventh duplicated rule in this file to drift; derive, never
   repeat.
   CRIT DAMAGE used to be held back until you had crit chance to use it. Two
   reasons it is not any more. A big crit damage card early is a REASON to go
   looking for crit chance, which is a decision worth having. And holding one
   card back shrank the pool from six to five, so with three dealt, every
   other card - LUCK included - came up noticeably more often before you had
   crit than after. The pool is the same size all run now, so no card's
   frequency moves as the run goes. */
function cardPool(){
  var pool=[],i,u;
  for(i=0;i<UPGRADES.length;i++){
    u=UPGRADES[i];
    if(u.off||u.kind==='once')continue;
    if(u.id==='luck'&&upLuck>=LUCK_FULL)continue;  /* maxed: would do nothing */
    pool.push(u);
  }
  return pool;
}
function openLevelUp(){
  var list=[],i,u;
  list=list.concat(shuffle(cardPool())).slice(0,CARDS);
  shuffle(list);
  var picked=[];
  for(i=0;i<list.length;i++)
    picked.push({u:list[i],r:(list[i].kind==='once')?list[i].fixed:rollRarity()});
  choices=picked;state=LEVELUP;lvlFlash=0.75;
  /* Auto levelling reads the card for you and must not be held up by the lock,
     so it picks before the lock is armed. The bot levels the same way - see
     the note above autoPick's use by the bot. */
  if(autoPlay||autoLevel){applyChoice(autoPick(),true);return;}
  sfx.level();
  lvlLock=LVL_LOCK;luAnim=0;luT=0;
}
function grantUpgrade(u,r){
  upPop(u,r);                       /* say what was taken, bottom right */
  if(u.kind==='mult'){var v=u.vals[r]/100;
    if(u.id==='fire')upFire+=v;else if(u.id==='dmg')upDmg+=v;
    else if(u.id==='xp')upXp+=v;else upCritD+=v;}
  else if(u.kind==='add'){
    if(u.id==='luck')upLuck=Math.min(LUCK_FULL,upLuck+u.vals[r]);
    else upCrit+=u.vals[r];
  }
  else if(u.id==='shield')shield=true;
}
/* Auto levelling takes the rarest card on the table, and chooses at random
   between cards that tie on rarity.
   It used to break those ties on the printed percentage, which quietly made
   it an XP farm: XP GAIN carries the biggest numbers of any card - 50 at
   insanity against damage's 30 - so whenever it appeared at the top rarity it
   won. But +50% XP and +30% damage are not the same unit, and comparing them
   by the number printed on the card is comparing nothing at all. Worse, the
   one it kept choosing was the one that generates more levels, which feeds
   the loop that deals more cards. */
/* Highest rarity wins, ties broken at random, and nothing else is weighed -
   not even a crit damage card with no crit chance behind it yet. That looked
   like a card doing nothing, which is why this briefly filtered it out, but a
   multiplier is banked for the rest of the run: take the gold now, find crit
   chance later, and it pays from that point on. It is also what a player
   does with that offer, and AUTO LEVEL is meant to play the way you would.
   So rarity is the whole rule - do not add usefulness to it. */
function autoPick(){
  var tied=[],br=-1,i,r;
  for(i=0;i<choices.length;i++){
    r=choices[i].r;
    if(r>br){br=r;tied=[i];}
    else if(r===br)tied.push(i);
  }
  return tied[Math.floor(Math.random()*tied.length)];
}
function applyChoice(i,force){
  if(state!==LEVELUP||!choices||!choices[i])return false;
  /* Still settling: a touch that was already on its way cannot pick a card. */
  if(lvlLock>0&&!force)return false;
  var c=choices[i];
  grantUpgrade(c.u,c.r);
  /* Not while auto levelling: that reads the card for you in no time at all,
     and at high luck it fires often enough that the grace would be permanent. */
  if(!autoLevel){invT=Math.max(invT,LVL_INVULN);lvlInvT=LVL_INVULN;}
  pendLv--;choices=null;sfx.pick();
  if(pendLv>0)openLevelUp();else{state=PLAY;lvlLock=0;}
  return true;
}

/* ---- practice jump ----
   A fresh run dropped straight onto a later wave, kitted out the way arriving
   there would leave you: one stat upgrade per level skipped, rarities rolled
   normally. Stat cards only - never a shield, never an extra life - and the
   wave-arrival bonus life is suppressed, so you always land on exactly
   START_LIVES with nothing banked. */
/* A run started from the wave picker is a test, so it never touches BEST. */
var testRun=false,startedAt=1,pickBuf='';
/* Set when the wave picker was opened from AI RUN rather than from the
   vaulted demo entry. jumpToWave consumes it, so the picker itself does not
   need to know which of its two ways in was used. */
var pickBot=false;
/* One level-up, resolved the way AUTO LEVEL resolves it: deal the same three
   cards the real screen would, take the rarest, and choose at random between
   any that tie. */
function simCard(){
  var i,three,r,br=-1,tied=[],c;
  var pool=cardPool();
  if(!pool.length)return;
  shuffle(pool);
  three=pool.slice(0,CARDS);
  for(i=0;i<three.length;i++){
    r=rollRarity();
    if(r>br){br=r;tied=[{u:three[i],r:r}];}
    else if(r===br)tied.push({u:three[i],r:r});
  }
  c=tied[Math.floor(Math.random()*tied.length)];
  grantUpgrade(c.u,c.r);
}
function jumpToWave(n){
  n=Math.max(1,Math.min(MAXWAVE,Math.round(n)));
  reset();
  testRun=true;startedAt=n;
  /* It used to hand out exactly one random upgrade per wave skipped, so wave
     100 arrived at level 100 with 99 cards taken at random rarities. That is
     not a run: by wave 100 XP gain has compounded and you would be several
     times that level, and AUTO LEVEL would have been taking the rarest card
     on every table rather than any card at all.
     So play the economy forward instead - each wave's XP at the multiplier
     you have earned by then, levelling exactly as the real loop does, and
     taking cards the way AUTO LEVEL does. The level you land on is whatever
     that produces. */
  var i,w,d,k,base;
  for(w=1;w<n;w++){
    d=waveDef(w-1);
    base=0;
    for(k in d.mix)if(TYPES[k])base+=d.mix[k]*TYPES[k].xp;
    if(d.boss)base+=bossFor(w-1).xp;
    base+=25*w;                              /* the clear bonus */
    score+=base;
    xp+=Math.max(1,Math.round(base*upXp));
    while(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=xpForLevel(level);simCard();}
  }
  ups=[];                                    /* no popups for upgrades you never saw */
  pendLv=0;choices=null;
  startWave(n-1);
  hp=START_HP;shield=false;                  /* no freebies for skipping ahead */
  testRun=true;startedAt=n;  /* reset() cleared it, set it back */
  autoPlay=pickBot;pickBot=false;   /* reset() cleared this too; consume it */
  if(autoPlay){banner='BOT PILOTING';bannerT=2.2;}
  state=PLAY;MUS.start();
}
function buildQueue(w){
  var q=[],k,i,n;
  for(k in w.mix){for(i=0,n=w.mix[k];i<n;i++)q.push(k);}
  for(i=q.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=q[i];q[i]=q[j];q[j]=t;}
  /* never open a wave with one of the heavy, capped kinds */
  if(q.length&&TYPES[q[0]]&&TYPES[q[0]].maxOn!==undefined){
    for(i=1;i<q.length;i++)
      if(!TYPES[q[i]]||TYPES[q[i]].maxOn===undefined){var h=q[0];q[0]=q[i];q[i]=h;break;}
  }
  if(w.boss)q.unshift('boss');          /* lead with it, so there is time to fight */
  return q;
}
function startWave(n){
  running=true;
  wi=n;curw=waveDef(wi);var w=curw;
  queue=buildQueue(w);conc=w.conc;gap=w.gap;spawnT=1.1;blockT=0;

  mplan=meteorPlan(wi);mT=mplan?2.2:0;
  MUS.bpm=Math.min(190,104+wi*2.2);      /* 104 at wave 1, capped at 190 */
  MUS.stage=musStage(wi);
  banner='WAVE '+(wi+1);
  if(curw.boss)banner='WAVE '+(wi+1)+'   '+bossFor(wi).nm;
  bannerT=1.9;sfx.wave();
}
function reset(){
  ship={x:W/2};
  /* The bot drives by setting ptr.active every frame and never clears it, so
     a run started straight after one - by keyboard, with no tap release and
     no arrow key to break the latch - opened with the ship snapped to
     wherever the bot left it and frozen there. Any pointer release or arrow
     key already cleared it, which is why it almost never showed; a new run
     should not depend on that. */
  ptr.active=false;ptrHeld=false;
  aliens=[];bullets=[];rocks=[];parts=[];shocks=[];
  score=0;hp=START_HP;leaked=0;kills=0;shots=0;hits=0;dodged=0;broken=0;gameT=0;
  alarmT=0;dnums=[];ups=[];heals=[];overReason='';lvlFlash=0;
  /* gameT goes back to 0 here, so a timestamp left over from the last run
     would read as far in the future and silence the gun until it caught up */
  shotSndT=-1;lvlSndT=-1;
  fireT=0;shake=0;invT=INVULN;lvlInvT=0;respawnT=0;blockT=0;
  level=1;xp=0;xpNeed=xpForLevel(1);pendLv=0;choices=null;
  upFire=1;upDmg=1;upLuck=0;upCrit=0;upCritD=1.1;upXp=1;shield=false;dnums=[];ups=[];
  startWave(0);state=PLAY;MUS.start();testRun=false;startedAt=1;confirmAct='';
  autoPlay=false;    /* set again straight after, by the one caller that wants it */
}

/* ================= spawning ================= */
/* There was a fairness guard here: every spawn was tested to make sure the
   player could still physically reach a gap, and held back if not. It is gone
   on purpose. It was refusing between a third and sixty per cent of all spawn
   attempts - worst in the middle of the run, where it had no depth scaling to
   loosen it - so the screen stayed near-empty exactly when the difficulty was
   supposed to be building. The game is meant to look impossible without a
   good build, and a guard that promises you can always dodge cannot deliver
   that. What remains is the lane clash test below, which only stops two
   aliens being drawn on top of each other. */
var PAD=HITW+4;
/* how close two aliens may be as they come out of the bar, before it just
   looks like one sprite drawn over another */
var CLASH_Y=104,CLASH_X=46;

/* Brutes are slow, tanky and wide, and two of them entering side by side at
   the same height is a wall: there is no gap to shoot through and not enough
   time to clear either one. So no two brutes ever share a vertical slice of
   the screen. A new brute starts high enough that its lowest pixel clears the
   top of the highest brute already falling, and since every brute in a wave
   falls at the same speed, that stagger holds the whole way down.
   Scouts and drones are unaffected - they die fast enough to shoot through. */
var BRUTE_VGAP=2;
/* Brutes move at half the speed of a scout, so they LINGER: a wave that is
   a third brutes puts far more than a third of them on screen at any moment,
   and they pile up into a wall. This caps how many may be in front of you at
   once, and lets that grow across the run the way the rest of the difficulty
   does. When the cap is reached the queue simply serves something else first,
   so the wave keeps flowing and the brutes arrive spread out instead of
   together. */
/* How fast a knitter mends what is around it. The fraction COMPOUNDS with the
   wave at the same rate health does, counted from the wave knitters arrive,
   because a flat fraction quietly stops mattering: health and the player's
   damage both compound, and measured against a median build 5.5% a second was
   worth 0.8% of the gun at wave 71 and 0.1% of it by 151. A knitter was
   supposed to be the thing you kill first and had become decoration.
   HEAL_CAP is where it stops. At 400% a second a mended alien is back to full
   four times over between shots, which is as threatening as the mechanic can
   be - and a median build still out-paces it, by a factor of twelve at wave
   151, so it is never a wall. The curve reaches the cap around wave 180. */
var HEAL_CAP=4.0;
/* Bumped once a frame. An alien carries the stamp of the frame it was last
   mended on, which is how a second knitter knows to leave it alone. */
var healStamp=0;
function healRate(t){
  /* clamped at zero, so the rate below the arrival wave is the flat base
     rather than the curve run backwards - academic, since no knitter is
     dealt before wave 71, but it is what the code does */
  var since=Math.max(0,(wi+1)-(ROSTER_FROM[t.key]||1));
  return Math.min(HEAL_CAP,t.heal*Math.pow(HP_GROW,since));
}
/* Which wave each kind first appears on, by key, so a cap can be measured
   against the kind's own age rather than the clock. */
var ROSTER_FROM={};
(function(){for(var i=0;i<ROSTER.length;i++)ROSTER_FROM[ROSTER[i].k]=ROSTER[i].from;})();
/* How many of a kind may be alive at once.
   It eases in one more every TWO waves, holds at its own limit once it gets
   there, and gains one more per decade from arrival. For every kind with a
   limit of four or less that means the limit is reached inside the first
   decade; the brute, at six, is still ramping when its first decade ends.
   SINCE THE KIND ARRIVED - that is the whole correction. The old rule read
   1+floor(wi/4) off the absolute wave number, which was meant to be a gentle
   introduction and only ever worked for the brute, the first kind to unlock.
   By wave 31 that term already allowed eight, so the splitter arrived at its
   full four on the very first wave it existed, and every kind after it did
   the same. Wave 31 went from no splitters to four on screen at once, wave 32
   dealt six of them, and each one leaves two mites behind: a third of the
   wave's work appearing over two waves, which is where runs were stalling.
   The per-type limit is still a shape rule rather than a difficulty setting,
   so it keeps loosening - held flat it became the main brake, because deep
   rosters are mostly heavies and the spawner would idle against a near-empty
   screen. It just loosens on the kind's own clock now. */
function maxOnScreen(t){
  if(!t||t.maxOn===undefined)return 1e9;
  var since=(wi+1)-(ROSTER_FROM[t.key]||1);
  if(since<0)return 0;
  /* Two waves per step on the way in, not one, so a kind takes six waves to
     reach its own limit rather than three. */
  return Math.min(1+Math.floor(since/2),t.maxOn+Math.floor(since/10));
}
/* Each heavy kind had its own limit, but nothing stopped four carapaces,
   four phantoms and two colossi sharing a screen. This is the ceiling on all
   of them together, so the light fast ones always have room to appear and a
   late wave is still a mix rather than a slab. */
function maxHeavies(){
  /* Heavies may now take most of a screen rather than the old flat six, but
     never all of it: a screen that is nothing but brutes is a solid wall with
     no gap to shoot through or slip past, which is unwinnable rather than
     hard. A quarter of the slots stay for the light fast ones. */
  return Math.max(2,Math.min(20,2+Math.floor(wi/6),Math.round(conc*0.75)));
}
function heavyCount(){
  var n=0,i;
  for(i=0;i<aliens.length;i++)if(spacedKind(aliens[i].t))n++;
  return n;
}
function countOf(t){
  var n=0,i;
  for(i=0;i<aliens.length;i++)if(aliens[i].t===t)n++;
  return n;
}
/* Staggering at spawn is not enough on its own. Being clipped by an alien
   shoves the whole formation back and clamps every one of them to the spawn
   line, which collapsed a staggered pair onto exactly the same y; a wave
   change can also leave a faster brute closing on a slower one. So the rule
   is enforced every frame. The lowest brute holds its place and the ones
   above are nudged UP, never down, so this can only ever delay a brute,
   never bring it down on the player sooner. */
/* Applied to every heavy kind, each against its OWN sort: brutes avoid
   brutes, colossi avoid colossi. The small fast ones are left to crowd. */
function spacedKind(t){return t&&t.maxOn!==undefined;}
function enforceBruteSpacing(){
  var i,j,g,list=[];
  for(i=0;i<aliens.length;i++)if(spacedKind(aliens[i].t)&&list.indexOf(aliens[i].t)<0)
    list.push(aliens[i].t);
  for(j=0;j<list.length;j++){
    var b=[];
    for(i=0;i<aliens.length;i++)if(aliens[i].t===list[j])b.push(aliens[i]);
    if(b.length<2)continue;
    b.sort(function(p,q){return q.y-p.y;});      /* lowest first */
    for(i=1;i<b.length;i++){
      var limit=b[i-1].y-b[i].t.h-BRUTE_VGAP;
      if(b[i].y>limit)b[i].y=limit;
    }
  }
}
function bruteSpawnY(t,sy0){
  var top=sy0,i;
  for(i=0;i<aliens.length;i++){
    if(aliens[i].t!==t)continue;
    var above=aliens[i].y-t.h-BRUTE_VGAP;    /* bottom of the new one clears it */
    if(above<top)top=above;
  }
  return top;
}
function spawnAlien(force){
  if(!queue.length)return true;
  /* Normally the front of the queue, but a brute waits its turn when there
     are already as many on screen as this wave allows. */
  var qi=0,head=TYPES[queue[0]],heavies=heavyCount(),hcap=maxHeavies();
  function blocked(ct){
    if(!ct)return false;
    if(countOf(ct)>=maxOnScreen(ct))return true;
    return spacedKind(ct)&&heavies>=hcap;
  }
  if(!force&&blocked(head)){
    var alt=-1,q;
    for(q=1;q<queue.length;q++)if(!blocked(TYPES[queue[q]])){alt=q;break;}
    if(alt<0)return false;            /* everything left is at its cap: wait */
    qi=alt;
  }
  var t=(queue[qi]==='boss')?bossFor(wi):TYPES[queue[qi]],i;
  /* Flush against the underside of the HUD rather than above the canvas: an
     alien that has not reached the playfield yet is completely behind the bar,
     so there is nothing to see and nothing to shoot until it emerges. */
  var afx=rollAffixes(t),spd=t.spd*curw.spd*afx.swift,sy0=HUD_H-t.h;
  if(spacedKind(t)&&insDepth(wi+1)===0)sy0=bruteSpawnY(t,sy0);
  var LN=laneCount(wi+1),CX=clashX(wi+1);
  var order=[];for(i=0;i<LN;i++)order.push(i);
  for(i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tm=order[i];order[i]=order[j];order[j]=tm;}
  var lane=-1;
  for(i=0;i<order.length;i++){
    /* the only test left: do not draw this one on top of something already
       coming out of the bar */
    var lx=laneX(order[i],LN),clash=false;
    for(var a=0;a<aliens.length;a++)
      if(aliens[a].y<CLASH_Y&&Math.abs(aliens[a].x-lx)<CX){clash=true;break;}
    if(!clash){lane=order[i];break;}
  }
  /* every lane is occupied right at the top: wait a beat rather than stack */
  if(lane<0){
    if(!force)return false;
    var far=-1;
    for(i=0;i<LN;i++){
      var lx2=laneX(i,LN),mind=1e9;
      for(var a2=0;a2<aliens.length;a2++)mind=Math.min(mind,Math.abs(aliens[a2].x-lx2));
      /* weight in distance from the ship too, so a forced spawn never lands
         on top of where the player is standing */
      var sc=Math.min(mind,120)+Math.min(Math.abs(ship.x-lx2),120)*0.8;
      if(sc>far){far=sc;lane=i;}
    }
  }
  queue.splice(qi,1);
  var x=laneX(lane,LN)+Math.round((Math.random()*2-1)*5),half=t.w/2;
  x=Math.max(half+2,Math.min(W-half-2,x));
  var hp=hpOf(t),sh0=(t.shield?t.shield*curw.hp:0)+afx.sh;
  aliens.push({t:t,x:x,y:sy0,hp:hp,max:hp,fl:0,spd:spd,base:spd,
    sh:sh0,shmax:sh0,
    quiet:0,ph:0,solid:true,
    dir:(Math.random()<0.5?-1:1),drop:0,
    afx:afx.list,drp:afx.drp,regen:afx.regen,splits:afx.splits,
    bites:makeAlienBites(t,5+Math.floor(t.w/8))});
  if(t.boss)sfx.bossIn();        /* only once it is really on screen */
  return true;
}

/* Meteors: free angle, but the path is BUILT from a crossing point on the
   ship's line, so every rock is guaranteed to threaten the player.
   A reachability test rejects any rock the ship could not physically dodge
   given the rocks already inbound. */
function spawnMeteor(){
  for(var attempt=0;attempt<14;attempt++){
    var roll=Math.random()*ROCK_TOTAL,def=ROCKS[0],acc=0,i;
    for(i=0;i<ROCKS.length;i++){acc+=ROCKS[i].weight;if(roll<=acc){def=ROCKS[i];break;}}
    var r=def.r;
    var cx=r+6+Math.random()*(W-2*(r+6));        /* where it crosses the ship line */
    var sx=-40+Math.random()*(W+80);             /* entry point, may be off-screen */
    var sy=-r-8;
    var dx=cx-sx,dy=LINE_Y-sy,len=Math.sqrt(dx*dx+dy*dy);
    var spd=def.spd*(0.9+Math.random()*0.25)*(mplan?mplan.spd:1);
    var vx=dx/len*spd,vy=dy/len*spd;
    if(vy<18)continue;                            /* never near-horizontal */
    var cross=gameT+(LINE_Y-sy)/vy;               /* when it reaches the line */

    var e0=gameT+((SHIP_Y-r)-sy)/vy,e1=gameT+((SHIP_Y+SHIP_H+r)-sy)/vy;
    var sweep=Math.abs(vx)*(e1-e0)/2;

    var shi=Math.floor(Math.random()*def.shapes.length);
    var rhp=def.hp*(1+wi*0.015);
    rocks.push({r:r,x:sx,y:sy,vx:vx,vy:vy,cx:cx,cross:cross,sweep:sweep,
      hp:rhp,max:rhp,xp:def.xp,blast:def.blast,fl:0,bites:makeBites(r,6+Math.floor(r/2)),
      frames:def.shapes[shi],lit:def.lit[shi],
      fi:Math.random()*ROT,fs:def.spin*ROT*(Math.random()<0.5?-1:1),passed:false});
    return;
  }
}

/* ================= damage numbers ================= */
var dnums=[];
/* Green pluses lifting off whatever a knitter is mending. Without them the
   healing is invisible - health bars creep back up and you cannot see which
   alien is being kept alive, or that anything is doing it. */
var heals=[];
var HEAL_RING=10,          /* pluses thrown off at once, around the alien */
    HEAL_MAX_PARTS=140;
/* A RING around whatever is being mended rather than one plus drifting off
   the top of it. Ten at a time, spread evenly, each drifting outward and up
   as it fades - so which alien is being kept alive, and the fact that
   anything is doing it, is unmistakable from across the screen. */
function healPop(x,y,rx,ry){
  if(heals.length>HEAL_MAX_PARTS-HEAL_RING)return;
  var i,a0=Math.random()*6.2832;
  for(i=0;i<HEAL_RING;i++){
    var an=a0+i*6.2832/HEAL_RING,
        rr=0.55+Math.random()*0.45,
        cx=Math.cos(an),cy=Math.sin(an);
    heals.push({x:x+cx*rx*rr,y:y+cy*ry*rr,
                vx:cx*16,vy:cy*11-20,life:0.70});
  }
}
function drawHeals(){
  for(var i=0;i<heals.length;i++){
    var h=heals[i],x=Math.round(h.x),y=Math.round(h.y);
    ctx.globalAlpha=Math.max(0,Math.min(1,h.life/0.35));
    ctx.fillStyle='#6bff8f';
    ctx.fillRect(x+1,y,1,3);ctx.fillRect(x,y+1,3,1);   /* a 3x3 plus */
  }
  ctx.globalAlpha=1;
}
/* Upgrade popups, bottom right, stacking upward and fading like the damage
   numbers so a run that levels every second still reads. */
var ups=[];
var UP_LIFE=2.0;
function upColour(id){
  if(id==='fire')return C_FIRE;
  if(id==='dmg')return C_DMG;
  if(id==='luck')return C_LUCK;
  if(id==='crit')return C_CRIT;
  if(id==='critd')return C_CRITD;
  if(id==='xp')return C_XP;
  return '#8fe9ff';                 /* shield, and anything added later */
}
function upPop(u,r){
  if(!u)return;
  var label=(u.kind==='once')?u.name:(u.name+' +'+u.vals[r]+'%');
  ups.push({s:label,col:upColour(u.id),r:r,life:UP_LIFE,max:UP_LIFE});
  if(ups.length>10)ups.shift();     /* a long ladder would run off the top */
}
/* How much room a label would have at this spot: the distance to the nearest
   sprite edge on the same row, negative if it would land on one. */
function clearanceAt(px,half,cy){
  var lo=px-half,hi=px+half,worst=1e9,i,a,r;
  for(i=0;i<aliens.length;i++){
    a=aliens[i];
    if(cy+FH<a.y||cy>a.y+a.t.h)continue;
    var al=a.x-a.t.w/2,ah=a.x+a.t.w/2;
    worst=Math.min(worst,(hi<=al)?al-hi:((lo>=ah)?lo-ah:-1));
  }
  for(i=0;i<rocks.length;i++){
    r=rocks[i];
    if(cy+FH<r.y-r.r||cy>r.y+r.r)continue;
    var rl=r.x-r.r,rh=r.x+r.r;
    worst=Math.min(worst,(hi<=rl)?rl-hi:((lo>=rh)?lo-rh:-1));
  }
  return worst===1e9?999:worst;
}
/* The number goes BESIDE whatever was hit, clear of its sprite, rather than on
   top of it where the artwork swallows it. halfW is the target's half width;
   the number is pushed just past that edge, on the side with more room, and is
   nudged vertically if it would land on one that is already there. */
/* Turning a hit into damage lives HERE and nowhere else. It used to be
   written out inline in the bullet loop and again in the test probe, and the
   two drifted: the probe kept a floor of 1 and never knew about ARMOURED, so
   it reported a carapace taking full damage from a bare shot while the game
   itself blunted it correctly. */
function applyHit(a,dv){
  if(a.t.dr)dv=Math.max(DMG_MIN,dv-a.t.dr);   /* a flat amount shrugged off */
  if(a.drp)dv=Math.max(DMG_MIN,dv*(1-a.drp)); /* ARMOURED affix */
  a.quiet=0;
  var into=0;
  if(a.sh>0){into=Math.min(a.sh,dv);a.sh-=into;dv-=into;}
  if(dv>0)a.hp-=dv;
  return {dealt:dv,absorbed:into};
}
function addDmgNum(cx,cy,v,crit,halfW){
  if(!dmgNumbers)return;
  if(dnums.length>44)dnums.shift();
  /* Whole numbers. The decimal was only ever there because at DMG 1 a rounded
     number read "1" on every hit; at DMG 10 there is nothing to show. */
  var val=Math.max(DMG_MIN,Math.round(v));
  var label=String(val)+(crit?'!':'');
  var half=txtW(label)/2;
  var off=(halfW||0)+5+half;
  /* Walk outwards on both sides, and if the row is packed, step above it.
     The first spot clear of EVERY sprite wins, so a number never lands in a
     neighbour either; the roomier side is tried first. */
  var toCentre=(cx>W/2)?-1:1;
  var x=null,y=cy-3,bx=null,bs=-1e9,ci,ri,px,py,sc;
  var rowY=[cy-3,cy-14,cy-24];
  for(ri=0;ri<rowY.length&&x===null;ri++){
    for(ci=0;ci<6;ci++){
      px=cx+(off+(ci>>1)*16)*((ci%2===0)?toCentre:-toCentre);
      py=rowY[ri];
      if(px-half<2||px+half>W-2)continue;
      sc=clearanceAt(px,half,py);
      if(sc>bs){bs=sc;bx=px;y=py;}
      if(sc>=1){x=px;y=py;break;}
    }
  }
  if(x===null){
    /* Row packed solid: the margins are nearly always empty, so take the
       clearer edge rather than dropping the number inside a sprite. */
    var le=2+half,re=W-2-half,ly=rowY[0];
    var lc=clearanceAt(le,half,ly),rc=clearanceAt(re,half,ly);
    if(Math.max(lc,rc)>=1){x=(lc>=rc)?le:re;y=ly;}
    else {x=(bx===null)?cx:bx;if(y===null)y=cy-3;}
  }
  if(x-half<2)x=2+half;
  if(x+half>W-2)x=W-2-half;
  var i,tries=0;
  while(tries<4){                           /* keep stacked hits legible */
    var clash=false;
    for(i=dnums.length-1;i>=0&&i>=dnums.length-6;i--)
      if(Math.abs(dnums[i].x-x)<half+10&&Math.abs(dnums[i].y-y)<8){clash=true;break;}
    if(!clash)break;
    y-=9;tries++;
  }
  var L=crit?0.80:0.55;
  /* the label is carried, not rebuilt: placement measured THIS string, and
     the drawing used to re-derive its own from the raw value - fine while
     that value was a rounded integer, but at DMG 1 it is a float and the
     screen would have read 0.4000000000000001 */
  dnums.push({x:x,y:y,v:val,lab:label,crit:crit,life:L,max:L,vy:-26-Math.random()*12});
}
function drawDmgNums(){
  for(var i=0;i<dnums.length;i++){
    var d=dnums[i];
    ctx.globalAlpha=Math.max(0,Math.min(1,d.life/d.max));
    txt(d.lab,d.x,d.y,d.crit?'#ffd34d':'#e8f2ff',true);
  }
  ctx.globalAlpha=1;
}
/* A halo in the rarity's own colour, breathing rather than static so it reads
   as a glow. Two rings: a solid one against the glyphs and a fainter one
   outside it. The ring positions are walked rather than filling the square,
   so it costs 12 extra draws per line instead of 24. */
var HALO_TOP=3;                  /* how many of the stack get the glow */
function txtHalo(s,x,y,col,glow,t){
  var a0=ctx.globalAlpha,pulse=0.72+0.28*Math.sin(t*4.2),i;
  /* Four cardinals only, one pixel out. It used to be those plus the four
     diagonals plus a second ring - twelve draws - and at one pixel on a 5x7
     font the diagonals land inside the counters of A, O, R and the digits
     and fill them in, so the brighter the rarity the harder its own text was
     to read. A cardinal outline traces the glyph instead of flooding it, and
     at four draws instead of twelve it is a third of the cost with ten of
     these stacked on a phone. */
  var RING=[[0,-1],[-1,0],[1,0],[0,1]];
  ctx.globalAlpha=a0*0.45*pulse;
  for(i=0;i<RING.length;i++)txt(s,x+RING[i][0],y+RING[i][1],glow);
  ctx.globalAlpha=a0;
  txt(s,x,y,col);
}
/* Newest at the bottom, older ones pushed up the stack. */
function drawUpPops(){
  for(var i=0;i<ups.length;i++){
    /* above the ship, not below it, and held off the right edge */
    var u=ups[ups.length-1-i],y=SHIP_Y-16-i*9,x=W-10-txtW(u.s);
    if(y<40)break;
    ctx.globalAlpha=Math.max(0,Math.min(1,u.life/0.45));
    /* Only the newest few are haloed. Each halo is twelve extra text draws,
       and a level ladder can put ten of these up in the same frame - which
       measured at 1556 glyph draws against the 30 this screen otherwise
       needs. The glow is there to announce what was just taken; the ones
       further up the stack are already history and are fading out. */
    if(i<HALO_TOP&&u.r!==undefined&&RARITY[u.r])
      txtHalo(u.s,x,y,u.col,RARITY[u.r].col,gameT+i*0.7);
    else txt(u.s,x,y,u.col);
  }
  ctx.globalAlpha=1;
}


/* ---- debris blast ----
   A shattered rock throws shrapnel: every alien whose body comes within a
   scout's width of the rock's edge takes one instant hit. One hit each, no
   ticks, and it does not set off other rocks or touch the player. */
function rockBlast(rk){
  var reach=rk.r+TYPES.scout.w;
  var dv=(rk.blast||25)*upDmg;
  shocks.push({x:rk.x,y:rk.y,r0:rk.r,max:reach,life:0.30,dur:0.30});
  sfx.blast(rk.r);
  shake=Math.max(shake,rk.r>=9?3:2);
  burst(rk.x,rk.y,8+rk.r,'#ffd9a0',2.0);
  for(var i=aliens.length-1;i>=0;i--){
    var a=aliens[i],ax=a.x,ay=a.y+a.t.h/2;
    var dx=Math.abs(ax-rk.x)-a.t.w/2;if(dx<0)dx=0;
    var dy=Math.abs(ay-rk.y)-a.t.h/2;if(dy<0)dy=0;
    if(dx*dx+dy*dy>reach*reach)continue;
    a.hp-=dv;a.fl=0.10;
    addDmgNum(a.x,ay,dv,false,a.t.w/2);
    burst(ax,ay,5,'#ffb86b',1.3);
    if(a.hp<=0)killAlien(a,i);
  }
}


/* the blast edge, as a one-pixel expanding ring */
function drawShocks(){
  for(var i=0;i<shocks.length;i++){
    var s=shocks[i],k=1-s.life/s.dur;
    var rad=s.r0+(s.max-s.r0)*(1-Math.pow(1-k,2));
    ctx.globalAlpha=Math.max(0,1-k)*0.85;
    ctx.fillStyle=k<0.40?'#fff3cf':(k<0.72?'#ffb86b':'#c8662a');
    var n=Math.max(10,Math.round(rad*2.4));
    for(var j=0;j<n;j++){
      var an=j/n*Math.PI*2;
      ctx.fillRect(Math.round(s.x+Math.cos(an)*rad),Math.round(s.y+Math.sin(an)*rad),1,1);
    }
  }
  ctx.globalAlpha=1;
}

/* ================= particles ================= */
function burst(x,y,n,col,pow){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,s=(0.3+Math.random())*pow;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.3+Math.random()*0.45,max:0.75,c:col});
  }
}

/* ================= players and the leaderboard ================= */
/* A player is a random id kept in this browser, not an account: no sign-in,
   no password, nothing to lose. The name and hull ride along with each score
   so the board can show both. */
/* The player id IS the recovery code, so it has to be readable off a screen
   and typed back in without a squint: no 0/O, no 1/l/i, no u. 30 characters,
   12 long, which is 5.3e17 combinations - nobody is guessing their way onto
   somebody else's row. Anyone holding the code can post as that player, so it
   is a 'keep it to yourself' code, not a password. */
var CODE_ALPHA='23456789abcdefghjkmnpqrstvwxyz';
var CODE_LEN=12;
function newCode(){
  var out='',i,n;
  for(i=0;i<CODE_LEN;i++){
    n=Math.floor(Math.random()*CODE_ALPHA.length);
    if(n>=CODE_ALPHA.length)n=CODE_ALPHA.length-1;
    out+=CODE_ALPHA.charAt(n);
  }
  return out;
}
/* Forgiving about how it comes back in: any case, with or without the dashes
   and spaces the card shows it in. */
function cleanCode(v){
  return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,32);
}
function codeOk(v){return /^[a-z0-9]{6,32}$/.test(v);}
/* Shown in groups of four. Reading twelve unbroken characters off a phone and
   typing them into another one is how people drop a character. */
function codeFmt(v){
  var c=String(v||'').toUpperCase(),out='',i;
  for(i=0;i<c.length;i++){if(i&&i%4===0)out+='-';out+=c.charAt(i);}
  return out;
}

var playerId='',playerName='',askName=false,nameEdit=false,nameDraft='',nameCaret=0;
/* 'name' asks who you are, 'code' takes a code off another device, 'show'
   just displays yours. All three share the one card and the one input. */
var promptMode='name',codeMsg='',codeBusy=false;
try{playerId=localStorage.getItem('vr_pid')||'';}catch(e){}
/* An id already in storage is kept exactly as it is, whatever format it is in:
   regenerating one would strand that player's row on the board forever. */
if(!codeOk(playerId)){
  playerId=newCode();
  try{localStorage.setItem('vr_pid',playerId);}catch(e){}
}
try{playerName=localStorage.getItem('vr_name')||'';}catch(e){}

/* No underscore: the pixel font has no glyph for it, so a name using one
   drew as a blank gap on the board. The server stays permissive for older
   clients; this just stops anyone picking an unrenderable name. */
function cleanName(v){
  return String(v||'').toUpperCase().replace(/[^A-Z0-9 .-]/g,'').trim().slice(0,14);
}
/* Taking on an id from another device. The code is accepted even when the
   board has no row for it yet - a player may be recovering before they ever
   finished a run - but the name and hull are pulled back when it does. */
function adoptShip(k){
  for(var i=0;i<SHIP_THEMES.length;i++)
    if(SHIP_THEMES[i].k===k&&shipUnlocked(i)){
      /* setShipTheme, not a bare assignment: it rebuilds the sprite too.
         Assigning the index alone left the ship still painted its old colour
         until the page was reloaded. */
      setShipTheme(i);return true;}
  return false;
}
function applyCode(code){
  playerId=code;
  try{localStorage.setItem('vr_pid',code);}catch(e){}
}
function recoverFound(rows,code){
  for(var i=0;i<rows.length;i++)if(rows[i].id===code){
    if(rows[i].name){playerName=rows[i].name;
      try{localStorage.setItem('vr_name',playerName);}catch(e){}}
    adoptShip(rows[i].ship);
    return rows[i];
  }
  return null;
}
function lbRecover(code){
  applyCode(code);
  if(!canFetch()){codeBusy=false;codeMsg='SAVED - NO CONNECTION TO CHECK';return;}
  codeBusy=true;codeMsg='CHECKING...';
  var done=false,t=null;
  function finish(d){
    if(done)return;
    done=true;codeBusy=false;
    if(t!==null&&typeof clearTimeout==='function')clearTimeout(t);
    if(d&&d.ok&&d.rows){
      LB.rows=d.rows;LB.mode='live';
      var row=recoverFound(d.rows,code);
      if(row){codeMsg='WELCOME BACK '+row.name;askName=false;
        if(nameIn){nameIn.blur();nameIn.style.display='none';}}
      else codeMsg='NO RUNNER WITH THAT CODE YET';
    } else codeMsg='COULD NOT REACH THE BOARD';
  }
  try{
    if(typeof setTimeout==='function')t=setTimeout(function(){finish(null);},8000);
    fetch('/api/scores?v='+BOARD_ERA,{method:'GET'})
      .then(function(r){return r.json();})
      .then(finish)
      .catch(function(){finish(null);});
  }catch(e){finish(null);}
}
/* The board's era, deliberately NOT the version string. Cosmetic releases
   and bug fixes keep their scores; a release that changes what the game asks
   of a player starts a fresh table, and the old one stays readable beside it.
   Era 4 is ALPHA. The fairness guard is gone, the XP curve and the card odds
   are rebuilt and heavies no longer keep their distance, so a wave reached
   under era 2 is not the same achievement as that wave now.
   Era 2, V1.74 to V2.18, is kept beside it as PREALPHA, read only.
   Era 3 is skipped. It was the alpha board for the few minutes before V2.22,
   and in that window the era-blind lbBest let one player's prealpha run get
   re-sent onto it - a wave-111 row on a board nobody could honestly hold one
   on yet. There is no way to delete a row through the API (a POST is only
   accepted if it beats the stored one), so the board moves on instead. That
   also immunises it against anyone still playing a pre-V2.22 tab: their
   stale run lands on v3, which nothing reads.
   Era 1, everything up to V1.73, is no longer shown either. Nothing was ever
   deleted to drop an era: the server keys scores under v<era>/, so dropping a
   tab only stops reading that prefix and every row is still in the store. */
var BOARD_ERA='4', PREV_ERA='2';
function majorVer(){return LB.era||BOARD_ERA;}
/* Your own run belongs to the current era, so it is only ever merged into
   that board - never onto the prealpha one, which is now frozen history. */
function viewingCurrent(){return (LB.era||BOARD_ERA)===BOARD_ERA;}

/* rows: [{id,name,wave,score,ship}]. mode: 'live' once the server answers,
   'local' when it cannot be reached, which is every artifact view since those
   pages are not allowed to call out. */
/* era mirrors BOARD_ERA rather than repeating it: the two drifted apart when
   the eras rotated and the board quietly kept loading the old one. */
var LB={rows:[],mode:'local',busy:false,err:'',scroll:0,era:BOARD_ERA};

/* The device's best run IN THIS ERA, and the era test is the point of it.
   This used to hand back whatever was in vr_best regardless, which is how a
   prealpha run climbed onto the alpha board: lbSubmit builds the optimistic
   row from here, so finishing a modest alpha run looked up a wave-111
   prealpha record and showed that instead - briefly correct, then overwritten
   by the merge. A record written before the era field existed predates era 3
   by definition, so a missing era counts as another era's too.
   The record it hides is not lost: it is on that era's board on the server,
   and that board is read only, so nothing here needs it any more. */
/* The era test alone was not enough. A demo run used to be able to write
   vr_best before anything checked whether it was a test, and that guard
   arrived in V2.34 - but it only stopped NEW records. The poisoned one
   already on the device survived it, carried the live era, and so passed
   every test here. lbReconcile then pushed it back onto the board the moment
   a real row existed to "correct", which is why deleting the row server-side
   did not hold: the device simply posted it again on the next board load.
   So a record now has to say which generation of this code wrote it. Anything
   older cannot be vouched for and is ignored - once, on every device. The
   cost is the stranded-run safety net for runs that predate the stamp; those
   are already on the board, because reconcile only ever CORRECTS a row that
   is on it. Bump LB_GEN only to retire records that cannot be trusted. */
var LB_GEN='2';
function lbBest(){
  try{
    var b=JSON.parse(localStorage.getItem('vr_best')||'null');
    return (b&&b.era===BOARD_ERA&&b.gen===LB_GEN)?b:null;
  }catch(e){return null;}
}
/* The hull is stored WITH the run that earned it. Reading the current colour
   instead meant repainting your ship silently recoloured a record set in a
   different one. */
function lbLocalRows(){
  var b=lbBest();
  if(!b)return [];
  return [{id:playerId,name:playerName||'YOU',wave:b.wave,score:b.score,
           ship:b.ship||SHIP_THEMES[shipTheme].k}];
}
function lbRememberLocal(wave,score){
  var cur=lbBest();
  if(!cur||wave>cur.wave||(wave===cur.wave&&score>cur.score)){
    cur={wave:wave,score:score,ship:SHIP_THEMES[shipTheme].k,era:BOARD_ERA,gen:LB_GEN};
    try{localStorage.setItem('vr_best',JSON.stringify(cur));}catch(e){}
  }
  return cur;
}
/* The run just finished on this device, held until the board reports it back
   by itself. The write lands before the key listing catches up, so the POST's
   own echo of the board - and a GET a second behind it - can both come back
   without the row that was just written. That is what left the board empty
   after a run until something happened to reload it. */
var myRow=null;
function lbMergeMine(rows){
  if(!myRow||!rows||!viewingCurrent())return rows;
  var i,at=-1;
  for(i=0;i<rows.length;i++)if(rows[i].id===playerId){at=i;break;}
  if(at<0)rows.push(myRow);
  else if(myRow.wave>rows[at].wave||
         (myRow.wave===rows[at].wave&&myRow.score>rows[at].score))rows[at]=myRow;
  rows.sort(function(a,b){return (b.wave-a.wave)||(b.score-a.score)||((a.at||0)-(b.at||0));});
  return rows;
}
function lbApply(data){
  if(data&&data.ok&&data.rows){
    LB.rows=lbMergeMine(data.rows);LB.mode='live';LB.err='';
    if(viewingCurrent())lbReconcile();   /* send a stranded run if we have one */
    return true;
  }
  return false;
}
/* Ask again a few times after a submit, so the board converges on its own
   instead of waiting for the player to go and poke it. */
/* Other people's runs land on the board while you are sitting looking at it.
   Without this the board only reloaded when you navigated to it, so a friend
   finishing a run went unseen until the app was closed and reopened. */
var LB_POLL=20,lbPoll=LB_POLL;
function lbTick(dt){
  if(state===MENU||state===BOARD){
    lbPoll-=dt;
    if(lbPoll<=0){lbPoll=LB_POLL;lbLoad();}
  } else lbPoll=LB_POLL;
}
function lbRefreshSoon(){
  if(typeof setTimeout!=='function')return;
  var tries=[1500,4000,9000],i;
  for(i=0;i<tries.length;i++)setTimeout(lbLoad,tries[i]);
}
function lbFallback(){
  if(LB.mode!=='live'){LB.rows=viewingCurrent()?lbLocalRows():[];LB.mode='local';}
}
/* The board is a nice-to-have: nothing in here may ever stop the game
   starting, so every call is guarded and failure just means a local board. */
function canFetch(){return typeof fetch==='function';}
function lbLoad(era){
  if(era&&era!==LB.era){LB.era=era;LB.rows=[];LB.mode='local';LB.scroll=0;LB.busy=false;}
  if(LB.busy)return;
  /* No optimistic local row up front. It was drawn from the CURRENT hull and
     name, so the board flashed your run in the wrong colour for a moment and
     then corrected itself the instant the server answered. LOADING, then the
     truth. The local row is still the fallback when the fetch fails. */
  if(!canFetch()){lbFallback();return;}
  LB.busy=true;
  var done=false,t=null,want=LB.era;      /* the tab this reply belongs to */
  function finish(d){
    if(done)return;
    done=true;
    if(t!==null&&typeof clearTimeout==='function')clearTimeout(t);
    /* Tab changed while this was in flight: a newer request owns the board,
       so drop this reply rather than painting one era's rows under another. */
    if(want!==LB.era)return;
    LB.busy=false;
    if(!d||!lbApply(d))lbFallback();
  }
  try{
    if(typeof setTimeout==='function')t=setTimeout(function(){finish(null);},8000);
    fetch('/api/scores?v='+majorVer(),{method:'GET'})
      .then(function(r){return r.json();})
      .then(finish)
      .catch(function(){finish(null);});
  }catch(e){finish(null);}
}
/* Test runs from the wave picker never post: they start pre-levelled, so they
   are not comparable with a run played from wave 1.
   They must not be REMEMBERED either, and that was the harder half. This used
   to remember first and check testRun second, so a demo run wrote its wave
   and score into vr_best as the device's honest record. It never posted - but
   everything downstream reads that record rather than the run just finished.
   The next real run drew its own board row from it, and lbReconcile would see
   the board holding less than the device remembered and push the demo's
   numbers up as a correction. A wave-20 run came back as wave 100. */
function lbSubmit(wave,score){
  if(testRun)return;
  lbRememberLocal(wave,score);
  if(!canFetch())return;
  /* Show it straight away, but show the BEST run this device knows about,
     not necessarily the one just finished: a worse run must not repaint the
     record that is still standing. */
  var b=lbBest()||{wave:wave,score:score,ship:SHIP_THEMES[shipTheme].k};
  myRow={id:playerId,name:playerName||'ANON',wave:b.wave,score:b.score,
         ship:b.ship||SHIP_THEMES[shipTheme].k,at:Date.now()};
  LB.rows=lbMergeMine(LB.rows?LB.rows.slice():[]);
  lbRefreshSoon();
  try{
    fetch('/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:playerId,name:playerName||'ANON',wave:wave,score:score,
                           ship:SHIP_THEMES[shipTheme].k,v:BOARD_ERA})})
      .then(function(r){return r.json();})
      .then(function(d){if(!lbApply(d))lbFallback();})
      .catch(function(){lbFallback();});
  }catch(e){lbFallback();}
}
/* A submit that never landed leaves the player's real run stranded: the
   server rejected every wave past 100 until that bound was raised, so the
   board kept only the 100 banked at the gate while the device remembered the
   true result all along. lbRememberLocal runs BEFORE the network call, so
   vr_best is always the honest record.
   So whenever the board comes back, if this device remembers a better run
   than the board holds for us, send it again. One attempt per session, so a
   server that is still refusing does not get hammered once a run per load. */
var lbReconciled=false;
function lbReconcile(){
  if(lbReconciled||testRun||!canFetch()||!playerId)return;
  var b=lbBest();
  if(!b||!b.wave)return;
  /* Records written from here on carry the era they were set in; an older one
     has no era and is judged by the rule below instead. */
  if(b.era&&b.era!==BOARD_ERA)return;
  var mine=null,i;
  for(i=0;i<LB.rows.length;i++)if(LB.rows[i].id===playerId){mine=LB.rows[i];break;}
  /* Only ever CORRECT a row we already hold on this board. Pushing a local
     best onto a board we have no row on would drag prepatch runs into the
     current era, which is the one thing the era split exists to prevent. */
  if(!mine)return;
  if(!(b.wave>mine.wave||(b.wave===mine.wave&&b.score>mine.score)))return;
  lbReconciled=true;
  try{
    fetch('/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:playerId,name:playerName||'ANON',wave:b.wave,
                           score:b.score,ship:b.ship||SHIP_THEMES[shipTheme].k,
                           v:BOARD_ERA})})
      .then(function(r){return r.json();})
      .then(function(d){lbApply(d);})
      .catch(function(){});
  }catch(e){}
}
function lbRank(){
  for(var i=0;i<LB.rows.length;i++)if(LB.rows[i].id===playerId)return i+1;
  return 0;
}
function shipColour(k){
  for(var i=0;i<SHIP_THEMES.length;i++)if(SHIP_THEMES[i].k===k)return SHIP_THEMES[i].B;
  return '#2b7fe0';
}
function shipTheme4(k){
  for(var i=0;i<SHIP_THEMES.length;i++)if(SHIP_THEMES[i].k===k)return SHIP_THEMES[i];
  return SHIP_THEMES[1];
}
/* The player's own ship, one canvas pixel per sprite pixel, painted in their
   hull colours. A coloured dot said which colour they picked; this says which
   ship they flew. 15x15, which drops into a 20px board row. */
var SHIPMARK_W=15;
function drawShipMark(x,y,k){
  var th=shipTheme4(k),r,c,ch,col;
  for(r=0;r<SHIP.length;r++)for(c=0;c<SHIP[r].length;c++){
    ch=SHIP[r].charAt(c);
    if(ch==='.')continue;
    col=(ch==='A')?th.A:(ch==='B')?th.B:(ch==='C')?th.C:PAL[ch];
    if(!col)continue;
    ctx.fillStyle=col;ctx.fillRect(x+c,y+r,1,1);
  }
}

/* ================= main menu ================= */
/* The top block is a fixed stack measured from the top of the canvas; the
   buttons then centre themselves in whatever room is left above the footer,
   so a tall phone spreads out instead of leaving a gap at the bottom. */
/* Everything on the menu hangs off this margin rather than sitting at a fixed
   y, so a tall phone gives the title room to breathe instead of pinning it to
   the top edge, and a short canvas still fits. */
function menuTop(){return Math.round(H*0.045);}
/* There used to be a strapline here. With it gone the board moves up to close
   the gap rather than leaving a hole where the text was. */
/* Two lines to a row. On one line the numbers took everything and a name was
   clipped to five characters - SOFIHATTA came out as SOFIH. The name now has
   the top line to itself and the figures sit beneath it, which costs 8px a
   row and still leaves room under the panel for the hint and the buttons. */
var LB_ROWS=5,LB_RH=28;
/* Five is the number we want, and on a phone five is what you get. The row
   is two lines deep so that a long name is never cut to fit a long score,
   which costs height - and on a very short canvas the four menu buttons below
   cannot then reach their minimum size without running into the footer. There
   the board gives up a row rather than the menu giving up a button. */
function lbRows(){
  var n=LB_ROWS;
  while(n>3&&lbTop()-10+(n*LB_RH+14)+22+(4*26+3*5)>H-46)n--;
  return n;
}
/* The build badge's two dials. TB_BOB is how far it travels from centre, in
   whole pixels because the glyphs are pixels - there is no half step between 1
   and 2. Both the bob's own cap and the wordmark lift below are derived from
   these, so changing one number moves everything that depends on it. */
var TB_CLEAR=2,TB_BOB=1;
function lbTop(){return menuTop()+21+Math.round(H*0.040)+26;}
/* The wordmark normally sits at the top of the menu stack, but on a canvas
   squashed to the 1.50 aspect floor the gap beneath it is 11px, which a 7px
   badge cannot bob inside without touching the wordmark or the heading under
   it. The board cannot give the space back - on those canvases it is already
   down to four rows - so the wordmark lifts by the shortfall instead, which
   costs nothing but the air above it and leaves the rest of the stack where it
   was. Tall screens have the room already and are untouched. */
function titleY(){
  var want=FH+TB_CLEAR*2+TB_BOB*2;           /* glyph, its air, and room to bob */
  var have=(lbTop()-30)-(menuTop()+FH*3);
  return Math.max(4,menuTop()-Math.max(0,want-have));
}
function menuStackEnd(){var p=lbPanel();return p.y+p.h+14;}
function lbPanel(){return {x:12,y:lbTop()-10,w:W-24,h:lbRows()*LB_RH+14};}
var C_GOLD='#ffd34d';
/* Insanity has one colour wherever it is marked - the board and the HUD - so
   a purple wave number means the same thing in both places. */
var C_INS='#c86bff';
function lbRowRect(i){return {x:16,y:lbTop()+i*LB_RH,w:W-32,h:LB_RH};}

/* the name card, drawn over the menu */
/* The code modes carry a line under the field - a status message, or the
   'do not share it' warning - so the card grows to make room for it rather
   than letting that line land on top of the buttons. */
function cardTall(){return promptMode==='code'||promptMode==='show';}
/* Typing raises a keyboard over roughly the bottom half of the phone, so the
   card and its buttons move up out of the way. Nothing is typed on the
   read-only code card, so that one stays where a modal normally sits. */
function cardTop(){return Math.round(H*(promptMode==='show'?0.30:0.15));}
function nameCard(){return {x:20,y:cardTop(),w:W-40,h:cardTall()?122:104};}
function nameFieldRect(){var c=nameCard();return {x:c.x+14,y:c.y+34,w:c.w-28,h:22};}
function nameBtnTop(){var c=nameCard();return c.y+(cardTall()?86:68);}
/* Dismiss sits on the left, confirm on the right. */
function nameLaterRect(){var c=nameCard();
  return {x:c.x+14,y:nameBtnTop(),w:Math.round((c.w-38)/2),h:24};}
function nameOkRect(){var c=nameCard(),l=nameLaterRect();
  /* Showing your own code needs one button, not a choice, so it spans. */
  if(promptMode==='show')return {x:c.x+14,y:nameBtnTop(),w:c.w-28,h:24};
  return {x:l.x+l.w+10,y:l.y,w:c.w-28-l.w-10,h:24};}

/* one row of the board, shared by the menu and the full screen.
   Top line: rank, hull, name. Bottom line, indented under the name: the wave
   and the score. Names run to 14 characters and the longest possible figures
   are nowhere near the right edge, so nothing is ever clipped. */
function drawLbRow(r,row,rank,me){
  if(me){ctx.fillStyle='rgba(143,233,255,0.10)';ctx.fillRect(r.x,r.y,r.w,r.h);}
  var y1=r.y+4,y2=r.y+15;
  txt(rank,r.x+3,y1,rank<=3?'#ffd34d':'#5f6a7a');
  drawShipMark(r.x+20,r.y+Math.round((r.h-SHIP.length)/2),row.ship);
  var nX=r.x+20+SHIPMARK_W+6;
  txt(String(row.name||'ANON'),nX,y1,me?'#ffffff':'#9fd8ff');
  var wTxt='WAVE '+row.wave,sTxt='SCORE '+row.score;
  /* past the gate the wave goes purple: that run was fought in insanity */
  txt(wTxt,nX,y2,row.wave>MAXWAVE?C_INS:'#ffe066');
  txt(sTxt,nX+txtW(wTxt)+10,y2,'#7fb4e8');
}
function drawBoardBlock(){
  var p=lbPanel();panel(p,C_GOLD);
  txtBig('LEADERBOARD',W/2,lbTop()-30,C_GOLD,2);
  if(!LB.rows.length){
    txt(LB.busy?'LOADING':'NO RUNS YET',W/2,p.y+Math.round(p.h/2)-10,'#3f6490',true);
    txt(LB.busy?'':'BE THE FIRST',W/2,p.y+Math.round(p.h/2)+2,'#2e3f58',true);
  }else{
    for(var i=0;i<Math.min(lbRows(),LB.rows.length);i++)
      drawLbRow(lbRowRect(i),LB.rows[i],i+1,LB.rows[i].id===playerId);
  }
  var rk=lbRank(),hint;
  if(LB.mode!=='live')hint='LOCAL ONLY - BOARD IS OFFLINE HERE';
  else if(rk>lbRows())hint='YOU ARE #'+rk+'  -  TAP FOR THE FULL BOARD';
  else hint='TAP FOR THE FULL BOARD';
  txt(hint,W/2,p.y+p.h+5,'#2e3f58',true);
}
/* NEW RUN takes the title's own blue so the top of the menu reads as one
   piece. HOW TO PLAY is a bright green, well clear of the GREEN hull's
   #37a837: SPACESHIP is painted in the chosen hull colour and sits directly
   above it, so a green at the hull's own brightness would make two adjacent
   buttons look identical - the same trap the old DEMO MODE amber was picked
   to avoid against the ORANGE hull. SPACESHIP's value below is only a
   fallback - the draw always overrides it with the hull. */
/* Four. A fifth full-width button does not fit a 256x384 canvas - the stack
   bottoms out at its tappable floor and still runs 29px into the footer - so
   AI RUN lives on the gameplay page instead, below HOW TO PLAY. */
var MENU_ITEMS=[['NEW RUN','#8fe9ff'],['SPACESHIP','#c86bff'],
                ['HOW TO PLAY','#5cff5c'],['SETTINGS','#ff6b6b']];
/* The hull button is the one row whose frame and whose contents are coloured
   separately: the frame AND the label keep the purple that settings used to
   wear, and the hull you chose shows only in the ship sprite itself. Settings
   takes a red at the same brightness the purple had, so the set keeps its
   even weight. */
function menuChrome(i){return MENU_ITEMS[i][1];}
function menuContent(i){
  return MENU_ITEMS[i][0]==='SPACESHIP'?SHIP_THEMES[shipTheme].B:MENU_ITEMS[i][1];
}
/* Four buttons do not fit a 256x384 canvas at the old fixed 34+11, and the
   old code just overflowed - the bottom one landed on the footer. So the gap
   closes first, then the buttons themselves shrink, both to a floor that
   stays comfortably tappable. Roomy screens are unchanged. */
function menuRect(i){
  var n=MENU_ITEMS.length,h=34,gap=11;
  var lo=menuStackEnd()+8,hi=H-46,avail=hi-lo;   /* leaves the footer clear */
  if(n*h+(n-1)*gap>avail){
    gap=Math.max(5,Math.floor((avail-n*h)/(n-1)));
    if(n*h+(n-1)*gap>avail)
      h=Math.max(26,Math.floor((avail-(n-1)*gap)/n));
  }
  var tot=n*h+(n-1)*gap;
  var top=lo+Math.max(0,Math.round((avail-tot)/2));
  return {x:30,y:top+i*(h+gap),w:W-60,h:h};
}
function menuGapTop(){return menuStackEnd()+8;}
/* The wave-100 gate. One tap and the run carries on into insanity; the 100 is
   already banked, so there is nothing to lose by going through. */
function enterInsanity(){
  if(state!==WIN)return false;
  state=PLAY;MUS.start();
  startWave(MAXWAVE);          /* zero-based, so this is wave 101 */
  banner='INSANITY';bannerT=2.4;
  return true;
}
function toMenu(){
  state=MENU;setPage=0;pickBuf='';running=false;confirmAct='';MUS.stop();
  autoPlay=false;pickBot=false;
  lbLoad(BOARD_ERA);                /* the menu is always the live board */
  aliens=[];bullets=[];rocks=[];parts=[];shocks=[];dnums=[];ups=[];
  bannerT=0;alarmT=0;shake=0;
}
function menuPick(i){
  if(i<0||i>=MENU_ITEMS.length)return;
  var lab=MENU_ITEMS[i][0];
  sfx.pick();
  if(lab==='NEW RUN'){testRun=false;reset();}

  /* DEMO MODE used to sit here. The whole thing - the wave picker, the PICK
     state, jumpToWave and the testRun guards that keep a demo off the board -
     is still in place and still tested; only the way in was taken off the
     menu. Putting it back is this line and one entry in MENU_ITEMS. */
  else if(lab==='HOW TO PLAY'){state=INFO;infoBack=MENU;}
  else if(lab==='SPACESHIP'){state=SETTINGS;setPage=1;setBack=MENU;}
  else{state=SETTINGS;setPage=0;setBack=MENU;}
}

/* The field is invisible and sits exactly over the drawn one, so the phone
   raises its own keyboard while the canvas does all the drawing. */
function placeNameInput(){
  if(!nameIn||!askName)return;
  var r=cv.getBoundingClientRect(),sc=r.width/W,f=nameFieldRect();
  nameIn.style.left=(r.left+f.x*sc)+'px';
  nameIn.style.top=(r.top+f.y*sc)+'px';
  nameIn.style.width=(f.w*sc)+'px';
  nameIn.style.height=(f.h*sc)+'px';
}
if(nameIn){
  nameIn.addEventListener('input',function(){
    if(promptMode==='code'){
      /* Keep the dashes the player can see in the field, store the raw code. */
      nameDraft=cleanCode(nameIn.value);
      var pretty=codeFmt(nameDraft);
      if(nameIn.value!==pretty)nameIn.value=pretty;
      if(codeMsg&&!codeBusy)codeMsg='';
      return;
    }
    nameDraft=cleanName(nameIn.value);
    if(nameIn.value!==nameDraft)nameIn.value=nameDraft;
  });
  nameIn.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();if(promptReady())closeNamePrompt(true);}
    else if(e.key==='Escape'){e.preventDefault();closeNamePrompt(false);}
  });
}

/* ================= confirm ================= */
/* Leaving or restarting mid-run throws the run away, so it asks first. The
   confirm button is labelled with the action rather than a bare "continue",
   which reads just as much like "carry on playing". */
var confirmAct='';
function askConfirm(what){confirmAct=what;}
function confirmCard(){return {x:22,y:Math.round(H*0.34),w:W-44,h:92};}
function confirmYes(){var c=confirmCard();
  return {x:c.x+12,y:c.y+c.h-34,w:Math.round((c.w-34)/2),h:24};}
function confirmNo(){var c=confirmCard(),y=confirmYes();
  return {x:y.x+y.w+10,y:y.y,w:c.w-24-y.w-10,h:24};}
function drawConfirm(){
  ctx.fillStyle='rgba(3,5,12,0.84)';ctx.fillRect(0,0,W,H);
  var c=confirmCard();panel(c,'#e03b3b');
  txt(confirmAct==='menu'?'LEAVE THIS RUN':'RESTART THIS RUN',W/2,c.y+12,'#ff9a9a',true);
  txt('WAVE '+(wi+1)+'   SCORE '+score,W/2,c.y+26,'#ffe066',true);
  txt('THIS RUN WILL BE LOST',W/2,c.y+40,'#5f6a7a',true);
  var y=confirmYes(),n=confirmNo();
  panel(y,'#e03b3b');
  txt(confirmAct==='menu'?'MAIN MENU':'RESTART',y.x+Math.round(y.w/2),y.y+Math.round((y.h-FH)/2),'#ff9a9a',true);
  panel(n,'#4fc01f');
  txt('CANCEL',n.x+Math.round(n.w/2),n.y+Math.round((n.h-FH)/2),'#b9ffa8',true);
}
function doConfirm(){
  var a=confirmAct;confirmAct='';
  if(a==='menu')toMenu();
  else if(a==='restart')reset();
}

/* ================= name card ================= */
/* Is what is typed good enough for the CONTINUE button to light up? */
function promptReady(){
  if(promptMode==='code')return codeOk(cleanCode(nameDraft));
  return cleanName(nameDraft).length>0;
}
function promptTitle(){
  if(promptMode==='code')return 'ENTER A RECOVERY CODE';
  if(promptMode==='show')return 'YOUR RECOVERY CODE';
  return nameEdit?'CHANGE YOUR NAME':'WHO ARE YOU';
}
function promptSub(){
  if(promptMode==='code')return 'TAKES BACK YOUR RUNS AND NAME';
  if(promptMode==='show')return 'KEEP THIS - IT IS HOW YOU GET BACK IN';
  return 'YOUR NAME ON THE LEADERBOARD';
}
function drawNameCard(){
  ctx.fillStyle='rgba(3,5,12,0.82)';ctx.fillRect(0,0,W,H);
  var c=nameCard();panel(c,promptMode==='show'?'#ffd34d':'#4fa3ff');
  txt(promptTitle(),W/2,c.y+10,promptMode==='show'?'#ffd34d':'#8fe9ff',true);
  txt(promptSub(),W/2,c.y+22,'#3f6490',true);
  var f=nameFieldRect(),ty=f.y+Math.round((f.h-FH)/2);

  if(promptMode==='show'){
    /* Nothing to type: the code is just read off the card. */
    ctx.fillStyle='#070b16';ctx.fillRect(f.x,f.y,f.w,f.h);
    ctx.fillStyle='#5e4a0b';
    ctx.fillRect(f.x,f.y,f.w,1);ctx.fillRect(f.x,f.y+f.h-1,f.w,1);
    ctx.fillRect(f.x,f.y,1,f.h);ctx.fillRect(f.x+f.w-1,f.y,1,f.h);
    txt(codeFmt(playerId),W/2,ty,'#ffe066',true);
    txt('DO NOT SHARE IT',W/2,f.y+f.h+6,'#3f6490',true);
    var done=nameOkRect();
    panel(done,'#4fc01f');
    txt('DONE',done.x+Math.round(done.w/2),
        done.y+Math.round((done.h-FH)/2),'#b9ffa8',true);
    return;
  }

  ctx.fillStyle='#070b16';ctx.fillRect(f.x,f.y,f.w,f.h);
  ctx.fillStyle='#24405f';
  ctx.fillRect(f.x,f.y,f.w,1);ctx.fillRect(f.x,f.y+f.h-1,f.w,1);
  ctx.fillRect(f.x,f.y,1,f.h);ctx.fillRect(f.x+f.w-1,f.y,1,f.h);
  var shown=(promptMode==='code')?codeFmt(cleanCode(nameDraft)):nameDraft;
  if(shown)txt(shown,f.x+7,ty,'#ffffff');
  else txt(promptMode==='code'?'TAP TO TYPE THE CODE':'TAP TO TYPE',f.x+7,ty,'#2e3f58');
  if(Math.floor(gameT*2)%2===0){                     /* caret */
    ctx.fillStyle='#8fe9ff';
    ctx.fillRect(f.x+7+txtW(shown)+(shown?1:0),ty-1,1,FH+2);
  }
  if(promptMode==='code'&&codeMsg)
    txt(codeMsg,W/2,f.y+f.h+6,codeBusy?'#3f6490':'#ffe066',true);
  var ok=nameOkRect(),later=nameLaterRect(),can=promptReady();
  panel(later,'#3f6490');
  txt((promptMode==='code'||nameEdit)?'CANCEL':'LATER',later.x+Math.round(later.w/2),
      later.y+Math.round((later.h-FH)/2),'#9fd8ff',true);
  panel(ok,can?'#4fc01f':'#2b3340');
  txt(promptMode==='code'?'RECOVER':'CONTINUE',ok.x+Math.round(ok.w/2),
      ok.y+Math.round((ok.h-FH)/2),can?'#b9ffa8':'#4a5260',true);
}
function openNamePrompt(edit){
  promptMode='name';codeMsg='';codeBusy=false;
  askName=true;nameEdit=!!edit;nameDraft=playerName||'';
  if(nameIn){nameIn.value=nameDraft;nameIn.setAttribute('maxlength','14');
    placeNameInput();nameIn.style.display='block';
    try{nameIn.focus({preventScroll:true});}catch(e){try{nameIn.focus();}catch(e2){}}}
}
function openCodePrompt(){
  promptMode='code';codeMsg='';codeBusy=false;
  askName=true;nameEdit=true;nameDraft='';
  /* 32 raw characters plus the dashes the field shows them in. */
  if(nameIn){nameIn.value='';nameIn.setAttribute('maxlength','40');
    placeNameInput();nameIn.style.display='block';
    try{nameIn.focus({preventScroll:true});}catch(e){try{nameIn.focus();}catch(e2){}}}
}
function openCodeShow(){
  promptMode='show';codeMsg='';codeBusy=false;
  askName=true;nameEdit=true;nameDraft='';
  if(nameIn){nameIn.blur();nameIn.style.display='none';}
}
function closeNamePrompt(save){
  if(save&&promptMode==='code'){
    /* Stays open: the answer comes back from the board a moment later and is
       drawn on this card, so closing here would hide it. */
    var c=cleanCode(nameDraft);
    if(codeOk(c))lbRecover(c);
    return;
  }
  if(save&&promptMode==='name'){
    var n=cleanName(nameDraft);
    if(n){playerName=n;try{localStorage.setItem('vr_name',n);}catch(e){}}
  }
  askName=false;promptMode='name';codeMsg='';codeBusy=false;
  if(nameIn){nameIn.blur();nameIn.style.display='none';
    nameIn.setAttribute('maxlength','14');}
  fit();                       /* keyboard gone: measure the real viewport again */
}

/* ================= full leaderboard ================= */
/* Two tabs across the top of the full board: the live table, and the frozen
   one from before the roster patch. */
var BOARD_TABS=[['ALPHA','4'],['PREALPHA','2']];
function boardTabRect(i){
  var gap=8,w=Math.round((W-32-gap)/2);
  return {x:16+i*(w+gap),y:40,w:w,h:18};
}
function boardRowRect(i){return {x:16,y:92+i*LB_RH-LB.scroll,w:W-32,h:LB_RH};}
/* BACK and REFRESH share the footer row the back button used to have. */
function boardBackRect(){var r=backRect();return {x:r.x,y:r.y,w:Math.round((r.w-10)/2),h:r.h};}
function boardRefreshRect(){
  var r=backRect(),b=boardBackRect();
  return {x:b.x+b.w+10,y:r.y,w:r.w-b.w-10,h:r.h};
}
function boardMaxScroll(){
  var visible=H-92-56;
  return Math.max(0,LB.rows.length*LB_RH-visible);
}
function drawBoard(){
  txtBig('LEADERBOARD',W/2,18,'#ffe066',2);

/* ================= wave picker ================= */
/* 10x10 of every wave in the run, so any wave is one tap away. Boss waves
   (every tenth) are picked out in gold. */
var PICK_CW=22,PICK_CH=18,PICK_GAP=2;
function pickGridX(){return Math.round((W-(10*PICK_CW+9*PICK_GAP))/2);}
function pickGridY(){
  var gh=10*PICK_CH+9*PICK_GAP;
  return Math.max(70,Math.round((H-40-gh)/2)+10);
}
function pickRect(n){                        /* n is 1..100 */
  var k=n-1,col=k%10,row=(k/10)|0;
  return {x:pickGridX()+col*(PICK_CW+PICK_GAP),y:pickGridY()+row*(PICK_CH+PICK_GAP),
          w:PICK_CW,h:PICK_CH};
}
function pickAt(mx,my){
  for(var n=1;n<=MAXWAVE;n++)if(inRect(pickRect(n),mx,my))return n;
  return 0;
}

    ctx.fillRect(r.x,r.y,1,r.h);ctx.fillRect(r.x+r.w-1,r.y,1,r.h);

     field ever saw them: typing an A did nothing. While the field is up the

  }

    if(k==='escape'||k==='n')confirmAct='';
    else if(k==='enter'||k==='y')doConfirm();
    return;
  }
  if(state===SETTINGS){
    if(k==='p'||k==='escape'){if(setPage)setPage=0;else closeSettings();return;}
    if(k>='1'&&k<='9'){
      var n=+k-1;
      if(setPage===1){var slk=shipList();if(n<slk.length){setShipTheme(slk[n]);sfx.pick();setPage=0;}}
      else if(setPage===2){if(n<CHAN.length)chanToggleHit(n);}
