  ctx.fillRect(r.x,r.y,1,r.h);ctx.fillRect(r.x+r.w-1,r.y,1,r.h);
}
/* Every stat in the colour it wears in the HUD, so this page and that bar
   agree without anyone having to hold two palettes in their head. Lines are
   broken by hand - txt does not wrap - and 40 characters is the most that
   fits 256 columns with a margin either side.
   The wording follows what the code actually does. The one that surprises
   people is that a percentage card ADDS to its multiplier rather than
   scaling it: upFire starts at 1 and a +25% card adds 0.25, so the tenth one
   is worth exactly what the first was. */
function infoRows(){return [
  ['FIRE RATE',  C_FIRE, ['BULLETS A SECOND. STARTS AT 10.',
                          'EACH CARD ADDS THE SAME STEP.']],
  ['DAMAGE',     C_DMG,  ['WHAT ONE BULLET TAKES OFF. ALSO 10.',
                          'CARDS ADD A STEP, THEY DO NOT COMPOUND.']],
  ['CRIT CHANCE',C_CRIT, ['HOW OFTEN A SHOT CRITS. STARTS AT 0%.',
                          '+5% IS FIVE SHOTS IN EVERY HUNDRED.']],
  ['CRIT DAMAGE',C_CRITD,['WHAT A CRIT MULTIPLIES BY. 1.1X FIRST.',
                          'DOES NOTHING UNTIL YOU HAVE CRIT CHANCE.']],
  ['LUCK',       C_LUCK, ['SHIFTS WHICH CARDS YOU ARE OFFERED.',
                          '0% IS MOSTLY COMMON. 1000% IS ALL GOLD.']],
  ['XP GAIN',    C_XP,   ['MULTIPLIES XP, SO MORE LEVELS AND MORE',
                          'CARDS. YOUR SCORE IS NOT AFFECTED.']],
  ['HULL',       '#ff4d6d',['THREE HEARTS, FOUR SEGMENTS EACH.',
                          'KILLING A BOSS PATCHES YOU BACK UP.']]
];}
function drawInfo(){
  ctx.fillStyle='rgba(5,4,12,0.94)';ctx.fillRect(0,0,W,H);
  txtBig('HOW TO PLAY',W/2,16,'#ffe066',2);
  txt('WHAT EVERY CARD ACTUALLY DOES',W/2,34,'#3f6490',true);
  var rows=infoRows(),y=50,i,j;
  for(i=0;i<rows.length;i++){
    txt(rows[i][0],10,y,rows[i][1]);
    for(j=0;j<rows[i][2].length;j++)txt(rows[i][2][j],10,y+9+j*8,'#9fb4cf');
    y+=9+rows[i][2].length*8+7;
  }
  txt('TAP ANYWHERE TO GO BACK',W/2,Math.min(y+6,H-16),'#6f8bb0',true);
}
function drawSettings(){
  ctx.fillStyle='rgba(5,4,12,0.90)';ctx.fillRect(0,0,W,H);
  var i,r;

  if(setPage===1){                                   /* ship colour */
    txtBig('SPACESHIP',W/2,44,'#ffe066',2);
    txt('TAP A COLOUR',W/2,64,'#3f6490',true);
    var sl=shipList();
    for(i=0;i<sl.length;i++){
      r=swatchRect(i);var th=SHIP_THEMES[sl[i]],sel=(sl[i]===shipTheme);
      panel(r,sel?'#ffe066':th.B,sel?'#16233c':'#0a0f1c');
      ctx.drawImage(th.icon,Math.round(r.x+r.w/2-7),r.y+5);
      txt(th.k,r.x+r.w/2,r.y+26,sel?'#ffe066':'#7fb4e8',true);
    }
    r=backRect();panel(r,'#3f6490');
    drawIcon(IC_BACK,r.x+12,r.y+Math.round((r.h-9)/2),'#3f6490');
    txt('BACK',W/2+8,r.y+10,'#9fd8ff',true);
    return;
  }

  if(setPage===4){                                   /* profile */
    txtBig('PROFILE',W/2,44,'#ffe066',2);
    txt('WHO YOU ARE ON THE BOARD',W/2,64,'#3f6490',true);
    var pr=pfRows();
    for(i=0;i<pr.length;i++)drawRow(pfRect(i),pr[i][0],pr[i][1]);
    r=backRect();panel(r,'#3f6490');
    drawIcon(IC_BACK,r.x+12,r.y+Math.round((r.h-9)/2),'#3f6490');
    txt('BACK',W/2+8,r.y+10,'#9fd8ff',true);
    return;
  }

  if(setPage===3){                                   /* gameplay switches */
    txtBig('GAMEPLAY',W/2,44,'#ffe066',2);
    txt('CHANGES HOW THE GAME PLAYS',W/2,64,'#3f6490',true);
    var gr=gpRows();
    for(i=0;i<gr.length;i++)drawRow(gpRect(i),gr[i][0],gr[i][1]);
    var ca=gpCapAfter(),gb=gpRect(ca>=0?ca:gr.length-1);
    txt('AUTO LEVEL PICKS THE BEST CARD',W/2,gb.y+gb.h+5,'#2e3f58',true);
    r=backRect();panel(r,'#3f6490');
    drawIcon(IC_BACK,r.x+12,r.y+Math.round((r.h-9)/2),'#3f6490');
    txt('BACK',W/2+8,r.y+10,'#9fd8ff',true);
    return;
  }

  if(setPage===2){
    txtBig('SOUND',W/2,42,'#ffe066',2);
    for(i=0;i<CHAN.length;i++){
      var cr=chanRect(i),on=chanOn(i),col=on?CHAN[i][1]:'#5a6472';
      panel(cr,col);
      ctx.fillStyle=col;ctx.fillRect(cr.x,cr.y,4,cr.h);
      txt(CHAN[i][0],cr.x+13,cr.y+9,on?'#ffffff':'#9aa7b5');
      var tg=chanToggle(i);
      panel(tg,col,on?'#16233c':'#0a0f1c');
      txt(on?'ON':'OFF',tg.x+tg.w/2,tg.y+7,on?col:'#9aa7b5',true);
      var tr=chanTrack(i);
      ctx.fillStyle='#13203a';ctx.fillRect(tr.x,tr.y,tr.w,tr.h);
      var fw=Math.round(tr.w*chanVal(i));
      ctx.fillStyle=on?col:'#49525e';ctx.fillRect(tr.x,tr.y,fw,tr.h);
      var kx=tr.x+fw;
      ctx.fillStyle=on?'#ffffff':'#8a93a0';
      ctx.fillRect(Math.max(tr.x,Math.min(tr.x+tr.w-3,kx-2)),tr.y-5,4,tr.h+10);
      txt(Math.round(chanVal(i)*100)+'%',cr.x+cr.w-24,tr.y-3,on?'#9fd8ff':'#6b7480',true);
    }
    r=backRect();panel(r,'#3f6490');
    drawIcon(IC_BACK,r.x+12,r.y+Math.round((r.h-9)/2),'#3f6490');
    txt('BACK',W/2+8,r.y+10,'#9fd8ff',true);
    return;
  }
  var rows=pageRows(),n=rows.length,st=setStack();
  /* Paused mid-run, the top bar stays live under the heading: score, wave,
     lives and the XP bar, exactly as the level-up screen shows them. */
  if(setShowsRun())drawHud();
  txtBig('SETTINGS',W/2,st.ys[st.i.head],'#ffe066',2);
  if(setShowsRun()){
    txt('LEVEL '+level+'   WAVE '+(wi+1),W/2,st.ys[st.i.sub],'#8fe9ff',true);
    drawStatGrid(st.ys[st.i.stats]);
    if(shield)txt('SHIELD UP',W/2,st.ys[st.i.stats]+STATGRID_H+4,'#8fe9ff',true);
  }
  for(i=0;i<n;i++)drawRow(pageRect(i),rows[i][0],rows[i][1]);
  txt('VOID RUNNER  '+VERSION,W/2,st.ys[st.i.ver],'#2e3f58',true);
  if(confirmAct)drawConfirm();
}
function drawRow(r,label,val){
    var st=rowStyle(label);
    panel(r,st.c);
    ctx.fillStyle=st.c;ctx.fillRect(r.x,r.y,4,r.h);
    if(st.i){
      var ih=st.i.length,iy=r.y+Math.round((r.h-ih)/2),ix=r.x+11;
      if(label==='SPACESHIP'){
        drawIcon(st.i,ix,iy,SHIP_THEMES[shipTheme].B);
        drawIcon(st.i.slice(0,3),ix,iy,SHIP_THEMES[shipTheme].A);
      } else drawIcon(st.i,ix,iy,st.c);
    }
    txt(label,r.x+29,r.y+Math.round((r.h-FH)/2),st.t);
    if(val)txt(val,r.x+r.w-34,r.y+Math.round((r.h-FH)/2),'#9fd8ff',true);
}
function overlay(title,lines,tcol){
  ctx.fillStyle='rgba(5,4,12,0.82)';ctx.fillRect(0,0,W,H);
  txt(title,W/2,H/2-50,tcol,true);
  for(var i=0;i<lines.length;i++)
    txt(lines[i],W/2,H/2-26+i*12,i===lines.length-1?'#ffe066':'#7fb4e8',true);
}
function render(){
  syncCursor();
  var ox=0,oy=0;
  if(shake>0){ox=(Math.random()*2-1)*shake;oy=(Math.random()*2-1)*shake;}
  ctx.save();ctx.translate(Math.round(ox),Math.round(oy));
  ctx.fillStyle='#05040c';ctx.fillRect(-8,-8,W+16,H+16);
  for(var s=0;s<stars.length;s++){ctx.fillStyle=stars[s].c;ctx.fillRect(Math.round(stars[s].x),Math.round(stars[s].y),1,1);}

  if(runBehind()){
    for(var b=0;b<bullets.length;b++){
      /* x is the bullet's CENTRE. Drawing a 2px bullet from x put its middle
         a pixel right of the nose, which is visible on a 256-wide canvas. */
      var bx=Math.round(bullets[b].x)-1;
      ctx.fillStyle='#ffe066';ctx.fillRect(bx,Math.round(bullets[b].y),2,5);
      ctx.fillStyle='#fff7c2';ctx.fillRect(bx,Math.round(bullets[b].y),2,2);
    }
    drawAliens();drawRocks();
    for(var p=0;p<parts.length;p++){
      var pt=parts[p];
      ctx.globalAlpha=Math.max(0,Math.min(1,pt.life/pt.max));
      ctx.fillStyle=pt.c;ctx.fillRect(Math.round(pt.x),Math.round(pt.y),1,1);
    }
    ctx.globalAlpha=1;
    drawShocks();
    drawHeals();drawDmgNums();drawUpPops();
    if(state===PLAY||state===LEVELUP||state===SETTINGS){drawShip();drawShield();}
    drawHud();
    if(bannerT>0&&state===PLAY){
      /* Bigger than the body text, and purple once past the gate so the wave
         itself says which side of 100 you are on. A boss banner carries its
         name too, so it drops back a size rather than running off the edge. */
      var bc=(wi+1>MAXWAVE)?C_INS:'#ffe066';
      var bk=(txtBigW(banner,2)<=W-10)?2:1;
      if(bk===2)txtBig(banner,W/2,H/2-28,bc,2);
      else txt(banner,W/2,H/2-24,bc,true);
    }
    if(testRun&&(state===PLAY||state===LEVELUP))
      /* Both ride testRun, which is what keeps them off the leaderboard, but
         they are not the same thing and the watermark should not say so.
         The DEMO line cannot currently appear: nothing sets state=PICK since
         the wave picker came off the menu. It stays with the rest of the
         vaulted picker, which is one line from returning. */
      if(autoPlay)txt('BOT  PILOTING',W/2,H-18,'#7cf0c0',true);
      else txt('DEMO  FROM W'+startedAt,W/2,H-18,'#4fa3ff',true);
    if(alarmT>0){
      ctx.fillStyle='rgba(255,70,70,'+(0.30*alarmT/0.6).toFixed(3)+')';
      ctx.fillRect(0,0,W,H);
    }
  }

  /* These two are screens, not playfield, so they are drawn whether or not a
     run is behind them - exactly like INFO, PICK and BOARD below. They used to
     sit INSIDE the block above, which meant the test for "is there a run
     behind this" also decided whether the screen itself got drawn. */
  if(state===LEVELUP)drawLevelUp();
  if(state===SETTINGS)drawSettings();

  if(state===INFO)drawInfo();
  if(state===PICK)drawPick();
  if(state===BOARD)drawBoard();
  if(state===MENU){
    txtBigOut('VOID RUNNER',W/2,titleY(),'#8fe9ff','#7a2fc4',3);
    /* Build badge, tucked under the wordmark's right shoulder and bobbing so it
       reads as a note stuck on rather than part of the title. There is no room
       beside the wordmark - at 3x it is 195 of the 256 columns - so it sits in
       the gap between the title and the LEADERBOARD heading. That gap closes on
       short screens, so the badge centres itself in whatever is there and the
       bob shrinks to match rather than climbing into the heading. */
    var tbTxt=VERSION+' ALPHA';   /* version first, stage after - as in 2.18.0-alpha */
    var tbTop=titleY()+FH*3,tbGap=(lbTop()-30)-tbTop;
    /* Keep TB_CLEAR of air above and below even at the top of the bob, and let
       the bob take only what is left over. Filling the gap exactly reads as
       touching the wordmark and the heading, which is how it looked on a
       desktop window: there the canvas is squashed to the 1.50 aspect floor and
       the gap is 11px for a 7px glyph. Widening the gap instead would push the
       board down, and on those canvases it is already showing four rows rather
       than five - not a trade worth making for a badge. */
    var tbAmp=Math.max(0,Math.min(TB_BOB,Math.floor((tbGap-FH-TB_CLEAR*2)/2)));
    var tbY=tbTop+Math.round((tbGap-FH)/2)+Math.round(Math.sin(gameT*3)*tbAmp);
    txt(tbTxt,W/2+txtBigW('VOID RUNNER',3)/2-txtW(tbTxt),tbY,'#ff79c6');
    drawBoardBlock();
    for(var mi=0;mi<MENU_ITEMS.length;mi++){
      var mr=menuRect(mi),mlab=MENU_ITEMS[mi][0];
      /* frame and contents are separate: only the hull button differs between
         them, and that is what shows your ship without recolouring the row */
      var ch=menuChrome(mi),co=menuContent(mi);
      panel(mr,ch);
      ctx.fillStyle=ch;ctx.fillRect(mr.x,mr.y,4,mr.h);
      var icy=mr.y+Math.round(mr.h/2);
      if(mlab==='NEW RUN')drawIcon(IC_PLAY,mr.x+14,icy-4,co);
      else if(mlab==='HOW TO PLAY')drawIcon(IC_HELP,mr.x+14,icy-4,co);
      else if(mlab==='SPACESHIP')
        ctx.drawImage(SHIP_THEMES[shipTheme].icon,mr.x+11,icy-8);
      else drawGear(co,mr.x+19,icy);
      /* The label takes the frame colour on every row. They are the same value
         everywhere except the hull button, where the chosen colour is carried
         by the ship sprite alone. */
      txt(mlab,W/2,icy-3,ch,true);
    }
    txt(playerName?('PLAYING AS '+playerName):'NO NAME SET',W/2,H-24,'#5f6a7a',true);
    /* Dimmer than the name above it, so it reads as a footnote. */
    txt(VERSION,W/2,H-13,'#2e3f58',true);
  }
  if(state===OVER||state===WIN){
    var acc=shots?Math.round(hits/shots*100):0;
    var build=(FIRE_RATE*upFire).toFixed(1)+' B/S  '+upDmg.toFixed(2)+'x  LUCK '+upLuck+'%'+
              '   CRIT '+upCrit+'% x'+upCritD.toFixed(2);
    if(state===OVER)overlay(overReason||'RUN OVER',[
      'SCORE '+score+'   BEST '+best,
      (wi+1>MAXWAVE?'INSANITY WAVE '+(wi+1):'WAVE '+(wi+1)+' OF '+MAXWAVE)+'   LEVEL '+level,
      build,
      'KILLS '+kills+'   LEAKED '+leaked,
      'DODGED '+dodged+'  BROKEN '+broken+'  ACC '+acc+'%',
      'SPACE / TAP FOR THE MENU'],'#ff5555');
    else overlay('ALL 100 WAVES DOWN',[
      'SCORE '+score+'   BEST '+best+'   LEVEL '+level,
      'THIS RUN IS ON THE BOARD',
      build,
      'BEYOND HERE THE WAVES NEVER STOP.',
      'EVERY ALIEN CARRIES AFFIXES AND THEY STACK.',
      'SPACE / TAP TO ENTER INSANITY'],'#ff5fd2');
  }
  ctx.restore();
  /* Drawn last and outside the screen-shake transform, over whatever screen is
     underneath. Opening it from Profile used to drop you to the menu first,
     which quietly threw away the run you were paused in the middle of. A modal
     also should not wobble, and the real input is positioned against
     untranslated canvas coordinates. */
  if(askName)drawNameCard();
}

/* ================= loop ================= */
var last=performance.now();
/* The canvas is hidden in the stylesheet and this is the one place that shows
   it: after the first render has actually put something on it. The whole game
   is one 215KB inline script, so on a cold load the browser has the canvas
   element long before it has finished parsing the code that sizes and draws
   it - which is why the empty default-sized block only showed SOMETIMES. It
   is a race, and a warm cache usually won it. render() fills the canvas edge
   to edge before anything else, so by the time this runs there is a complete
   frame underneath. */
var shown=false;
function frame(now){
  var dt=(now-last)/1000;last=now;
  if(dt>0.05)dt=0.05;
  update(dt);render();
  if(!shown){shown=true;try{cv.style.visibility='visible';}catch(e){}}
  requestAnimationFrame(frame);
}
ship={x:W/2};aliens=[];bullets=[];rocks=[];parts=[];queue=[];wi=0;
score=0;hp=START_HP;leaked=0;kills=0;shots=0;hits=0;dodged=0;broken=0;gameT=0;
fireT=0;bannerT=0;shake=0;invT=0;lvlInvT=0;respawnT=0;conc=2;gap=1.6;spawnT=0;mplan=null;mT=0;
alarmT=0;lvlFlash=0;
blockT=0;curw=waveDef(0);level=1;xp=0;xpNeed=xpForLevel(1);pendLv=0;choices=null;
/* First visit: ask who they are, over the menu, with Later always available. */
if(!playerName)openNamePrompt();
lbLoad();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
